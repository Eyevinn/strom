# One row per patched plugin: name, base image, GStreamer source tag,
# plugin directory inside gst-plugins-bad. The patches live in patches/<name>/.
#
# decklink is built against 1.22 so it loads in any 1.22+ runtime.
# mpegtsdemux replaces the distro plugin of the same version, so it is built
# from the runtime image's exact GStreamer release on the runtime's base.
decklink     debian:bookworm  1.22.12  sys/decklink
mpegtsdemux  ubuntu:26.04     1.28.2   gst/mpegtsdemux
