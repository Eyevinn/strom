name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.0)'
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.HUB_DOCKER_USERNAME }}/strom

jobs:
  docker-publish:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # For workflow_dispatch, check out the branch (github.ref)
        # For release events, check out the tag (github.ref)
        # The tag input is only used for versioning, not checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.HUB_DOCKER_USERNAME }}
          password: ${{ secrets.HUB_DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Remove 'v' prefix if present
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION from tag: $TAG"

      - name: Generate Docker tags
        id: meta
        run: |
          IMAGE="${{ env.IMAGE_NAME }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Extract major, minor versions
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)

          # Build tag list
          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR}"
          TAGS="${TAGS},${IMAGE}:${MAJOR}"
          TAGS="${TAGS},${IMAGE}:latest"

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Docker tags: $TAGS"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          # Enable verbose output for debugging build progress
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Strom
            org.opencontainers.image.description=GStreamer Flow Engine
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Use GitHub Actions cache (much faster than registry cache)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # Disable provenance and SBOM to prevent build hangs
          provenance: false
          sbom: false
