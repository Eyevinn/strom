name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_INCREMENTAL: 0
  REGISTRY: docker.io
  IMAGE_NAME: eyevinntechnology/strom

jobs:
  docker-publish:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # For workflow_dispatch, check out the branch (github.ref)
        # For release events, check out the tag (github.ref)
        # The tag input is only used for versioning, not checkout

      - name: Log in to Docker Hub
        run: echo "${{ secrets.HUB_DOCKER_PASSWORD }}" | docker login -u "${{ secrets.HUB_DOCKER_USERNAME }}" --password-stdin

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Remove 'v' prefix if present
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION from tag: $TAG"

      - name: Build Docker image
        env:
          CARGO_INCREMENTAL: 0
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.IMAGE_NAME }}"

          # Build with standard docker build (no BuildKit)
          DOCKER_BUILDKIT=0 docker build \
            --build-arg CARGO_INCREMENTAL=0 \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:latest \
            .

      - name: Push Docker images
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.IMAGE_NAME }}"
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)

          # Push all tags
          docker push ${IMAGE}:${VERSION}
          docker tag ${IMAGE}:${VERSION} ${IMAGE}:${MAJOR}.${MINOR}
          docker tag ${IMAGE}:${VERSION} ${IMAGE}:${MAJOR}
          docker push ${IMAGE}:${MAJOR}.${MINOR}
          docker push ${IMAGE}:${MAJOR}
          docker push ${IMAGE}:latest
