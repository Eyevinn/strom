name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.0) or leave empty for current branch'
        required: false
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: eyevinntechnology/strom

jobs:
  # Build AMD64 image natively on x86_64 runner
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Free up disk space
        run: |
          echo "==> Disk space before cleanup"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "==> Disk space after cleanup"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.HUB_DOCKER_USERNAME }}
          password: ${{ secrets.HUB_DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        env:
          BASE_REF: ${{ github.event.base_ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "git_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            # A tag push is a detached checkout; base_ref names the branch it was cut from.
            echo "git_branch=${BASE_REF#refs/heads/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            echo "git_tag=" >> $GITHUB_OUTPUT
            echo "git_branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          fi
          echo "git_hash=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64
          platforms: linux/amd64
          # The build context excludes .git/, so provenance has to be passed in.
          build-args: |
            GIT_HASH=${{ steps.version.outputs.git_hash }}
            GIT_TAG=${{ steps.version.outputs.git_tag }}
            GIT_BRANCH=${{ steps.version.outputs.git_branch }}
          cache-from: type=gha,scope=docker-amd64
          # mode=min: cache only the final image layers. mode=max also exported
          # the builder's multi-GB target/ each build (~6 min), which COPY . .
          # busts anyway and sccache now covers — net loss. See PR discussion.
          cache-to: type=gha,mode=min,scope=docker-amd64
          provenance: false
          sbom: false
          # sccache S3 credentials, consumed by the Dockerfile builder stages.
          # If these secrets are unset the build compiles normally (no cache).
          secrets: |
            aws_access_key_id=${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}

      # The guard for #741: build.rs is not reachable from `cargo test`, so the only place
      # the build-arg plumbing can be checked is against a running image. Failing here also
      # stops create-manifest, so a provenance-less build never becomes the published tag.
      - name: Verify git provenance in the AMD64 image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64
          EXPECTED_HASH: ${{ steps.version.outputs.git_hash }}
        run: |
          docker run --rm -d --name strom-provenance -p 8080:8080 "$IMAGE"
          reported=""
          for _ in $(seq 1 30); do
            reported=$(curl -fsS localhost:8080/api/version 2>/dev/null | jq -r '.git_hash // empty') || true
            [ -n "$reported" ] && break
            sleep 2
          done
          docker rm -f strom-provenance >/dev/null 2>&1 || true
          echo "==> /api/version reports git_hash='$reported', expected '$EXPECTED_HASH'"
          if [ "$reported" != "$EXPECTED_HASH" ]; then
            echo "The image cannot be mapped back to a commit (#741)."
            exit 1
          fi

  # Build ARM64 image natively on ARM64 runner (no cross-compilation!)
  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.HUB_DOCKER_USERNAME }}
          password: ${{ secrets.HUB_DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        env:
          BASE_REF: ${{ github.event.base_ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "git_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            # A tag push is a detached checkout; base_ref names the branch it was cut from.
            echo "git_branch=${BASE_REF#refs/heads/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            echo "git_tag=" >> $GITHUB_OUTPUT
            echo "git_branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          fi
          echo "git_hash=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64
          platforms: linux/arm64
          # The build context excludes .git/, so provenance has to be passed in.
          build-args: |
            GIT_HASH=${{ steps.version.outputs.git_hash }}
            GIT_TAG=${{ steps.version.outputs.git_tag }}
            GIT_BRANCH=${{ steps.version.outputs.git_branch }}
          cache-from: type=gha,scope=docker-arm64
          # mode=min: see the AMD64 job above.
          cache-to: type=gha,mode=min,scope=docker-arm64
          provenance: false
          sbom: false
          # sccache S3 credentials, consumed by the Dockerfile builder stages.
          # If these secrets are unset the build compiles normally (no cache).
          secrets: |
            aws_access_key_id=${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}

      # See the AMD64 job above.
      - name: Verify git provenance in the ARM64 image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64
          EXPECTED_HASH: ${{ steps.version.outputs.git_hash }}
        run: |
          docker run --rm -d --name strom-provenance -p 8080:8080 "$IMAGE"
          reported=""
          for _ in $(seq 1 30); do
            reported=$(curl -fsS localhost:8080/api/version 2>/dev/null | jq -r '.git_hash // empty') || true
            [ -n "$reported" ] && break
            sleep 2
          done
          docker rm -f strom-provenance >/dev/null 2>&1 || true
          echo "==> /api/version reports git_hash='$reported', expected '$EXPECTED_HASH'"
          if [ "$reported" != "$EXPECTED_HASH" ]; then
            echo "The image cannot be mapped back to a commit (#741)."
            exit 1
          fi

  # Create multi-arch manifest combining AMD64 and ARM64 images
  create-manifest:
    name: Create Multi-arch Manifest
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.HUB_DOCKER_USERNAME }}
          password: ${{ secrets.HUB_DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            # Generate all tag variations for releases
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            echo "tags=${{ env.IMAGE_NAME }}:${VERSION},${{ env.IMAGE_NAME }}:${MAJOR}.${MINOR},${{ env.IMAGE_NAME }}:${MAJOR},${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          else
            VERSION="dev-$(echo $GITHUB_SHA | head -c7)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tags=${{ env.IMAGE_NAME }}:${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create and push multi-arch manifest
        run: |
          # Create manifest from platform-specific images
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-arm64

          # Create additional tags for releases
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
            for TAG in "${TAGS[@]}"; do
              if [[ "$TAG" != "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" ]]; then
                docker buildx imagetools create \
                  --tag "$TAG" \
                  ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-amd64 \
                  ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-arm64
              fi
            done
          fi

      - name: Verify manifest
        run: |
          echo "==> Inspecting multi-arch manifest"
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
