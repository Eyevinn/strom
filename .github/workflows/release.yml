name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TRUNK_VERSION: "0.21.14"
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  # sccache -> self-hosted MinIO (S3) cache in OSC. Tag builds run weeks apart,
  # so a GHA-cached target/ would always be evicted (10 GB repo ceiling) and
  # every release recompiles cold — that is why this workflow deliberately has
  # NO Swatinem/rust-cache steps: saving ~5-7 GB of one-shot caches per tag
  # only evicted the CI workflow's hot caches. sccache is the persistent cache.
  # Requires repo secrets SCCACHE_S3_ACCESS_KEY_ID / SCCACHE_S3_SECRET_ACCESS_KEY.
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: https://olivedev-rustcache.minio-minio.auto.prod-se.osaas.io
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}

jobs:
  # Probe the sccache S3 backend once so a broken cache degrades to an uncached
  # build instead of failing the release. sccache treats its configured cache as
  # a hard requirement (a missing bucket or unreachable endpoint fails every
  # cargo invocation), so jobs set RUSTC_WRAPPER=sccache only when this reports
  # the backend healthy. The cache is an optimization, never a dependency.
  preflight:
    name: sccache preflight
    runs-on: ubuntu-latest
    outputs:
      cache_ok: ${{ steps.probe.outputs.cache_ok }}
    steps:
      - name: Probe sccache S3 backend
        id: probe
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "No sccache credentials - cache disabled"
            echo "cache_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # list-objects-v2 needs only s3:ListBucket, which the scoped service
          # account has. NoSuchBucket / unreachable endpoint -> non-zero -> off.
          if timeout 25 aws --endpoint-url "$SCCACHE_ENDPOINT" --region "$SCCACHE_REGION" \
               --cli-connect-timeout 8 --cli-read-timeout 8 \
               s3api list-objects-v2 --bucket "$SCCACHE_BUCKET" --max-keys 1 >/dev/null 2>&1; then
            echo "sccache backend reachable - cache enabled"
            echo "cache_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::sccache backend unreachable or bucket missing - building WITHOUT compile cache"
            echo "cache_ok=false" >> "$GITHUB_OUTPUT"
          fi

  build-frontend:
    name: Build Frontend (WASM)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache trunk binary
        id: cache-trunk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ env.TRUNK_VERSION }}-${{ runner.os }}

      - name: Install trunk
        if: steps.cache-trunk.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v${{ env.TRUNK_VERSION }}/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C ~/.cargo/bin

      - name: Setup sccache
        if: needs.preflight.outputs.cache_ok == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build frontend
        run: |
          cd frontend
          trunk build --release
        env:
          RUSTC_WRAPPER: ${{ needs.preflight.outputs.cache_ok == 'true' && 'sccache' || '' }}

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/dist
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }}
    needs: [build-frontend, preflight]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.platform == 'macos' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            glibc: "2.31"
            binary_ext: ""
            features: "efp"
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            glibc: "2.31"
            binary_ext: ""
            features: "efp"
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
            features: ""
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            binary_ext: ""
            features: "efp"
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        if: needs.preflight.outputs.cache_ok == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10

      # Linux: Install Zig and cargo-zigbuild for glibc 2.31 compatibility
      - name: Determine Zig/cargo-zigbuild arch (Linux)
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            echo "ZIG_ARCH=aarch64" >> $GITHUB_ENV
            echo "ZIG_SHA256=041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556" >> $GITHUB_ENV
            echo "CZB_SHA256=6f86a78cf8be222ac08a68a944ffd8a1ef9d455c504097f0ffbd8bcfbe434a55" >> $GITHUB_ENV
          else
            echo "ZIG_ARCH=x86_64" >> $GITHUB_ENV
            echo "ZIG_SHA256=d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea" >> $GITHUB_ENV
            echo "CZB_SHA256=6a014d41ba41ca4b69ca4c4819b9f78a41b0197b5d486904e31c1244e3686190" >> $GITHUB_ENV
          fi

      - name: Cache Zig tarball (Linux)
        if: startsWith(matrix.platform, 'linux')
        uses: actions/cache@v5
        with:
          path: /tmp/zig.tar.xz
          key: zig-0.13.0-linux-${{ env.ZIG_ARCH }}

      - name: Cache cargo-zigbuild tarball (Linux)
        if: startsWith(matrix.platform, 'linux')
        uses: actions/cache@v5
        with:
          path: /tmp/cargo-zigbuild.tar.xz
          key: cargo-zigbuild-0.22.3-linux-${{ env.ZIG_ARCH }}

      - name: Install Zig and cargo-zigbuild (Linux)
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          ZIG_VERSION="0.13.0"
          ZIG_PRIMARY="https://zigmirror.hryx.net/zig/zig-linux-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz"
          ZIG_FALLBACK="https://ziglang.org/download/${ZIG_VERSION}/zig-linux-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz"
          if [ ! -s /tmp/zig.tar.xz ] || ! echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c --quiet; then
            curl -L --fail --retry 3 --retry-all-errors --retry-delay 2 \
              -o /tmp/zig.tar.xz "$ZIG_PRIMARY" || \
            curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
              -o /tmp/zig.tar.xz "$ZIG_FALLBACK"
            echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c
          fi
          sudo tar -xJ -C /usr/local -f /tmp/zig.tar.xz
          sudo ln -sf /usr/local/zig-linux-${ZIG_ARCH}-${ZIG_VERSION}/zig /usr/local/bin/zig
          zig version

          CZB_VERSION="0.22.3"
          CZB_TARGET="${ZIG_ARCH}-unknown-linux-gnu"
          CZB_URL="https://github.com/rust-cross/cargo-zigbuild/releases/download/v${CZB_VERSION}/cargo-zigbuild-${CZB_TARGET}.tar.xz"
          if [ ! -s /tmp/cargo-zigbuild.tar.xz ] || ! echo "${CZB_SHA256}  /tmp/cargo-zigbuild.tar.xz" | sha256sum -c --quiet; then
            curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
              -o /tmp/cargo-zigbuild.tar.xz "$CZB_URL"
            echo "${CZB_SHA256}  /tmp/cargo-zigbuild.tar.xz" | sha256sum -c
          fi
          tar -xJ -C /tmp -f /tmp/cargo-zigbuild.tar.xz
          install -m 0755 "/tmp/cargo-zigbuild-${CZB_TARGET}/cargo-zigbuild" "$HOME/.cargo/bin/cargo-zigbuild"

      # Linux: Install GStreamer dev packages and cmake (needed for EFP feature)
      - name: Install GStreamer (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            libcairo2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libssl-dev \
            pkg-config \
            cmake \
            libclang-dev

      # Windows: Install Strawberry Perl (needed for OpenSSL build)
      - name: Install Strawberry Perl (Windows)
        if: matrix.platform == 'windows'
        run: choco install strawberryperl --yes --no-progress

      # Windows: Install GStreamer from our GitHub release mirror
      # (freedesktop.org has bot protection that blocks CI downloads)
      - name: Install GStreamer (Windows)
        if: matrix.platform == 'windows'
        run: |
          $GSTREAMER_VERSION = "1.26.10"
          $BASE_URL = "https://github.com/Eyevinn/strom/releases/download/gstreamer-deps"

          # Download and install runtime from our GitHub mirror
          Write-Host "Downloading GStreamer runtime from GitHub mirror..."
          Invoke-WebRequest -Uri "$BASE_URL/gstreamer-1.0-msvc-x86_64-$GSTREAMER_VERSION.msi" -OutFile gstreamer.msi
          Write-Host "Installing GStreamer runtime..."
          Start-Process msiexec.exe -Wait -ArgumentList '/i gstreamer.msi /quiet /qn INSTALLDIR=D:\gstreamer'

          # Download and install development files from our GitHub mirror
          Write-Host "Downloading GStreamer development files from GitHub mirror..."
          Invoke-WebRequest -Uri "$BASE_URL/gstreamer-1.0-devel-msvc-x86_64-$GSTREAMER_VERSION.msi" -OutFile gstreamer-devel.msi
          Write-Host "Installing GStreamer development files..."
          Start-Process msiexec.exe -Wait -ArgumentList '/i gstreamer-devel.msi /quiet /qn INSTALLDIR=D:\gstreamer'

          # Install pkg-config via Chocolatey (still needed)
          # --allow-empty-checksums needed because pkgconfiglite downloads from HTTP
          choco install pkgconfiglite --yes --no-progress --allow-empty-checksums

          # Set environment variables
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=D:\gstreamer\1.0\msvc_x86_64\" >> $env:GITHUB_ENV
          echo "D:\gstreamer\1.0\msvc_x86_64\bin" >> $env:GITHUB_PATH
          echo "PKG_CONFIG_PATH=D:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig" >> $env:GITHUB_ENV

      # macOS: Install GStreamer via Homebrew
      # Set PKG_CONFIG_PATH to ensure correct library paths are found
      - name: Install GStreamer (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav
          # Set pkg-config paths for GStreamer and GLib (Homebrew paths)
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix glib)/lib/pkgconfig" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV

      # Download the pre-built frontend from the frontend build job
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/dist

      # Linux: Build with zigbuild for glibc compatibility
      - name: Build backend (Linux - glibc ${{ matrix.glibc }})
        if: startsWith(matrix.platform, 'linux')
        env:
          RUSTFLAGS: "-L /usr/lib/${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu' || 'x86_64-linux-gnu' }}"
          RUSTC_WRAPPER: ${{ needs.preflight.outputs.cache_ok == 'true' && 'sccache' || '' }}
        run: |
          set -e
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo zigbuild --release --package strom --features "$FEATURES" --target ${{ matrix.target }}.${{ matrix.glibc }}
          else
            cargo zigbuild --release --package strom --target ${{ matrix.target }}.${{ matrix.glibc }}
          fi
          cargo zigbuild --release --package strom-mcp-server --target ${{ matrix.target }}.${{ matrix.glibc }}

      # Non-Linux: Build with regular cargo
      - name: Build backend (non-Linux)
        if: ${{ !startsWith(matrix.platform, 'linux') }}
        shell: bash
        env:
          RUSTC_WRAPPER: ${{ needs.preflight.outputs.cache_ok == 'true' && 'sccache' || '' }}
        run: |
          set -e
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --package strom --features "$FEATURES" --target ${{ matrix.target }}
          else
            cargo build --release --package strom --target ${{ matrix.target }}
          fi
          cargo build --release --package strom-mcp-server --target ${{ matrix.target }}

      - name: Upload backend binary
        uses: actions/upload-artifact@v7
        with:
          name: strom-v${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/strom${{ matrix.binary_ext }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload MCP server binary
        uses: actions/upload-artifact@v7
        with:
          name: strom-mcp-server-v${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/strom-mcp-server${{ matrix.binary_ext }}
          retention-days: 90
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Rename binaries with platform suffixes
          mv artifacts/strom-v${{ steps.version.outputs.version }}-linux-x86_64-x86_64-unknown-linux-gnu/strom \
             release-assets/strom-v${{ steps.version.outputs.version }}-linux-x86_64

          mv artifacts/strom-v${{ steps.version.outputs.version }}-linux-arm64-aarch64-unknown-linux-gnu/strom \
             release-assets/strom-v${{ steps.version.outputs.version }}-linux-aarch64

          mv artifacts/strom-v${{ steps.version.outputs.version }}-macos-aarch64-apple-darwin/strom \
             release-assets/strom-v${{ steps.version.outputs.version }}-macos-aarch64

          mv artifacts/strom-v${{ steps.version.outputs.version }}-windows-x86_64-pc-windows-msvc/strom.exe \
             release-assets/strom-v${{ steps.version.outputs.version }}-windows-x86_64.exe

          mv artifacts/strom-mcp-server-v${{ steps.version.outputs.version }}-linux-x86_64-x86_64-unknown-linux-gnu/strom-mcp-server \
             release-assets/strom-mcp-server-v${{ steps.version.outputs.version }}-linux-x86_64

          mv artifacts/strom-mcp-server-v${{ steps.version.outputs.version }}-linux-arm64-aarch64-unknown-linux-gnu/strom-mcp-server \
             release-assets/strom-mcp-server-v${{ steps.version.outputs.version }}-linux-aarch64

          mv artifacts/strom-mcp-server-v${{ steps.version.outputs.version }}-macos-aarch64-apple-darwin/strom-mcp-server \
             release-assets/strom-mcp-server-v${{ steps.version.outputs.version }}-macos-aarch64

          mv artifacts/strom-mcp-server-v${{ steps.version.outputs.version }}-windows-x86_64-pc-windows-msvc/strom-mcp-server.exe \
             release-assets/strom-mcp-server-v${{ steps.version.outputs.version }}-windows-x86_64.exe

          chmod +x release-assets/strom-*-linux-* release-assets/strom-*-macos-* release-assets/strom-mcp-server-*-linux-* release-assets/strom-mcp-server-*-macos-*
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
