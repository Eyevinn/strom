# Dependabot opens security updates only.
#
# Version updates are switched off with `open-pull-requests-limit: 0`, which is
# GitHub's documented way to keep security updates while dropping version
# updates. Security updates are enabled in the repository settings and do not
# depend on this limit.
#
# Version updates were costing more than they gave: each pull request
# re-resolved Cargo.lock on its own, so they conflicted with each other, every
# rebase cost another CI run, and GStreamer bumps broke the build from patch
# releases (#861). Keeping up is done by hand, in one pull request at a time.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
