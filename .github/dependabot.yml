# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # One pull request per week for patch bumps instead of one per crate.
      # The bumps themselves are rarely the point: each pull request re-resolves
      # Cargo.lock, and most of the diff is unrelated churn - the four open on
      # 2026-09-24 (tower-http, anyhow, reqwest, tokio-stream) were 13 to 16
      # changed lines each, of which all but one were windows-sys edges. Those
      # lockfiles disagree with each other, so merging one conflicts the rest
      # and every rebase costs another CI run.
      #
      # Patch only, deliberately. Cargo treats the leading non-zero digit as the
      # major one, so a 0.x minor bump is a breaking change: egui-phosphor
      # 0.12 -> 0.13 (#733) only existed to follow egui to 0.35 and could never
      # pass CI on its own. Grouping that class would block every safe bump
      # behind it. Minor and major bumps keep coming one pull request at a time,
      # where they can be read and reverted individually.
      #
      # GStreamer is excluded and keeps arriving one crate at a time. It is the
      # core dependency, its bumps deserve reading on their own, and it is the
      # family most able to break the build from a patch release: the first
      # grouped run (#861) failed to compile because gstreamer-video 0.25.4
      # calls a gstreamer-video-sys signature that its own declared floor,
      # 0.25.2, does not have. Cargo cannot see that, so no resolution avoids
      # it - and grouped, it parked twenty working bumps behind one broken
      # crate. Excluding is not ignoring: these still come as pull requests,
      # just individually, where one can be closed without holding the rest.
      cargo-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "gstreamer*"
          - "gst-plugin*"
        update-types:
          - "patch"
