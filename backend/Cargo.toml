[package]
name = "strom"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "strom"
autotests = false

[features]
default = ["nvidia", "voice-isolation"]
no-gui = []
# DPDFNet speech enhancement on mixer channels, run with tract (pure Rust).
# The model is downloaded at build time and embedded in the binary.
voice-isolation = ["dep:tract-onnx", "dep:realfft", "dep:byte-slice-cast"]
nvidia = ["dep:nvml-wrapper"]
efp = ["dep:gst-plugin-efp"]

[dependencies]
# Internal
strom-types = { path = "../types", features = ["openapi", "validation"] }
garde.workspace = true
# Load a local .env file at startup (e.g. STROM_OSC_PAT)
dotenvy = "0.15"

# Web framework
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
futures.workspace = true
tower-http.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/time
chrono = "0.4"

# Canonical paths without the Windows verbatim prefix
dunce = "1.0"

# URL encoding
url = "2.5"
urlencoding = "2.1"

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
time.workspace = true

# OpenAPI documentation
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

# GStreamer
cairo-rs.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-base.workspace = true
# gio is used to format GSocketAddress fields returned by the SRT plugin's stats.
gio.workspace = true
gstreamer-controller.workspace = true
gstreamer-net.workspace = true
gstreamer-rtp.workspace = true
gstreamer-gl.workspace = true
gstreamer-video.workspace = true
gstreamer-webrtc.workspace = true
gst-plugin-audiofx.workspace = true
gst-plugin-webrtc.workspace = true
gst-plugin-webrtchttp.workspace = true
gst-plugin-inter.workspace = true
gst-plugin-rtp.workspace = true
gst-plugin-isobmff.workspace = true
gst-plugin-stromdsp = { git = "https://github.com/Eyevinn/strom-dsp", tag = "v0.2.4", package = "gst-plugin-stromdsp" }
gst-plugin-efp = { git = "https://github.com/Eyevinn/efp", tag = "v0.4.1", package = "gst-plugin-efp", optional = true }

# Voice isolation (DPDFNet model inference)
tract-onnx = { version = "0.23", optional = true }
realfft = { version = "3.5", optional = true }
byte-slice-cast = { version = "1.2", optional = true }

# Encoding
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "2.0.18"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "chrono"] }

# Thread priority management
thread-priority = "3.0.0"
libc = "0.2"

# TLS
axum-server.workspace = true
rustls = { version = "0.23", features = ["ring"] }
hyper-util = { version = "0.1", features = ["tokio"] } # TokioTimer for hyper connection timeouts
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Authentication
bcrypt = "0.19.0"
cookie = { version = "0.18", features = ["signed", "key-expansion"] }

# CLI argument parsing
clap = { version = "4.6", features = ["derive", "env"] }

# Configuration management
figment = { version = "0.10", features = ["toml", "env"] }

# Cross-platform directory paths
directories = "6.0"

# Temporary files for DOT/SVG conversion
tempfile = "3.27"
uuid.workspace = true

# MIME type detection for static assets
mime_guess = "2.0"

# Embed static assets (debug-embed forces embedding even in debug builds)
rust-embed = { version = "8.0", features = ["debug-embed"] }

# Image processing for icon generation and thumbnail capture
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# System monitoring
sysinfo = "0.39"
parking_lot = "0.12"

# Network interface discovery
network-interface = "2.0"

# HTTP client for test harness, and for proxying the CEF DevTools endpoint
reqwest.workspace = true

# WebSocket client for the CEF DevTools proxy (same version axum's ws uses)
tokio-tungstenite = "0.29"

# Network discovery
socket2 = "0.6"      # Multicast socket options for SAP
flate2 = "1.1"       # Zlib decompression for SAP
mdns-sd = "0.21"     # mDNS service discovery (RAVENNA, NDI, etc.)
hostname = "0.4"     # Cross-platform hostname detection

# GUI (native frontend) - use --features no-gui to disable
strom-frontend = { path = "../frontend" }
eframe = { workspace = true }

[build-dependencies]
chrono = "0.4"
sha2 = "0.10"
uuid = { version = "1.23", features = ["v4"] }

# NVML does not exist on macOS, so the `nvidia` feature pulls in nothing there
# and the system monitor skips the NVML probe, which could only fail.
[target.'cfg(not(target_os = "macos"))'.dependencies]
nvml-wrapper = { version = "0.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# App Nap opt-out: see backend/src/macos_app_nap.rs. Already in the tree via
# eframe, so this adds no new crate.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSProcessInfo",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
# Intel graphics driver version via DXGI (gst::demote_qsv_plugin, #1163).
# Already in the tree through wgpu, so this adds no new crate.
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
serial_test = "4.0"

[[bin]]
name = "gen-icons"
path = "src/bin/gen_icons.rs"

# Integration tests: every backend/tests/*.rs is a module of one binary,
# tests/it, so strom is linked once and the tests run in parallel with each
# other. autotests = false, so a new file under backend/tests/ is not built
# until it is listed in tests/it/main.rs or here; test_layout_test fails if a
# file is in neither.
#
# The targets below keep a process of their own, each for the reason above
# it. Most change process-global GStreamer or GLib state that would break the
# other tests in a shared process. One fails there for a reason not yet found.
[[test]]
name = "it"
path = "tests/it/main.rs"

# Lists and inspects every element, which loads every installed plugin into the
# process. A system copy of a plugin Strom links in statically (gstrsrtp on the
# Windows runner) then blocks the static registration the other tests need.
[[test]]
name = "api_tests"
path = "tests/api_tests.rs"

# Installs the process-wide GLib default log handler.
[[test]]
name = "bus_signal_watch_balance_test"
path = "tests/bus_signal_watch_balance_test.rs"

# The GStreamer floor job (check-floor) builds and runs only this one.
[[test]]
name = "gst_floor_smoke_test"
path = "tests/gst_floor_smoke_test.rs"

# Removes nicesrc and nicesink from the registry, which every WebRTC test needs.
[[test]]
name = "ice_preflight_test"
path = "tests/ice_preflight_test.rs"

# Registers the isobmff plugin before anything else in the process loads the system one.
[[test]]
name = "isobmff_plugin_test"
path = "tests/isobmff_plugin_test.rs"

# Registers stand-ins under the real ndisrc and ndisrcdemux names.
[[test]]
name = "ndi_input_native_video_test"
path = "tests/ndi_input_native_video_test.rs"

# Registers a cudadownload stand-in under the real name.
[[test]]
name = "ndi_output_input_memory_test"
path = "tests/ndi_output_input_memory_test.rs"

# Its raw-video refusal never fires in the shared process (Windows 3/3, Linux
# 2/4), though it passes on its own. The cause is not found: #1254.
[[test]]
name = "mpegtssrt_multi_video_test"
path = "tests/mpegtssrt_multi_video_test.rs"

# Counts every GStreamer critical in the process.
[[test]]
name = "qos_probe_criticals_test"
path = "tests/qos_probe_criticals_test.rs"

# Registers a decoder that refuses, ranked above the real decoders.
[[test]]
name = "stinger_software_decode_test"
path = "tests/stinger_software_decode_test.rs"

# Registers a cudadownload stand-in under the real name.
[[test]]
name = "thumbnail_tap_cuda_test"
path = "tests/thumbnail_tap_cuda_test.rs"

# Registers a cudadownload stand-in under the real name.
[[test]]
name = "video_input_bridge_test"
path = "tests/video_input_bridge_test.rs"

# Registers stand-ins under the real nvh264enc and cudadownload names.
[[test]]
name = "videoenc_input_memory_test"
path = "tests/videoenc_input_memory_test.rs"

# Registers a cudadownload stand-in under the real name.
[[test]]
name = "videoformat_input_memory_test"
path = "tests/videoformat_input_memory_test.rs"

# Registers a CUDA adapter stand-in for the life of the process.
[[test]]
name = "vision_mixer_cuda_input_test"
path = "tests/vision_mixer_cuda_input_test.rs"

# Needs a process where no CUDA adapter stand-in was ever registered.
[[test]]
name = "vision_mixer_cuda_missing_test"
path = "tests/vision_mixer_cuda_missing_test.rs"

# Registers a D3D12 download stand-in for the life of the process.
[[test]]
name = "vision_mixer_d3d_input_test"
path = "tests/vision_mixer_d3d_input_test.rs"

# Needs a process where no D3D12 download stand-in was ever registered.
[[test]]
name = "vision_mixer_d3d_missing_test"
path = "tests/vision_mixer_d3d_missing_test.rs"

# Registers a CUDA adapter stand-in for the life of the process.
[[test]]
name = "vision_mixer_input_format_cuda_test"
path = "tests/vision_mixer_input_format_cuda_test.rs"

# Crashes about once in 50 runs (#1097); a crash would end every test in its binary.
[[test]]
name = "vision_mixer_input_format_test"
path = "tests/vision_mixer_input_format_test.rs"

# Measures its own process's CPU use.
[[test]]
name = "whep_fanout_bench"
path = "tests/whep_fanout_bench.rs"

# Re-ranks a factory to NONE and counts every GStreamer critical in the process.
[[test]]
name = "whip_slot_flush_test"
path = "tests/whip_slot_flush_test.rs"
