<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85">
    <title>WHEP Player - Strom</title>
    <link rel="stylesheet" href="/static/webrtc.css">
    <link rel="stylesheet" href="/static/whep.css">
</head>
<body style="display: flex; flex-direction: column; align-items: center;">
    <div class="container">
        <div style="position: relative; margin-bottom: 8px;">
            <span style="position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: #666; font-size: 0.7em;">v15</span>
            <h1 style="text-align: center; margin: 0;">WHEP Player at <span id="hostAddress"></span></h1>
            <a href="/player/whep-streams" style="color: #888; font-size: 0.9em; position: absolute; right: 0; top: 50%; transform: translateY(-50%);">All streams</a>
        </div>

        <div class="form-group">
            <label for="endpoint">WHEP Endpoint URL</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="endpoint" placeholder="http://localhost:8081/whep/my-stream" value="" style="flex: 1;">
                <button onclick="copyEndpointUrl()" style="white-space: nowrap;">Copy URL</button>
            </div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <button class="connect-btn" id="connectBtn" style="flex: 1;" onclick="doConnect()">Connect</button>
            <button class="disconnect-btn" id="disconnectBtn" style="flex: 1;" onclick="doDisconnect()" disabled>Disconnect</button>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;">
            <div class="video-container" id="videoContainer" style="max-width: 720px;">
                <video id="video" autoplay muted playsinline controls></video>
            </div>
            <div id="videoTrackGroup" style="display: none; width: 100%; max-width: 400px;">
                <label style="color: #888; font-size: 12px;">Video track:
                    <select id="videoTrackSelect" style="width: auto; padding: 4px 8px;" onchange="onVideoTrackChange()"></select>
                </label>
            </div>
            <div class="audio-indicator" id="audioIndicator">
                <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
            </div>
            <div class="audio-controls" id="audioControls" style="width: 100%; max-width: 400px;">
                <button class="mute-btn muted" id="muteBtn" onclick="toggleMute()" title="Toggle mute">&#128263;</button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100" oninput="setVolume(this.value)">
                <span class="volume-label" id="volumeLabel">100%</span>
            </div>
            <div id="audioTrackGroup" style="display: none; width: 100%; max-width: 400px;">
                <label style="color: #888; font-size: 12px;">Audio track:
                    <select id="audioTrackSelect" style="width: auto; padding: 4px 8px;" onchange="onAudioTrackChange()"></select>
                </label>
            </div>
            <div id="audioOutputGroup" style="display: none; width: 100%; max-width: 400px;">
                <label style="color: #888; font-size: 12px;">Output:
                    <select id="audioOutputSelect" style="width: auto; padding: 4px 8px;" onchange="onAudioOutputChange()"></select>
                </label>
            </div>
        </div>

        <div class="status disconnected" id="status" style="margin-top: 16px;">Not connected</div>

        <div id="statsPanel" class="stats-panel" style="display: none;">
            <table class="stats-table">
                <thead>
                    <tr><th></th><th>Audio</th><th>Video</th></tr>
                </thead>
                <tbody>
                    <tr><td class="stats-label">Bitrate</td><td id="stat-audio-bitrate">-</td><td id="stat-video-bitrate">-</td></tr>
                    <tr><td class="stats-label">Jitter buffer</td><td id="stat-audio-jbuf">-</td><td id="stat-video-jbuf">-</td></tr>
                    <tr><td class="stats-label">Jitter</td><td id="stat-audio-jitter">-</td><td id="stat-video-jitter">-</td></tr>
                    <tr><td class="stats-label">Packet loss</td><td id="stat-audio-loss">-</td><td id="stat-video-loss">-</td></tr>
                    <tr><td class="stats-label">Codec</td><td id="stat-audio-codec">-</td><td id="stat-video-codec">-</td></tr>
                    <tr><td class="stats-label">Resolution</td><td>-</td><td id="stat-video-res">-</td></tr>
                    <tr><td class="stats-label">FPS</td><td>-</td><td id="stat-video-fps">-</td></tr>
                    <tr><td class="stats-label">Frames dropped</td><td>-</td><td id="stat-video-dropped">-</td></tr>
                    <tr><td class="stats-label">Nack / PLI</td><td>-</td><td id="stat-video-nack-pli">-</td></tr>
                </tbody>
            </table>
            <div class="stats-row">
                <span class="stats-label">RTT</span>
                <span id="stat-rtt">-</span>
            </div>
            <div class="stats-row">
                <span class="stats-label">A/V sync offset</span>
                <span id="stat-av-sync">-</span>
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 6px; margin-top: 16px; margin-bottom: 4px;">
            <input type="checkbox" id="statsMode" data-storage-key="whep-stats" onchange="toggleStatsMode()" style="margin: 0; width: auto;">
            <label for="statsMode" style="color: #666; font-size: 0.8em; cursor: pointer; margin: 0;">Stats</label>
            <span style="color: #3d3d3d; margin: 0 2px;">|</span>
            <input type="checkbox" id="debugMode" data-storage-key="whep-debug" onchange="toggleDebugMode(); whepDebugMode = this.checked;" style="margin: 0; width: auto;">
            <label for="debugMode" style="color: #666; font-size: 0.8em; cursor: pointer; margin: 0;">Debug</label>
            <button onclick="copyLog()" style="padding: 2px 6px; white-space: nowrap;">Copy log</button>
        </div>
        <div class="log" id="log"></div>
    </div>

    <audio id="audio" autoplay muted></audio>

    <script src="/static/webrtc.js"></script>
    <script src="/static/whep.js"></script>
    <script src="/static/devices.js"></script>
    <script>
        let connection = null;
        let connectionId = 0;       // Incremented each connect to ignore stale callbacks
        let wantConnected = false;  // User's intent: should we be connected?
        let reconnectAttempt = 0;
        let reconnectTimer = null;
        let transportSuffix = '';   // Debug: " - relay <addr>" or " - direct <addr>"
        let hasAudioStream = false;
        let audioTrack = null;   // Stored for adding to video stream in A+V mode
        let audioMeter = null;   // Audio level meter (AnalyserNode + animation)
        let availableAudioTracks = []; // Multi-audio: tracks received so far
        let selectedAudioIndex = 0;    // Which track index is currently routed to the audio element
        let availableVideoTracks = []; // Multi-video: tracks received so far
        let selectedVideoIndex = 0;    // Which track index is currently routed to the video element
        const MAX_RECONNECT_ATTEMPTS = 15;
        const RECONNECT_DELAY = 10000;

        // Device management (audio output selection)
        const deviceManager = new DeviceManager({
            storagePrefix: 'whep',
            onLog: (msg, type) => log(msg, type),
            onDevicesChanged: updateAudioOutputDropdown
        });

        function updateAudioOutputDropdown() {
            const group = document.getElementById('audioOutputGroup');
            const select = document.getElementById('audioOutputSelect');
            const showDropdown = hasAudioStream && deviceManager.populateAudioOutputSelect(select);
            group.style.display = showDropdown ? 'block' : 'none';
        }

        async function onAudioOutputChange() {
            const deviceId = document.getElementById('audioOutputSelect').value;
            if (!deviceId) return;
            const audio = document.getElementById('audio');
            const video = document.getElementById('video');
            const ok = await deviceManager.setAudioOutput(deviceId, audio, video);
            if (ok) log('Switched audio output');
        }

        // Look up num_audio_tracks / num_video_tracks for the given endpoint URL
        // by querying the streams API. The endpoint URL has the form
        // /whep/{endpoint_id}. Returns { numAudioTracks, numVideoTracks }.
        async function fetchTrackCounts(endpointUrl) {
            try {
                const id = endpointUrl.replace(/^.*\/whep\//, '').replace(/\/$/, '');
                if (!id) return { numAudioTracks: 1, numVideoTracks: 1 };
                const res = await fetch('/api/whep-streams');
                if (!res.ok) return { numAudioTracks: 1, numVideoTracks: 1 };
                const data = await res.json();
                const match = (data.streams || []).find(s => s.endpoint_id === id);
                if (match) {
                    const a = typeof match.num_audio_tracks === 'number' && match.num_audio_tracks > 0
                        ? match.num_audio_tracks : 1;
                    const v = typeof match.num_video_tracks === 'number' && match.num_video_tracks > 0
                        ? match.num_video_tracks : 1;
                    return { numAudioTracks: a, numVideoTracks: v };
                }
            } catch (e) {
                log('Failed to fetch track counts: ' + e.message, 'warning');
            }
            return { numAudioTracks: 1, numVideoTracks: 1 };
        }

        function refreshAudioTrackDropdown() {
            const group = document.getElementById('audioTrackGroup');
            const select = document.getElementById('audioTrackSelect');
            // Slot-indexed array — null slots have not yet received a track.
            const filledCount = availableAudioTracks.filter(t => t != null).length;
            if (filledCount <= 1) {
                group.style.display = 'none';
                return;
            }
            // Preserve selection if the slot is still populated.
            const previous = select.value;
            select.innerHTML = '';
            availableAudioTracks.forEach((track, slot) => {
                if (!track) return;
                const opt = document.createElement('option');
                opt.value = String(slot);
                opt.textContent = 'A' + slot + (track.label ? ' (' + track.label + ')' : '');
                select.appendChild(opt);
            });
            if (previous && availableAudioTracks[Number(previous)]) {
                select.value = previous;
            } else {
                select.value = String(selectedAudioIndex);
            }
            group.style.display = 'block';
        }

        function applySelectedAudioTrack() {
            const track = availableAudioTracks[selectedAudioIndex];
            if (!track) return;
            const audio = document.getElementById('audio');
            const stream = new MediaStream([track]);
            audio.srcObject = stream;
            audio.play().catch(() => {});
            // Restart the meter on the new track.
            startAudioMeter(track);
        }

        function onAudioTrackChange() {
            const select = document.getElementById('audioTrackSelect');
            const idx = Number(select.value);
            if (Number.isNaN(idx) || idx < 0 || idx >= availableAudioTracks.length) return;
            if (!availableAudioTracks[idx]) return;
            selectedAudioIndex = idx;
            applySelectedAudioTrack();
            log('Switched to audio track A' + idx);
        }

        function refreshVideoTrackDropdown() {
            const group = document.getElementById('videoTrackGroup');
            const select = document.getElementById('videoTrackSelect');
            const filledCount = availableVideoTracks.filter(t => t != null).length;
            if (filledCount <= 1) {
                group.style.display = 'none';
                return;
            }
            const previous = select.value;
            select.innerHTML = '';
            availableVideoTracks.forEach((track, slot) => {
                if (!track) return;
                const opt = document.createElement('option');
                opt.value = String(slot);
                opt.textContent = 'V' + slot + (track.label ? ' (' + track.label + ')' : '');
                select.appendChild(opt);
            });
            if (previous && availableVideoTracks[Number(previous)]) {
                select.value = previous;
            } else {
                select.value = String(selectedVideoIndex);
            }
            group.style.display = 'block';
        }

        function applySelectedVideoTrack() {
            const track = availableVideoTracks[selectedVideoIndex];
            if (!track) return;
            const video = document.getElementById('video');
            // In multi-video mode the dropdown owns the video element source.
            // Build a video-only stream (audio routing is handled separately by
            // the audio element / audio-track dropdown).
            video.srcObject = new MediaStream([track]);
            setElementClass('videoContainer', 'active', true);
            video.muted = true;
            video.play().catch(() => {});
        }

        function onVideoTrackChange() {
            const select = document.getElementById('videoTrackSelect');
            const idx = Number(select.value);
            if (Number.isNaN(idx) || idx < 0 || idx >= availableVideoTracks.length) return;
            if (!availableVideoTracks[idx]) return;
            selectedVideoIndex = idx;
            applySelectedVideoTrack();
            log('Switched to video track V' + idx);
        }

        function scheduleReconnect(reason) {
            // Prevent double scheduling or scheduling when not wanted
            if (!wantConnected || reconnectTimer) return;

            // Check max attempts
            if (reconnectAttempt >= MAX_RECONNECT_ATTEMPTS) {
                log('Max reconnection attempts (' + MAX_RECONNECT_ATTEMPTS + ') reached. Giving up.', 'error');
                setStatus('status', 'Connection failed - click Connect to retry', 'error');
                wantConnected = false;
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                return;
            }

            const delay = RECONNECT_DELAY;
            reconnectAttempt++;
            log('Reconnecting in ' + (delay/1000) + 's (attempt ' + reconnectAttempt + '/' + MAX_RECONNECT_ATTEMPTS + ')... Reason: ' + reason, 'warning');
            setStatus('status', 'Reconnecting in ' + (delay/1000) + 's (attempt ' + reconnectAttempt + ')...', 'connecting');

            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                if (wantConnected) {
                    doConnect(true); // true = is reconnect attempt
                }
            }, delay);
        }

        function cancelReconnect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
        }

        async function doConnect(isReconnect = false) {
            const endpoint = document.getElementById('endpoint').value.trim();
            if (!endpoint) {
                log('Please enter a WHEP endpoint URL', 'error');
                return;
            }

            cancelReconnect();
            wantConnected = true;

            // Increment connection ID - any callbacks from old connections will be ignored
            connectionId++;
            const myConnectionId = connectionId;

            // Clean up existing connection without triggering our callbacks
            if (connection) {
                // Clear callbacks before disconnect to prevent them from firing
                connection.callbacks = {};
                connection.close();
                connection = null;
            }

            // Reset multi-track state for the new connection.
            availableAudioTracks = [];
            selectedAudioIndex = 0;
            availableVideoTracks = [];
            selectedVideoIndex = 0;
            document.getElementById('audioTrackGroup').style.display = 'none';
            document.getElementById('videoTrackGroup').style.display = 'none';

            document.getElementById('connectBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = false;
            setStatus('status', isReconnect ? 'Reconnecting...' : 'Connecting...', 'connecting');
            log(isReconnect ? 'Reconnecting to ' + endpoint : 'Connecting to ' + endpoint);

            // Look up how many audio/video tracks this endpoint exposes.
            const { numAudioTracks, numVideoTracks } = await fetchTrackCounts(endpoint);
            if (myConnectionId !== connectionId) return; // User started a new connect while we awaited
            const multiAudio = numAudioTracks > 1;
            const multiVideo = numVideoTracks > 1;
            if (multiAudio) {
                log('Endpoint exposes ' + numAudioTracks + ' audio tracks');
            }
            if (multiVideo) {
                log('Endpoint exposes ' + numVideoTracks + ' video tracks');
            }

            connection = new WhepConnection(endpoint, {
                onAudioTrack: (stream) => {
                    if (myConnectionId !== connectionId) return; // Stale
                    if (multiAudio) return; // Multi-audio path handled by onAudioTracks
                    audioTrack = stream.getAudioTracks()[0];
                    startAudioMeter(audioTrack);
                    // Set on audio element for now; if video arrives,
                    // onVideoTrack will move it to the video stream
                    const audio = document.getElementById('audio');
                    audio.srcObject = stream;
                    audio.play().catch(() => {});
                },
                onAudioTracks: (tracks) => {
                    if (myConnectionId !== connectionId) return; // Stale
                    availableAudioTracks = tracks;
                    if (!multiAudio) return;
                    refreshAudioTrackDropdown();
                    // Route the currently-selected track to the audio element.
                    // If the selected slot is empty (e.g. tracks arriving in
                    // a different order), fall back to the first filled slot.
                    if (selectedAudioIndex >= availableAudioTracks.length ||
                        !availableAudioTracks[selectedAudioIndex]) {
                        const firstFilled = availableAudioTracks.findIndex(t => t != null);
                        selectedAudioIndex = firstFilled >= 0 ? firstFilled : 0;
                    }
                    applySelectedAudioTrack();
                },
                onVideoTrack: (stream) => {
                    if (myConnectionId !== connectionId) return; // Stale
                    if (multiVideo) return; // Multi-video path handled by onVideoTracks
                    const video = document.getElementById('video');
                    // In multi-audio mode the dropdown is the only audio source,
                    // so build a video-only stream to keep audio off the video
                    // element entirely (defends against same-MSID delivery and
                    // accidental unmute via the controls UI).
                    let videoStream;
                    if (multiAudio) {
                        videoStream = new MediaStream(stream.getVideoTracks());
                    } else {
                        videoStream = stream;
                        if (audioTrack) {
                            videoStream.addTrack(audioTrack);
                        }
                    }
                    video.srcObject = videoStream;
                    setElementClass('videoContainer', 'active', true);
                    video.muted = true;
                    video.play().catch(e => {
                        log('Autoplay blocked: ' + e.message, 'warning');
                    });
                },
                onVideoTracks: (tracks) => {
                    if (myConnectionId !== connectionId) return; // Stale
                    availableVideoTracks = tracks;
                    if (!multiVideo) return;
                    refreshVideoTrackDropdown();
                    // Route the currently-selected track to the video element.
                    // Fall back to the first filled slot if the selected one
                    // hasn't arrived yet.
                    if (selectedVideoIndex >= availableVideoTracks.length ||
                        !availableVideoTracks[selectedVideoIndex]) {
                        const firstFilled = availableVideoTracks.findIndex(t => t != null);
                        selectedVideoIndex = firstFilled >= 0 ? firstFilled : 0;
                    }
                    applySelectedVideoTrack();
                },
                onStats: (stats) => {
                    if (myConnectionId !== connectionId) return;
                    updateStatsPanel(stats);
                },
                onConnected: async () => {
                    if (myConnectionId !== connectionId) return; // Stale
                    cancelReconnect(); // Cancel any pending reconnect timer!
                    reconnectAttempt = 0; // Reset on successful connection
                    document.getElementById('disconnectBtn').disabled = false;
                    transportSuffix = '';
                    setStatus('status', 'Connected', 'connected');
                    // Delay transport info check — ICE connects with the first
                    // successful pair (often relay) then promotes a better direct
                    // pair. Wait 2s so ICE has time to settle on the final pair.
                    if (whepDebugMode && connection) {
                        setTimeout(async () => {
                            if (myConnectionId !== connectionId || !connection) return;
                            const info = await connection.getTransportInfo();
                            if (info) {
                                const via = info.type === 'relay' ? 'relay' : 'direct';
                                transportSuffix = ' - ' + via + (info.remoteAddress ? ' ' + info.remoteAddress : '');
                                log('Transport: ' + via + ' (' + info.protocol + ')' +
                                    (info.remoteAddress ? ' to ' + info.remoteAddress : '') +
                                    (info.relayProtocol ? ' via ' + info.relayProtocol : ''), 'success');
                                setStatus('status', 'Connected' + transportSuffix, 'connected');
                            }
                        }, 2000);
                    }
                    log('Connected successfully', 'success');
                    // Start stats overlay if checkbox is on
                    if (document.getElementById('statsMode').checked && connection) {
                        connection.startStatsOverlay();
                    }
                },
                onMediaStatus: (hasAudio, hasVideo) => {
                    if (myConnectionId !== connectionId) return; // Stale
                    const isAudioOnly = hasAudio && !hasVideo;
                    setElementClass('audioIndicator', 'active', hasAudio);
                    // In multi-audio we always need the mute/volume controls
                    // for the selected track, even when video is also present.
                    setElementClass('audioControls', 'active', isAudioOnly || multiAudio);
                    hasAudioStream = hasAudio;
                    if (hasVideo && !multiAudio) {
                        // Audio is on the video element now, clear the
                        // separate audio element
                        document.getElementById('audio').srcObject = null;
                    }
                    // Re-enumerate devices now that we have an active media
                    // session — browsers restrict enumerateDevices until media
                    // is flowing, so the initial enumeration may have returned
                    // only the default device.
                    deviceManager.enumerate();
                },
                onError: (msg) => {
                    if (myConnectionId !== connectionId) return; // Stale
                    log('Error: ' + msg, 'error');
                    setStatus('status', 'Connection failed: ' + msg, 'error');
                    document.getElementById('connectBtn').disabled = false;
                    // Schedule reconnect on error if user wants to be connected
                    if (wantConnected) {
                        scheduleReconnect('error: ' + msg);
                    }
                },
                onDisconnected: () => {
                    if (myConnectionId !== connectionId) return; // Stale

                    setElementClass('audioIndicator', 'active', false);
                    setElementClass('audioControls', 'active', false);
                    setElementClass('videoContainer', 'active', false);
                    hasAudioStream = false;
                    audioTrack = null;
                    availableAudioTracks = [];
                    selectedAudioIndex = 0;
                    availableVideoTracks = [];
                    selectedVideoIndex = 0;
                    document.getElementById('audioTrackGroup').style.display = 'none';
                    document.getElementById('videoTrackGroup').style.display = 'none';
                    stopAudioMeter();
                    updateAudioOutputDropdown();
                    document.getElementById('audio').srcObject = null;
                    document.getElementById('video').srcObject = null;
                    document.getElementById('connectBtn').disabled = false;

                    // Auto-reconnect if user wants to stay connected
                    if (wantConnected) {
                        scheduleReconnect('connection lost');
                    } else {
                        setStatus('status', 'Disconnected', 'disconnected');
                        document.getElementById('disconnectBtn').disabled = true;
                    }
                },
                onIceState: (state) => {
                    if (myConnectionId !== connectionId) return; // Stale
                    // Only log ICE state in debug mode
                    if (document.getElementById('debugMode').checked) {
                        log('ICE state: ' + state);
                    }
                },
                onLog: (msg, type) => {
                    if (myConnectionId !== connectionId) return; // Stale
                    log(msg, type || '');
                }
            }, { numAudioTracks, numVideoTracks });

            connection.connect();
        }

        function doDisconnect() {
            wantConnected = false;
            cancelReconnect();
            reconnectAttempt = 0;
            connectionId++; // Invalidate any pending callbacks
            log('Disconnecting...');
            if (connection) {
                connection.disconnect();
                connection = null;
            }
            // Clean up UI (onDisconnected callback won't fire - stale connectionId)
            setElementClass('audioIndicator', 'active', false);
            setElementClass('audioControls', 'active', false);
            setElementClass('videoContainer', 'active', false);
            hasAudioStream = false;
            audioTrack = null;
            availableAudioTracks = [];
            selectedAudioIndex = 0;
            availableVideoTracks = [];
            selectedVideoIndex = 0;
            document.getElementById('audioTrackGroup').style.display = 'none';
            document.getElementById('videoTrackGroup').style.display = 'none';
            stopAudioMeter();
            updateAudioOutputDropdown();
            document.getElementById('audio').srcObject = null;
            document.getElementById('video').srcObject = null;
            setStatus('status', 'Disconnected', 'disconnected');
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            log('Disconnected', 'success');
        }

        function copyEndpointUrl() {
            const url = document.getElementById('endpoint').value.trim();
            if (!url) { log('No URL to copy', 'error'); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    log('Copied URL to clipboard', 'success');
                }).catch(() => copyFallback(url));
            } else {
                copyFallback(url);
            }
        }

        function toggleMute() {
            const audio = document.getElementById('audio');
            const muteBtn = document.getElementById('muteBtn');
            audio.muted = !audio.muted;
            if (audio.muted) {
                muteBtn.innerHTML = '&#128263;'; // Muted speaker
                muteBtn.classList.add('muted');
            } else {
                muteBtn.innerHTML = '&#128266;'; // Speaker with sound
                muteBtn.classList.remove('muted');
                // Ensure playback after user interaction (autoplay policy)
                audio.play().catch(() => {});
                if (audioMeter) audioMeter.ctx.resume();
            }
        }

        function setVolume(value) {
            const audio = document.getElementById('audio');
            const volumeLabel = document.getElementById('volumeLabel');
            const muteBtn = document.getElementById('muteBtn');
            audio.volume = value / 100;
            volumeLabel.textContent = value + '%';
            if (value == 0) {
                muteBtn.innerHTML = '&#128263;';
                muteBtn.classList.add('muted');
            } else if (!audio.muted) {
                muteBtn.innerHTML = '&#128266;';
                muteBtn.classList.remove('muted');
            }
        }

        function startAudioMeter(track) {
            stopAudioMeter();
            const ctx = new AudioContext();
            const source = ctx.createMediaStreamSource(new MediaStream([track]));
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);
            const fill = document.getElementById('meterFill');
            let rafId = null;

            function update() {
                analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i];
                const pct = Math.min(100, (sum / data.length / 128) * 100);
                fill.style.width = pct + '%';
                rafId = requestAnimationFrame(update);
            }
            rafId = requestAnimationFrame(update);
            audioMeter = { ctx, rafId };
        }

        function stopAudioMeter() {
            if (!audioMeter) return;
            cancelAnimationFrame(audioMeter.rafId);
            audioMeter.ctx.close();
            audioMeter = null;
            document.getElementById('meterFill').style.width = '0%';
        }

        function toggleStatsMode() {
            const checkbox = document.getElementById('statsMode');
            const enabled = checkbox.checked;
            try { localStorage.setItem('whep-stats', enabled); } catch (e) {}
            document.getElementById('statsPanel').style.display = enabled ? 'block' : 'none';
            if (enabled && connection && connection.isConnected()) {
                connection.startStatsOverlay();
            } else if (!enabled && connection) {
                connection.stopStatsOverlay();
            }
        }

        function formatMs(val) {
            if (val == null) return '-';
            return val.toFixed(1) + ' ms';
        }

        function formatLoss(lost, received) {
            if (received == null || received === 0) return '-';
            const rate = ((lost / (lost + received)) * 100).toFixed(1);
            return lost + ' (' + rate + '%)';
        }

        function updateStatsPanel(stats) {
            if (!document.getElementById('statsMode').checked) return;

            if (stats.audio) {
                setText('stat-audio-bitrate', stats.audio.bitrate != null ? stats.audio.bitrate + ' kbps' : '-');
                setText('stat-audio-jbuf', formatMs(stats.audio.jitterBufferDelay));
                setText('stat-audio-jitter', formatMs(stats.audio.jitter));
                setText('stat-audio-loss', formatLoss(stats.audio.packetsLost, stats.audio.packetsReceived));
                setText('stat-audio-codec', stats.audio.codec || '-');
            }

            if (stats.video) {
                setText('stat-video-bitrate', stats.video.bitrate != null ? stats.video.bitrate + ' kbps' : '-');
                setText('stat-video-jbuf', formatMs(stats.video.jitterBufferDelay));
                setText('stat-video-jitter', formatMs(stats.video.jitter));
                setText('stat-video-loss', formatLoss(stats.video.packetsLost, stats.video.packetsReceived));
                setText('stat-video-codec', stats.video.codec || '-');
                setText('stat-video-res', stats.video.frameWidth && stats.video.frameHeight
                    ? stats.video.frameWidth + 'x' + stats.video.frameHeight : '-');
                setText('stat-video-fps', stats.video.fps != null ? stats.video.fps + '' : '-');
                setText('stat-video-dropped', stats.video.framesDropped + '');
                setText('stat-video-nack-pli', stats.video.nackCount + ' / ' + stats.video.pliCount);
            }

            if (stats.transport) {
                setText('stat-rtt', formatMs(stats.transport.rtt));
            }

            // A/V sync offset - highlight if too large
            const syncEl = document.getElementById('stat-av-sync');
            if (stats.avSyncOffset != null) {
                const absOffset = Math.abs(stats.avSyncOffset);
                syncEl.textContent = stats.avSyncOffset.toFixed(1) + ' ms';
                syncEl.className = absOffset > 80 ? 'stats-warn' : absOffset > 40 ? 'stats-caution' : '';
            } else {
                syncEl.textContent = '-';
                syncEl.className = '';
            }
        }

        function setText(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }

        // Auto-connect if endpoint is provided
        window.onload = () => {
            document.getElementById('hostAddress').textContent = location.host;
            document.title = 'WHEP Player | Strom | ' + location.host;
            // Restore debug and stats mode from previous session
            const debugRestored = restoreDebugMode('whep-debug');
            if (debugRestored) setWhepDebugMode(true);
            try {
                if (localStorage.getItem('whep-stats') === 'true') {
                    document.getElementById('statsMode').checked = true;
                    document.getElementById('statsPanel').style.display = 'block';
                }
            } catch (e) {}
            // Enumerate audio output devices
            deviceManager.enumerate();
            // Set endpoint from server-provided value
            const serverEndpoint = '{{ENDPOINT}}';
            if (serverEndpoint) {
                document.getElementById('endpoint').value = location.protocol + '//' + location.host + encodeURI(serverEndpoint);
            }

            // Auto-test mode: ?autotest=1
            // Loops: connect -> verify stream -> disconnect -> wait -> reconnect -> verify -> repeat
            const params = new URLSearchParams(window.location.search);
            if (params.get('autotest') === '1') {
                // Enable debug mode for log relay during autotest
                const debugCheckbox = document.getElementById('debugMode');
                if (debugCheckbox) { debugCheckbox.checked = true; whepDebugMode = true; }

                let cycle = 0;
                let passCount = 0;
                let failCount = 0;

                function autotestConnect() {
                    // Clean up any existing connection
                    if (connection) {
                        connection.callbacks = {};
                        connection.close();
                        connection = null;
                    }
                    cancelReconnect();

                    return new Promise((resolve) => {
                        let settled = false;
                        const settle = (result) => {
                            if (!settled) { settled = true; resolve(result); }
                        };

                        connectionId++;
                        const myId = connectionId;
                        const endpoint = document.getElementById('endpoint').value.trim();

                        connection = new WhepConnection(endpoint, {
                            onAudioTrack: (stream) => {
                                if (myId !== connectionId) return;
                                document.getElementById('audio').srcObject = stream;
                            },
                            onVideoTrack: (stream) => {
                                if (myId !== connectionId) return;
                                document.getElementById('video').srcObject = stream;
                            },
                            onConnected: () => {
                                if (myId !== connectionId) return;
                                settle('connected');
                            },
                            onMediaStatus: () => {},
                            onError: (msg) => {
                                if (myId !== connectionId) return;
                                settle('error: ' + msg);
                            },
                            onDisconnected: () => {
                                if (myId !== connectionId) return;
                                settle('disconnected');
                            },
                            onIceState: () => {},
                            onLog: (msg, type) => {
                                if (myId !== connectionId) return;
                                log(msg, type || '');
                            }
                        });
                        connection.connect();

                        // Timeout
                        setTimeout(() => settle('timeout'), 30000);
                    });
                }

                function autotestDisconnect() {
                    cancelReconnect();
                    wantConnected = false;
                    connectionId++;
                    if (connection) {
                        connection.callbacks = {};
                        connection.disconnect();
                        connection = null;
                    }
                }

                async function runAutoTestCycle() {
                    cycle++;
                    log('=== WHEP AUTOTEST cycle ' + cycle + ': connect -> disconnect -> reconnect ===', 'warning');
                    wantConnected = false;

                    // Phase 1: Connect
                    log('AUTOTEST [' + cycle + ']: Connect', 'warning');
                    let result = await autotestConnect();
                    log('AUTOTEST [' + cycle + ']: Connect result: ' + result);
                    if (result !== 'connected') {
                        log('AUTOTEST [' + cycle + ']: Initial connect failed (' + result + '), retrying cycle', 'error');
                        failCount++;
                        autotestDisconnect();
                        await new Promise(r => setTimeout(r, 5000));
                        runAutoTestCycle();
                        return;
                    }

                    // Stay connected 10s to verify stability
                    await new Promise(r => setTimeout(r, 10000));
                    if (!connection || !connection.isConnected()) {
                        log('AUTOTEST [' + cycle + ']: Connection dropped during stability check', 'error');
                        failCount++;
                        autotestDisconnect();
                        await new Promise(r => setTimeout(r, 5000));
                        runAutoTestCycle();
                        return;
                    }

                    // Phase 2: Disconnect
                    log('AUTOTEST [' + cycle + ']: Disconnect', 'warning');
                    autotestDisconnect();
                    await new Promise(r => setTimeout(r, 4000));

                    // Phase 3: Reconnect
                    log('AUTOTEST [' + cycle + ']: Reconnect', 'warning');
                    result = await autotestConnect();
                    const ok = result === 'connected';
                    if (ok) passCount++; else failCount++;
                    log('AUTOTEST [' + cycle + ']: ' + (ok ? 'PASS' : 'FAIL (' + result + ')') +
                        ' [total: ' + passCount + ' pass, ' + failCount + ' fail]',
                        ok ? 'success' : 'error');

                    // Clean disconnect
                    autotestDisconnect();
                    await new Promise(r => setTimeout(r, 4000));
                    runAutoTestCycle();
                }

                // Start after a short delay
                if (serverEndpoint) {
                    setTimeout(() => runAutoTestCycle(), 2000);
                } else {
                    log('AUTOTEST: No endpoint configured', 'error');
                }
            } else if (serverEndpoint) {
                // Normal auto-connect
                wantConnected = true;
                setTimeout(() => doConnect(false), 500);
            }
        };
    </script>
</body>
</html>
