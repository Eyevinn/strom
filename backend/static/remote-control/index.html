<!DOCTYPE html>
<!-- Strom remote control page, version 5 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Strom HTML remote control</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --field: #111317;
    --line: #2b303b;
    --text: #e7e9ee;
    --muted: #9aa3b2;
    --ok: #4ec9a5;
    --warn: #e0a34a;
    --bad: #e06c75;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header, nav {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: none;
    min-width: 0;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted); flex: none;
  }
  .dot.live { background: var(--ok); }
  .dot.gone { background: var(--bad); }
  .title { font-weight: 600; white-space: nowrap; }
  .source {
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .source b { color: var(--text); font-weight: 500; }
  .spacer { flex: 1; }
  .status { color: var(--muted); white-space: nowrap; }
  nav button {
    flex: none;
    min-width: 34px; height: 30px;
    padding: 0 8px;
    background: var(--field);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    cursor: pointer;
  }
  nav button:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
  #address {
    flex: 1;
    min-width: 0;
    height: 30px;
    padding: 0 10px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    /* 16px keeps iOS from zooming the page when the field takes focus. */
    font: 16px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #address:focus { outline: 1px solid var(--ok); }
  #tabs {
    display: none;
    gap: 6px;
    padding: 6px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    flex: none;
  }
  #tabs.shown { display: flex; }
  .tab {
    display: flex; align-items: center; gap: 6px;
    max-width: 16rem;
    padding: 3px 4px 3px 10px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
    flex: none;
  }
  .tab.current { color: var(--text); border-color: var(--ok); }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .tab button {
    background: none; border: 0; color: var(--muted);
    font: inherit; cursor: pointer; padding: 0 6px;
  }
  #keyboard { display: none; }
  @media (pointer: coarse) {
    #keyboard { display: inline-block; }
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 0;
  }
  #screen {
    max-width: 100%;
    max-height: 100%;
    display: none;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: default;
    /* The finger belongs to the remote page: no scrolling, zooming or
       long-press menu on ours. */
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #screen.live { display: block; }
  #message {
    max-width: 30rem;
    text-align: center;
    color: var(--muted);
  }
  #message strong { color: var(--text); display: block; margin-bottom: 6px; }
  /* Receives the phone's on-screen keyboard. Kept on screen and at 16px so
     iOS neither refuses to focus it nor zooms the page when it does. */
  #typing {
    position: fixed;
    left: 0; bottom: 0;
    width: 1px; height: 1px;
    opacity: 0;
    font-size: 16px;
    border: 0; padding: 0;
    resize: none;
  }
  @media (max-width: 600px) {
    header, nav { padding: 6px 10px; gap: 6px; flex-wrap: wrap; }
    .spacer { display: none; }
    .status { width: 100%; font-size: 12px; }
    #address { order: 10; flex-basis: 100%; }
    main { padding: 6px; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="title">Strom HTML remote control</span>
  <span class="source" id="source"></span>
  <span class="spacer"></span>
  <span class="status" id="status">Connecting…</span>
</header>
<nav>
  <button id="back" title="Back" aria-label="Back" disabled>&#8592;</button>
  <button id="forward" title="Forward" aria-label="Forward" disabled>&#8594;</button>
  <button id="reload" title="Reload" aria-label="Reload">&#8635;</button>
  <button id="home" title="Back to the page this source is set to" aria-label="Home">&#8962;</button>
  <form id="go" style="display:contents">
    <input id="address" type="text" inputmode="url" enterkeyhint="go"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           aria-label="Address" placeholder="https://">
  </form>
  <button id="pin" title="Make this page where the source starts" aria-label="Set as start page">&#128204;</button>
  <button id="keyboard" title="Show the keyboard" aria-label="Keyboard">&#9000;</button>
</nav>
<div id="tabs" aria-label="Windows"></div>
<main>
  <img id="screen" alt="The page being rendered" draggable="false">
  <div id="message"><strong>Connecting to the page…</strong>If nothing appears, the flow may have stopped.</div>
</main>
<textarea id="typing" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type into the page"></textarea>
<script>
(() => {
  "use strict";

  const screen = document.getElementById("screen");
  const message = document.getElementById("message");
  const statusText = document.getElementById("status");
  const dot = document.getElementById("dot");
  const sourceText = document.getElementById("source");
  const address = document.getElementById("address");
  const backButton = document.getElementById("back");
  const forwardButton = document.getElementById("forward");
  const typing = document.getElementById("typing");

  // The key is already in our own path, so the socket needs no address of its
  // own: whatever host reached this page reaches the socket too.
  const base = location.pathname.replace(/\/+$/, "");
  const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + base + "/ws";

  let socket = null;
  let nextId = 1;
  let metadata = { pageScaleFactor: 1, offsetTop: 0 };
  let closedForGood = false;
  let history = { currentIndex: -1, entries: [] };
  const tabs = document.getElementById("tabs");
  const pending = new Map();

  function setState(kind, text) {
    statusText.textContent = text;
    dot.className = "dot" + (kind ? " " + kind : "");
  }

  function show(title, detail) {
    message.innerHTML = "";
    const strong = document.createElement("strong");
    strong.textContent = title;
    message.appendChild(strong);
    message.appendChild(document.createTextNode(detail || ""));
    message.style.display = "";
    screen.classList.remove("live");
  }

  function send(method, params, onResult) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    const id = nextId++;
    if (onResult) pending.set(id, onResult);
    socket.send(JSON.stringify({ id: id, method: method, params: params || {} }));
  }

  // --- Which source this is, and where it is -------------------------------

  function showSource(params) {
    sourceText.innerHTML = "";
    const flow = document.createElement("b");
    flow.textContent = params.flow || "";
    const block = document.createElement("b");
    block.textContent = params.block || "";
    sourceText.append(flow, " › ", block);
    document.title = (params.block || "HTML") + " – Strom HTML remote control";
    document.getElementById("home").title = "Back to " + (params.home || "the page this source is set to");
  }

  let currentUrl = "";

  function showAddress(url) {
    currentUrl = url || "";
    // Leave the field alone while someone is typing in it.
    if (document.activeElement !== address) address.value = currentUrl;
    address.title = currentUrl;
  }

  // The proxy checks the address and refuses anything but http, https and
  // data; a bare address is read as https.
  document.getElementById("go").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const url = address.value.trim();
    if (!url) return;
    address.blur();
    send("Page.navigate", { url: url }, () => {});
  });
  address.addEventListener("blur", () => { address.value = currentUrl; });

  document.getElementById("pin").addEventListener("click", () => {
    if (!currentUrl) return;
    send("Strom.setHome", { url: currentUrl }, (result) => {
      setState("live", "Start page set");
      document.getElementById("home").title = "Back to " + result.url;
    });
  });

  // The page, and any popups it opened - a login window, typically. The proxy
  // decides which windows these are and switches to a new one by itself.
  function showPages(params) {
    const pages = params.pages || [];
    tabs.innerHTML = "";
    tabs.classList.toggle("shown", pages.length > 1);
    for (const page of pages) {
      const tab = document.createElement("div");
      tab.className = "tab" + (page.id === params.current ? " current" : "");
      let label = page.popup ? "Popup" : "Page";
      try { label += ": " + new URL(page.url).host; } catch (e) {}
      const text = document.createElement("span");
      text.textContent = label;
      tab.title = (page.title ? page.title + " - " : "") + page.url;
      tab.appendChild(text);
      tab.addEventListener("click", () => send("Strom.switchPage", { targetId: page.id }));
      if (page.popup) {
        // A login that finishes in a popup leaves the popup logged in and
        // the page on air where it was. This loads the popup's page into the
        // source instead, and closes the popup.
        const adopt = document.createElement("button");
        adopt.textContent = "\u2913";
        adopt.title = "Show this page in the source, and close the popup";
        adopt.addEventListener("click", (ev) => {
          ev.stopPropagation();
          send("Strom.adoptPage", { targetId: page.id }, () => {
            setState("live", "Popup's page loaded into the source");
          });
        });
        tab.appendChild(adopt);
        const close = document.createElement("button");
        close.textContent = "\u00d7";
        close.title = "Close this popup";
        close.addEventListener("click", (ev) => {
          ev.stopPropagation();
          send("Strom.closePage", { targetId: page.id });
        });
        tab.appendChild(close);
      }
      tabs.appendChild(tab);
    }
  }

  // Everything that belongs to one window starts over on another.
  function startScreencast() {
    metadata = { pageScaleFactor: 1, offsetTop: 0 };
    history = { currentIndex: -1, entries: [] };
    send("Page.enable");
    send("Page.startScreencast", { format: "jpeg", quality: 80, everyNthFrame: 1 });
    refreshHistory();
  }

  function refreshHistory() {
    send("Page.getNavigationHistory", {}, (result) => {
      history = result;
      const entry = history.entries[history.currentIndex];
      if (entry) showAddress(entry.url);
      backButton.disabled = history.currentIndex <= 0;
      forwardButton.disabled = history.currentIndex >= history.entries.length - 1;
    });
  }

  function step(delta) {
    const entry = history.entries[history.currentIndex + delta];
    if (entry) send("Page.navigateToHistoryEntry", { entryId: entry.id });
  }

  backButton.addEventListener("click", () => step(-1));
  forwardButton.addEventListener("click", () => step(1));
  document.getElementById("reload").addEventListener("click", () => send("Page.reload", {}));
  // The proxy fills in the address; the page never gets to choose one.
  document.getElementById("home").addEventListener("click", () => send("Strom.goHome", {}));

  // --- Pointer input ---------------------------------------------------------

  // Alt, Ctrl, Meta, Shift - the bitmask the protocol expects.
  function modifiers(ev) {
    return (ev.altKey ? 1 : 0) | (ev.ctrlKey ? 2 : 0) | (ev.metaKey ? 4 : 0) | (ev.shiftKey ? 8 : 0);
  }

  const BUTTONS = ["left", "middle", "right", "back", "forward"];

  // Screen pixels to page pixels along each axis.
  function scale() {
    const rect = screen.getBoundingClientRect();
    if (!rect.width || !rect.height || !screen.naturalWidth) return null;
    const zoom = metadata.pageScaleFactor || 1;
    return { rect: rect, x: screen.naturalWidth / rect.width / zoom, y: screen.naturalHeight / rect.height / zoom };
  }

  // The picture is the viewport, so a point on it is a point in the page once
  // the display scaling and any pinch zoom are divided out.
  function pointIn(ev) {
    const s = scale();
    if (!s) return null;
    return {
      x: (ev.clientX - s.rect.left) * s.x,
      y: (ev.clientY - s.rect.top) * s.y - (metadata.offsetTop || 0),
    };
  }

  function mouse(type, ev, extra) {
    const at = pointIn(ev);
    if (!at) return;
    const params = Object.assign({
      type: type,
      x: at.x,
      y: at.y,
      modifiers: modifiers(ev),
      button: type === "mouseMoved" && !ev.buttons ? "none" : (BUTTONS[ev.button] || "left"),
      buttons: ev.buttons || 0,
      clickCount: type === "mouseMoved" ? 0 : (ev.detail || 1),
    }, extra || {});
    send("Input.dispatchMouseEvent", params);
  }

  // A touch screen fires compatibility mouse events after touches. They are
  // ignored for a moment after any touch so a tap is not sent twice.
  let lastTouch = 0;
  const fromTouch = () => Date.now() - lastTouch < 800;

  screen.addEventListener("mousedown", (ev) => { if (fromTouch()) return; ev.preventDefault(); mouse("mousePressed", ev); });
  screen.addEventListener("mouseup", (ev) => { if (fromTouch()) return; ev.preventDefault(); mouse("mouseReleased", ev); });
  screen.addEventListener("mousemove", (ev) => { if (fromTouch()) return; mouse("mouseMoved", ev); });
  screen.addEventListener("contextmenu", (ev) => ev.preventDefault());
  screen.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    // Lines and pages to pixels, roughly as a browser would.
    const unit = ev.deltaMode === 1 ? 40 : ev.deltaMode === 2 ? 800 : 1;
    // The protocol takes the DOM's sign: positive deltaY scrolls down.
    mouse("mouseWheel", ev, { deltaX: ev.deltaX * unit, deltaY: ev.deltaY * unit });
  }, { passive: false });

  // One finger: a tap is a click, a drag scrolls the page under it.
  const TAP_SLOP = 8;
  let touch = null;

  screen.addEventListener("pointerdown", (ev) => {
    if (ev.pointerType === "mouse") return;
    ev.preventDefault();
    lastTouch = Date.now();
    if (touch) return; // a second finger; the first one keeps control
    touch = { id: ev.pointerId, startX: ev.clientX, startY: ev.clientY, lastX: ev.clientX, lastY: ev.clientY, dragging: false };
    screen.setPointerCapture(ev.pointerId);
  });

  screen.addEventListener("pointermove", (ev) => {
    if (!touch || ev.pointerId !== touch.id) return;
    ev.preventDefault();
    lastTouch = Date.now();
    if (!touch.dragging &&
        Math.hypot(ev.clientX - touch.startX, ev.clientY - touch.startY) > TAP_SLOP) {
      touch.dragging = true;
    }
    if (!touch.dragging) return;
    const s = scale();
    if (s) {
      // The content follows the finger, so the scroll runs against it.
      const dx = (touch.lastX - ev.clientX) * s.x;
      const dy = (touch.lastY - ev.clientY) * s.y;
      const at = pointIn({ clientX: touch.startX, clientY: touch.startY });
      if (at) {
        send("Input.dispatchMouseEvent", {
          type: "mouseWheel", x: at.x, y: at.y, modifiers: 0,
          button: "none", buttons: 0, clickCount: 0, deltaX: dx, deltaY: dy,
        });
      }
    }
    touch.lastX = ev.clientX;
    touch.lastY = ev.clientY;
  });

  function endTouch(ev, cancelled) {
    if (!touch || ev.pointerId !== touch.id) return;
    ev.preventDefault();
    lastTouch = Date.now();
    if (!cancelled && !touch.dragging) {
      const tap = { clientX: touch.startX, clientY: touch.startY, button: 0, buttons: 0, detail: 1 };
      mouse("mouseMoved", tap);
      mouse("mousePressed", Object.assign({}, tap, { buttons: 1 }));
      mouse("mouseReleased", tap);
    }
    touch = null;
  }
  screen.addEventListener("pointerup", (ev) => endTouch(ev, false));
  screen.addEventListener("pointercancel", (ev) => endTouch(ev, true));

  // --- Keyboard --------------------------------------------------------------

  function keyEvent(type, ev, text) {
    const code = ev.keyCode || 0;
    const params = {
      type: type,
      modifiers: modifiers(ev),
      key: ev.key,
      code: ev.code,
      windowsVirtualKeyCode: code,
      nativeVirtualKeyCode: code,
      autoRepeat: !!ev.repeat,
      location: ev.location || 0,
    };
    if (text) {
      params.text = text;
      params.unmodifiedText = text.toLowerCase();
    }
    send("Input.dispatchKeyEvent", params);
  }

  // Keys that carry a character of their own besides the printable ones.
  const KEY_TEXT = { Enter: "\r", Tab: "\t" };

  window.addEventListener("keydown", (ev) => {
    if (ev.target === address) return;
    // Leave the browser's own paste alone; the paste event below carries the
    // text, which is what a password manager needs to work.
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === "v" || ev.key === "V")) return;
    const printable = ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey;
    // A phone's keyboard types into the hidden field; its characters arrive
    // as input events below, which also carry predictive text and dictation.
    if (ev.target === typing && (printable || ev.isComposing || ev.key === "Unidentified")) return;
    ev.preventDefault();
    const text = printable ? ev.key : KEY_TEXT[ev.key];
    keyEvent(text ? "keyDown" : "rawKeyDown", ev, text);
  });

  window.addEventListener("keyup", (ev) => {
    if (ev.target === address) return;
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === "v" || ev.key === "V")) return;
    if (ev.target === typing && ev.key.length === 1) return;
    ev.preventDefault();
    keyEvent("keyUp", ev);
  });

  typing.addEventListener("input", (ev) => {
    if (ev.data && (!ev.inputType || ev.inputType.startsWith("insert"))) {
      send("Input.insertText", { text: ev.data });
    }
    typing.value = "";
  });

  document.getElementById("keyboard").addEventListener("click", () => {
    if (document.activeElement === typing) {
      typing.blur();
    } else {
      typing.focus();
    }
  });

  window.addEventListener("paste", (ev) => {
    if (ev.target === address) return;
    const text = ev.clipboardData && ev.clipboardData.getData("text");
    if (!text) return;
    ev.preventDefault();
    send("Input.insertText", { text: text });
  });

  // --- Connection ------------------------------------------------------------

  function connect() {
    setState("", "Connecting…");
    socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      setState("live", "Connected");
      startScreencast();
    };

    socket.onmessage = (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (msg.method === "Page.screencastFrame") {
        metadata = msg.params.metadata || metadata;
        screen.src = "data:image/jpeg;base64," + msg.params.data;
        screen.classList.add("live");
        message.style.display = "none";
        // Chromium waits for this before sending the next frame, so the
        // acknowledgement is the flow control: a slow link costs frame rate
        // and never builds a queue.
        send("Page.screencastFrameAck", { sessionId: msg.params.sessionId });
      } else if (msg.method === "Strom.pages") {
        showPages(msg.params || {});
      } else if (msg.method === "Strom.switched") {
        pending.clear();
        startScreencast();
      } else if (msg.method === "Strom.context") {
        showSource(msg.params || {});
      } else if (msg.method === "Page.frameNavigated") {
        const frame = msg.params && msg.params.frame;
        if (frame && !frame.parentId) {
          showAddress(frame.url);
          refreshHistory();
        }
      } else if (msg.method === "Page.navigatedWithinDocument") {
        refreshHistory();
      } else if (msg.id && pending.has(msg.id)) {
        const onResult = pending.get(msg.id);
        pending.delete(msg.id);
        if (msg.result) onResult(msg.result);
        else if (msg.error) setState("warn", msg.error.message || "Refused");
      } else if (msg.error) {
        setState("warn", msg.error.message || "Refused");
      }
    };

    socket.onclose = () => {
      if (closedForGood) return;
      setState("gone", "Disconnected");
      show("The session ended.", "The link may have expired or been revoked, or the flow stopped. Ask for a new link.");
    };

    socket.onerror = () => {
      setState("gone", "Connection failed");
    };
  }

  window.addEventListener("beforeunload", () => {
    closedForGood = true;
    if (socket && socket.readyState === WebSocket.OPEN) socket.close();
  });

  connect();
})();
</script>
</body>
</html>
