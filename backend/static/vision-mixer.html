<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Mixer - Strom</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            background: #000;
            color: #ddd;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Render native widget chrome (number-input spinners, scrollbars)
               in dark theme — otherwise Chrome paints the spin buttons on a
               white box inside our purple inputs. */
            color-scheme: dark;
        }

        /* Multiview player */
        .multiview {
            flex: 1;
            background: #000;
            min-height: 0;
        }
        .multiview video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Control surface */
        .controls {
            background: #252525;
            padding: 12px 16px;
            display: flex;
            gap: 16px;
            align-items: stretch;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.2s ease;
            /* Cap, not a fixed height: the bar only grows past ~200px when a
               wipe/FX picker is expanded (4 grid rows ≈ 270px worst case). */
            max-height: 280px;
            overflow: hidden;
        }
        body.editing-layout .controls {
            max-height: 70vh;
        }

        /* Bus section */
        .buses {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bus-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bus-label {
            font-size: 11px;
            font-weight: 700;
            width: 36px;
            text-align: right;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .bus-label.pgm { color: #ff3333; }
        .bus-label.pvw { color: #33cc33; }

        .bus-buttons {
            display: flex;
            gap: 3px;
            flex: 1;
            flex-wrap: wrap;
            min-width: 0;
        }

        .src-btn {
            flex: 1 1 0;
            min-width: 36px;
            height: 36px;
            border: 2px solid #444;
            border-radius: 4px;
            background: #2a2a2a;
            color: #999;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
        }

        .src-btn:hover {
            border-color: #666;
            color: #ccc;
        }
        .src-btn:focus {
            outline: none;
        }
        /* Indicator variant used by the PGM bus — display only, no click.
           Removes the pointer cursor + hover affordance so it doesn't look
           interactive. The active (red) tally still shows what's on air. */
        .src-btn.indicator,
        .pip-btn.indicator {
            cursor: default;
        }
        .src-btn.indicator:hover {
            border-color: #444;
            color: #999;
        }
        .pip-btn.indicator:hover {
            border-color: #555;
            color: #999;
        }

        /* "Via PiP" tally: an input is visible on this bus indirectly because
           the PiP currently on the bus uses it as bg or as a zone source.
           Dimmer hue than the direct active tally so the eye still ranks
           "direct > via-pip" at a glance. Matches the multiview thumbnail
           rings in overlay.rs (PGM_VIA_PIP / PVW_VIA_PIP).
           Declared BEFORE the direct .pgm-active / .pvw-active blocks so the
           direct tally wins on equal specificity — JS keeps them mutually
           exclusive today, but the source order is the safety net. */
        .src-btn.pgm-via-pip {
            background: #4a0000;
            border-color: #8c0000;
            color: #f0bbbb;
        }
        .src-btn.pvw-via-pip {
            background: #002a00;
            border-color: #008c00;
            color: #bbf0bb;
        }

        .src-btn.pgm-active {
            background: #cc0000;
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
        }

        .src-btn.pvw-active {
            background: #006600;
            border-color: #33cc33;
            color: #fff;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
        }

        /* Transition section */
        .transition-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            /* Wide enough that the 6-column wipe/FX grids keep readable
               labels and the type row breathes. */
            min-width: 340px;
            flex-shrink: 0;
            border-left: 1px solid #444;
            padding-left: 16px;
        }

        .transition-buttons {
            display: flex;
            gap: 6px;
        }

        .take-btn {
            height: 42px;
            border: 2px solid;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: all 0.15s ease;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .take-btn.cut {
            background: #cc0000;
            border-color: #ff3333;
            color: #fff;
        }
        .take-btn:focus, .type-btn:focus, .duration-preset:focus {
            outline: none;
        }
        .take-btn.cut:hover {
            background: #ee0000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
        }

        .take-btn.auto {
            background: #333;
            border-color: #666;
            color: #ddd;
        }
        .take-btn.auto:hover {
            background: #444;
            border-color: #888;
        }
        .take-btn.auto.active {
            background: #995500;
            border-color: #ff9900;
            color: #fff;
            box-shadow: 0 0 8px rgba(255, 153, 0, 0.4);
        }
        .take-btn.ftb-active {
            background: #cc0000;
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
            animation: pulse 1.5s infinite;
        }

        /* Transition type selector */
        .type-row {
            display: flex;
            gap: 4px;
        }

        .type-btn {
            flex: 1;
            height: 28px;
            border: 1px solid #444;
            border-radius: 3px;
            background: #2a2a2a;
            color: #888;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .type-btn.active {
            background: #444;
            border-color: #888;
            color: #fff;
        }
        .type-btn:hover { border-color: #666; }
        .dir-row.hidden { display: none; }
        .dir-btn { font-size: 13px; }
        /* Wipe shape / master FX pickers: grids so the many buttons keep a
           uniform, readable size instead of squeezing into one flex row. */
        .wipe-grid, .fx-grid {
            display: grid;
            gap: 4px;
        }
        .wipe-grid, .fx-grid { grid-template-columns: repeat(6, 1fr); }
        .wipe-grid.hidden, .fx-grid.hidden { display: none; }
        .wipe-grid .type-btn, .fx-grid .type-btn {
            font-size: 10px;
            letter-spacing: 0;
            padding: 0 2px;
            min-width: 0;
        }
        /* Standard/More tiers: the broadcast-staple shapes are always visible;
           novelty shapes sit behind a MORE toggle so the default picker reads
           like a production switcher, not an effects demo. */
        .wipe-grid .novelty, .fx-grid .novelty { display: none; }
        .wipe-grid.expanded .novelty, .fx-grid.expanded .novelty { display: flex; }
        .more-btn { color: #666; border-style: dashed; }
        .more-btn:hover { color: #aaa; }
        /* Shader looks panel */
        .fx-looks-title {
            font-weight: bold;
            color: #ccc;
            margin-bottom: 6px;
        }
        .fx-looks-hint {
            font-weight: normal;
            color: #777;
            font-size: 11px;
        }
        .fx-look-row {
            display: grid;
            grid-template-columns: 110px 120px 1fr;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .fx-look-row:last-child { border-bottom: none; }
        .fx-look-label {
            color: #aaa;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .fx-look-row select {
            background: #2a2a2a;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 3px;
            height: 24px;
            width: 100%;
        }
        .fx-look-params {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .fx-look-params label { color: #888; font-size: 11px; }
        .fx-look-params input[type="range"] { width: 90px; }
        .fx-look-params input[type="color"] {
            width: 28px;
            height: 22px;
            padding: 0;
            border: 1px solid #444;
            border-radius: 3px;
            background: #2a2a2a;
        }
        .fx-look-params .fx-val {
            color: #888;
            font-size: 11px;
            min-width: 30px;
        }

        /* Duration row */
        .duration-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .duration-row label {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }
        .duration-input {
            width: 60px;
            height: 26px;
            padding: 0 4px;
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            color: #ddd;
            text-align: center;
            font-size: 12px;
        }
        .duration-preset {
            height: 26px;
            padding: 0 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 3px;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .duration-preset:hover { border-color: #666; color: #ccc; }
        .duration-preset.active { background: #444; color: #fff; border-color: #888; }

        /* Shared color tokens for the PiP/zone editor.
           Kept local to .pip-* rules so the rest of the UI is untouched. */
        :root {
            --pip-text: #d6d0e0;
            --pip-text-dim: #8a7aa0;
            --pip-text-muted: #5a4d6a;
            --pip-accent: #8a5acc;
            --pip-accent-bright: #d6b8ff;
            --pip-accent-fill: #5a3a7a;
            --pip-bg-panel: #1a1320;
            --pip-bg-elevated: #14101c;
            --pip-bg-control: #2a1a3a;
            --pip-border: #3a2350;
            --pip-border-strong: #5a3a7a;
            --pip-warn: #ffaa00;
        }

        /* PiP controls (purple-ish to distinguish from regular inputs) */
        .pip-btn {
            flex: 1 1 0;
            min-width: 36px;
            height: 36px;
            padding: 0 4px;
            background: #2a1a3a;
            border: 2px solid #5a3a7a;
            border-radius: 4px;
            color: #b18ad6;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .pip-btn:focus { outline: none; }
        .pip-btn:hover { border-color: #8a5acc; color: #d6b8ff; }
        .pip-btn.pgm-active { background: #cc0000; border-color: #ee0000; color: #fff; }
        .pip-btn.pvw-active { background: #006600; border-color: #00aa00; color: #fff; }

        /* PiP config panel */
        .pip-config-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 16px;
            background: var(--pip-bg-panel);
            border-top: 1px solid var(--pip-border);
            max-height: 22vh;
            overflow-y: auto;
            transition: max-height 0.18s ease-out;
            font-size: 11px;
            font-weight: 600;
            color: var(--pip-text);
        }
        .pip-config-panel.editing {
            max-height: 70vh;
        }
        .pip-config-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .pip-edit-btn {
            margin-left: auto;
            background: var(--pip-bg-control);
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            color: var(--pip-accent-bright);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
        }
        .pip-edit-btn:hover { border-color: var(--pip-accent); color: #fff; }
        .pip-edit-btn.active {
            background: var(--pip-accent-fill);
            border-color: var(--pip-accent);
            color: #fff;
        }
        .pip-summary {
            color: var(--pip-text-dim);
            font-size: 11px;
            font-weight: 400;
        }
        .pip-editor {
            display: inline-flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            background: var(--pip-bg-elevated);
            border: 1px solid var(--pip-border);
            border-radius: 4px;
            align-self: flex-start;
        }
        /* Two equal columns — Zones and Crop/Zoom — each: header row with
           its tools, the canvas, then compact control rows beneath. */
        .pip-editor-row {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }
        .pip-editor-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pip-editor-head {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 11px;
            font-weight: 600;
            color: var(--pip-text);
            min-height: 26px;
        }
        .pip-editor-title {
            color: var(--pip-accent-bright);
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .pip-editor-ctrl {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 11px;
            font-weight: 600;
            color: var(--pip-text-dim);
        }
        .pip-editor-ctrl-label {
            color: var(--pip-text);
            font-weight: 700;
        }
        /* Narrower px inputs so X/Y/W/H (+cap) fit on a single control row. */
        .pip-editor-ctrl .pip-zone-px-input {
            width: 52px;
        }
        .pip-editor-ctrl .pip-zone-cap-input {
            width: 40px;
        }
        /* Compact color swatch for the zone border. */
        .pip-zone-border-color {
            width: 28px;
            height: 24px;
            padding: 0;
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            background: var(--pip-bg-control);
            cursor: pointer;
        }
        /* One shared one-line legend for the whole editor. */
        .pip-editor-footer {
            font-size: 10px;
            color: var(--pip-text-muted);
            max-width: 860px;
        }
        .pip-config-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 11px;
            font-weight: 600;
            color: var(--pip-text);
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .pip-config-row.on-pgm {
            background: rgba(204, 0, 0, 0.22);
            box-shadow: inset 0 0 0 1px rgba(255, 51, 51, 0.6);
        }
        .pip-config-row.on-pvw {
            background: rgba(0, 102, 0, 0.22);
            box-shadow: inset 0 0 0 1px rgba(51, 204, 51, 0.6);
        }
        .pip-config-row .pip-config-label {
            color: var(--pip-accent-bright);
            font-weight: 700;
            min-width: 50px;
            letter-spacing: 0.3px;
        }
        .pip-config-row.on-pgm .pip-config-label { color: #ff8a8a; }
        .pip-config-row.on-pvw .pip-config-label { color: #8aff8a; }
        .pip-config-row .pip-row-tag {
            color: var(--pip-text-dim);
            font-weight: 400;
            margin-left: 4px;
        }
        /* Zone selector chip on the PiP row (compact, distinct from input chips). */
        .pip-zone-selector {
            height: 24px;
            min-width: 30px;
            padding: 0 8px;
            background: transparent;
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            color: var(--pip-accent-bright);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            user-select: none;
        }
        .pip-zone-selector:hover {
            border-color: var(--pip-accent);
            background: rgba(138, 90, 204, 0.12);
        }
        .pip-zone-selector.active {
            background: var(--pip-warn);
            border-color: var(--pip-warn);
            color: #1a1320;
        }
        .pip-zone-selector .zone-count {
            font-weight: 400;
            opacity: 0.7;
        }
        .pip-zone-selector.active .zone-count { opacity: 1; }
        .pip-bg-select {
            height: 24px;
            background: var(--pip-bg-control);
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            color: var(--pip-text);
            padding: 0 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .pip-overlay-chip {
            width: 28px;
            height: 24px;
            background: var(--pip-bg-control);
            border: 1px solid var(--pip-border);
            border-radius: 3px;
            color: var(--pip-text-dim);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .pip-overlay-chip:hover {
            border-color: var(--pip-accent);
            color: var(--pip-accent-bright);
        }
        .pip-overlay-chip.active {
            background: var(--pip-accent-fill);
            border-color: var(--pip-accent);
            color: #fff;
        }
        .pip-overlay-chip.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* Source sits in another zone of this PiP: taken (dimmed fill),
           clicking moves it to the active zone. */
        .pip-overlay-chip.elsewhere {
            background: var(--pip-bg-control);
            border-color: var(--pip-accent);
            border-style: dashed;
            color: var(--pip-text-dim);
        }

        /* PiP zone editor — visual canvas per PiP */
        .pip-canvas {
            position: relative;
            width: 480px;
            height: 270px;
            background: var(--pip-bg-panel);
            border: 1px solid var(--pip-border);
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
            user-select: none;
        }
        .pip-canvas-bg {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                45deg,
                rgba(138, 90, 204, 0.06),
                rgba(138, 90, 204, 0.06) 6px,
                transparent 6px,
                transparent 14px
            );
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pip-text-dim);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            pointer-events: none;
        }
        .pip-canvas-zone {
            position: absolute;
            background: rgba(138, 90, 204, 0.18);
            border: 1px solid var(--pip-accent);
            box-sizing: border-box;
            cursor: move;
            color: var(--pip-text);
            font-size: 10px;
            font-weight: 600;
            min-width: 16px;
            min-height: 16px;
            display: flex;
            flex-direction: column;
        }
        .pip-canvas-zone.auto {
            border-style: dashed;
            background: rgba(138, 90, 204, 0.08);
        }
        .pip-canvas-zone.active {
            border-color: var(--pip-warn);
            box-shadow: 0 0 0 1px var(--pip-warn) inset, 0 0 8px rgba(255, 170, 0, 0.3);
        }
        .pip-canvas-zone:hover {
            box-shadow: 0 0 0 1px var(--pip-accent-bright) inset;
        }
        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            background: rgba(0, 0, 0, 0.5);
            pointer-events: none;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .zone-cap {
            color: var(--pip-warn);
        }
        .zone-sources {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 3px;
            padding: 4px;
            overflow: hidden;
        }
        .zone-source-chip {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--pip-accent-bright);
            color: #fff;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 2px;
            cursor: pointer;
            user-select: none;
        }
        .zone-source-chip:hover {
            background: #cc0000;
            border-color: #ff3333;
        }
        .pip-canvas-zone .zone-remove {
            position: absolute;
            top: -1px;
            right: -1px;
            width: 16px;
            height: 16px;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 0 0 0 3px;
            font-size: 11px;
            line-height: 1;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 5;
        }
        .pip-canvas-zone:hover .zone-remove { opacity: 1; }
        .pip-canvas-zone .zone-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--pip-accent-bright);
            border: 1px solid var(--pip-border-strong);
            z-index: 4;
        }
        .pip-canvas-zone .zone-handle.nw { left: -4px; top: -4px; cursor: nwse-resize; }
        .pip-canvas-zone .zone-handle.ne { right: -4px; top: -4px; cursor: nesw-resize; }
        .pip-canvas-zone .zone-handle.sw { left: -4px; bottom: -4px; cursor: nesw-resize; }
        .pip-canvas-zone .zone-handle.se { right: -4px; bottom: -4px; cursor: nwse-resize; }
        /* Crop ("zoom"/punch-in) editor — a source-frame canvas with a
           draggable/resizable crop window. Sits beside the zone canvas in
           the layout editor. */
        .pip-crop-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--pip-text);
            width: 320px;
            flex-shrink: 0;
        }
        .pip-crop-select {
            background: var(--pip-bg-control);
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            color: var(--pip-text);
            font-size: 11px;
            font-weight: 600;
            height: 24px;
            padding: 0 4px;
            flex: 1;
            min-width: 0;
        }
        .pip-crop-canvas {
            position: relative;
            width: 320px;
            height: 180px;
            background: var(--pip-bg-panel);
            border: 1px solid var(--pip-border);
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
            user-select: none;
        }
        .pip-crop-canvas .pip-crop-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pip-text-dim);
            font-size: 11px;
            text-align: center;
            padding: 0 16px;
            pointer-events: none;
        }
        .pip-crop-frame {
            position: absolute;
            border: 1px solid var(--pip-warn);
            /* Dim everything outside the crop window. */
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
            cursor: move;
            z-index: 2;
        }
        .pip-crop-frame .zone-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--pip-warn);
            border: 1px solid var(--pip-border-strong);
            z-index: 4;
        }
        .pip-crop-frame .zone-handle.nw { left: -4px; top: -4px; cursor: nwse-resize; }
        .pip-crop-frame .zone-handle.ne { right: -4px; top: -4px; cursor: nesw-resize; }
        .pip-crop-frame .zone-handle.sw { left: -4px; bottom: -4px; cursor: nesw-resize; }
        .pip-crop-frame .zone-handle.se { right: -4px; bottom: -4px; cursor: nwse-resize; }
        .pip-crop-zoom-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--pip-text-dim);
        }
        .pip-crop-zoom-row input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: var(--pip-accent);
        }
        .pip-crop-zoom-val {
            width: 42px;
            text-align: right;
            color: var(--pip-text);
            font-variant-numeric: tabular-nums;
        }
        .pip-crop-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pip-crop-reset-btn {
            background: var(--pip-bg-control);
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            color: var(--pip-text);
            font-size: 11px;
            font-weight: 600;
            height: 24px;
            padding: 0 10px;
            cursor: pointer;
        }
        .pip-crop-reset-btn:hover {
            color: var(--pip-accent-bright);
            border-color: var(--pip-accent);
        }
        .pip-zone-add-btn {
            background: var(--pip-bg-control);
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            color: var(--pip-accent-bright);
            font-size: 11px;
            font-weight: 600;
            padding: 6px 12px;
            cursor: pointer;
        }
        .pip-zone-add-btn:disabled {
            color: var(--pip-text-muted);
            cursor: default;
        }
        .pip-zone-add-btn:hover:not(:disabled) {
            border-color: var(--pip-accent);
            color: #fff;
        }
        .pip-zone-cap-row {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--pip-text-dim);
        }
        .pip-zone-cap-input {
            width: 48px;
            height: 24px;
            background: var(--pip-bg-control);
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            color: var(--pip-text);
            padding: 0 6px;
            font-size: 11px;
            font-weight: 600;
        }
        /* Pixel-precise rect editor for the active zone. Two rows of two
           inputs — X/Y above, W/H below — sized to fit the 220px toolbar. */
        .pip-zone-px-label {
            font-size: 11px;
            font-weight: 600;
            width: 10px;
            text-align: center;
        }
        .pip-zone-px-input {
            width: 64px;
            height: 24px;
            background: var(--pip-bg-control);
            border: 1px solid var(--pip-border-strong);
            border-radius: 3px;
            color: var(--pip-text);
            padding: 0 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .pip-zone-px-input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* Snap + grid toggle checkboxes for the layout editor. */
        .pip-zone-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
        }
        .pip-zone-toggle input[type="checkbox"] {
            cursor: pointer;
            margin: 0;
        }
        /* Grid overlay drawn on top of the canvas BG and under the zone rects.
           Quarter lines stay subtle (white) so layouts dominate visually;
           rule-of-thirds lines pop slightly (gold) to read at a glance. */
        .pip-canvas-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .pip-grid-line {
            position: absolute;
        }
        .pip-grid-line.v { top: 0; bottom: 0; width: 1px; }
        .pip-grid-line.h { left: 0; right: 0; height: 1px; }
        .pip-grid-line.quarter { background: rgba(255, 255, 255, 0.14); }
        .pip-grid-line.third { background: rgba(255, 200, 80, 0.45); }
        /* Lit-up while a drag/resize/px-input lands on this line. Bumped to a
           2px solid bright cyan with a faint glow so it pops above both the
           subtle quarter and the gold third base colors. */
        .pip-grid-line.active-snap {
            background: rgba(120, 230, 255, 0.95);
            box-shadow: 0 0 6px rgba(120, 230, 255, 0.7);
        }
        .pip-grid-line.active-snap.v { width: 2px; margin-left: -0.5px; }
        .pip-grid-line.active-snap.h { height: 2px; margin-top: -0.5px; }

        /* Status bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 16px;
            background: #1e1e1e;
            border-top: 1px solid #333;
            font-size: 11px;
            color: #666;
        }
        .on-air {
            background: #cc0000;
            color: #fff;
            padding: 2px 8px;
            border-radius: 2px;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 1px;
        }
        .status-text { color: #888; }
        .shortcut-hint { color: #555; font-size: 10px; }
        .dsk-btn {
            flex: 1;
            height: 28px;
            border: 2px solid #555;
            border-radius: 3px;
            background: #2a2a2a;
            color: #666;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .dsk-btn:focus { outline: none; }
        .dsk-btn:hover { border-color: #888; }
        .dsk-btn.on {
            background: #cc0000;
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 6px rgba(255, 0, 0, 0.4);
        }
        .dsk-btn.off {
            background: #333;
            border-color: #555;
            color: #888;
        }
        .overlay-alpha-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #444;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .overlay-alpha-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
        }
        .overlay-alpha-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ddd;
            border: none;
            cursor: pointer;
        }
        .overlay-alpha-value {
            font-size: 11px;
            color: #999;
            min-width: 32px;
            text-align: right;
        }
        .conn-indicators {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .conn-dot {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #888;
        }
        .conn-dot::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }
        .conn-dot.ok::before { background: #33cc33; }
        .conn-dot.err::before { background: #cc0000; }
        .conn-dot.warn::before { background: #cc9900; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Minimize-control mode */
        body.minimized .controls {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
            pointer-events: none;
        }
        .minimize-indicator {
            display: none;
            position: fixed;
            bottom: 28px;
            right: 16px;
            background: rgba(40, 40, 40, 0.85);
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 10px;
            color: #888;
            cursor: pointer;
            z-index: 10;
        }
        .minimize-indicator:hover { color: #ccc; border-color: #888; }
        body.minimized .minimize-indicator { display: block; }
    </style>
</head>
<body>
    <!-- Multiview monitor -->
    <div class="multiview">
        <video id="multiviewVideo" autoplay muted playsinline></video>
    </div>

    <!-- Control surface -->
    <div class="controls">
        <!-- PGM + PVW buses -->
        <div class="buses">
            <div class="bus-row">
                <span class="bus-label pgm">PGM</span>
                <div class="bus-buttons" id="pgmBus"></div>
            </div>
            <div class="bus-row">
                <span class="bus-label pvw">PVW</span>
                <div class="bus-buttons" id="pvwBus"></div>
            </div>
            <div class="bus-row" id="dskRow" style="display:none;">
                <span class="bus-label" style="color:#ff6666;">DSK</span>
                <div class="bus-buttons">
                    <button class="dsk-btn on" id="dsk0Btn" onclick="toggleDsk(0)">DSK 1 ON</button>
                    <button class="dsk-btn on" id="dsk1Btn" onclick="toggleDsk(1)" style="display:none;">DSK 2 ON</button>
                    <button class="dsk-btn on" id="dsk2Btn" onclick="toggleDsk(2)" style="display:none;">DSK 3 ON</button>
                    <button class="dsk-btn on" id="dsk3Btn" onclick="toggleDsk(3)" style="display:none;">DSK 4 ON</button>
                </div>
            </div>
            <div class="bus-row" id="overlayAlphaRow">
                <span class="bus-label" style="color:#aaa;">OVL</span>
                <div class="bus-buttons" style="align-items:center;">
                    <input type="range" class="overlay-alpha-slider" id="overlayAlphaSlider" min="0" max="1" step="0.01" value="1.0" oninput="onOverlayAlphaInput(this.value)">
                    <span class="overlay-alpha-value" id="overlayAlphaValue">1.0</span>
                </div>
            </div>
        </div>

        <!-- PiP composition panel (populated when num_pips > 0) -->
        <div class="pip-config-panel" id="pipConfigPanel" style="display:none;"></div>

        <!-- Shader FX (looks) panel (populated when the FX engine is available) -->
        <div class="pip-config-panel" id="fxPanel" style="display:none;"></div>

        <!-- Transition controls -->
        <div class="transition-panel">
            <div class="transition-buttons">
                <button class="take-btn cut" onclick="doCut()" title="Cut (X)">CUT</button>
                <button class="take-btn auto" id="autoBtn" onclick="doAuto()" title="Auto transition (Space)">AUTO</button>
                <button class="take-btn auto" id="ftbBtn" onclick="doFtb()" title="Fade to Black (F)">FTB</button>
                <button class="take-btn auto fx-only" id="fxLooksBtn" onclick="toggleFxPanel()" title="Shader looks: chroma key, blur, VHS, ... (GPU FX engine)">LOOKS</button>
            </div>
            <div class="type-row">
                <button class="type-btn active" data-type="fade" onclick="setTransitionType('fade')">MIX</button>
                <button class="type-btn" data-type="dip_to_black" onclick="setTransitionType('dip_to_black')">DIP</button>
                <button class="type-btn" data-type="push" onclick="setTransitionType('push')" title="Push — both pictures move together">PUSH</button>
                <button class="type-btn" data-type="slide" onclick="setTransitionType('slide')" title="Slide — new picture slides in over the old">SLIDE</button>
                <button class="type-btn fx-only" data-type="wipe" onclick="setTransitionType('wipe')" title="Shader wipe (GPU FX engine)">WIPE</button>
                <button class="type-btn fx-only" data-type="fx" onclick="setTransitionType('fx')" title="Master FX take (GPU FX engine)">FX</button>
            </div>
            <div class="type-row dir-row hidden" id="dirRow" title="Direction of motion">
                <button class="type-btn dir-btn active" data-dir="left" onclick="setTransitionDir('left')">&#8592;</button>
                <button class="type-btn dir-btn" data-dir="right" onclick="setTransitionDir('right')">&#8594;</button>
                <button class="type-btn dir-btn" data-dir="up" onclick="setTransitionDir('up')">&#8593;</button>
                <button class="type-btn dir-btn" data-dir="down" onclick="setTransitionDir('down')">&#8595;</button>
            </div>
            <div class="wipe-grid hidden" id="wipeRow" title="Wipe shape">
                <button class="type-btn wipe-btn dir-btn active" data-wipe="wipe_left" onclick="setWipeShape('wipe_left')">&#8592;</button>
                <button class="type-btn wipe-btn dir-btn" data-wipe="wipe_right" onclick="setWipeShape('wipe_right')">&#8594;</button>
                <button class="type-btn wipe-btn dir-btn" data-wipe="wipe_up" onclick="setWipeShape('wipe_up')">&#8593;</button>
                <button class="type-btn wipe-btn dir-btn" data-wipe="wipe_down" onclick="setWipeShape('wipe_down')">&#8595;</button>
                <button class="type-btn wipe-btn" data-wipe="iris_open" onclick="setWipeShape('iris_open')" title="Circle grows from center">IRIS+</button>
                <button class="type-btn wipe-btn" data-wipe="iris_close" onclick="setWipeShape('iris_close')" title="Reveals outside-in">IRIS&#8722;</button>
                <button class="type-btn wipe-btn" data-wipe="barn_doors" onclick="setWipeShape('barn_doors')" title="Opens from a center seam outward">BARN</button>
                <button class="type-btn wipe-btn" data-wipe="luma_wipe" onclick="setWipeShape('luma_wipe')" title="Dark areas hand over first">LUMA</button>
                <button class="type-btn more-btn" id="wipeMoreBtn" onclick="toggleMore('wipeRow')" title="Show novelty wipe shapes">MORE&#9662;</button>
                <button class="type-btn wipe-btn novelty" data-wipe="clock_wipe" onclick="setWipeShape('clock_wipe')" title="Radial clock sweep">CLOCK</button>
                <button class="type-btn wipe-btn novelty" data-wipe="blinds" onclick="setWipeShape('blinds')">BLINDS</button>
                <button class="type-btn wipe-btn novelty" data-wipe="checker_wipe" onclick="setWipeShape('checker_wipe')">CHECK</button>
                <button class="type-btn wipe-btn novelty" data-wipe="noise_dissolve" onclick="setWipeShape('noise_dissolve')" title="Granular film dissolve">NOISE</button>
                <button class="type-btn wipe-btn novelty" data-wipe="melt" onclick="setWipeShape('melt')" title="Doom-style melt — the picture drips away in columns">MELT</button>
                <button class="type-btn wipe-btn novelty" data-wipe="heart_iris" onclick="setWipeShape('heart_iris')" title="Heart grows from the center">HEART</button>
                <button class="type-btn wipe-btn novelty" data-wipe="star_wipe" onclick="setWipeShape('star_wipe')" title="Five-point star grows from the center">STAR</button>
                <button class="type-btn wipe-btn novelty" data-wipe="pinwheel" onclick="setWipeShape('pinwheel')" title="Radial blades sweep around the center">PINWHL</button>
                <button class="type-btn wipe-btn novelty" data-wipe="crosshatch" onclick="setWipeShape('crosshatch')" title="Ink-sketch hatch dissolve">HATCH</button>
                <button class="type-btn wipe-btn novelty" data-wipe="hex_dissolve" onclick="setWipeShape('hex_dissolve')" title="Chunky hexagon cells">HEX</button>
                <button class="type-btn wipe-btn novelty" data-wipe="warp_wipe" onclick="setWipeShape('warp_wipe')" title="Directional wipe with smear">WARP</button>
            </div>
            <div class="fx-grid hidden" id="fxRow" title="Master FX take">
                <button class="type-btn fxk-btn active" data-fx="flash_dissolve" onclick="setFxKind('flash_dissolve')" title="White flash over a crossfade">FLASH</button>
                <button class="type-btn more-btn" id="fxMoreBtn" onclick="toggleMore('fxRow')" title="Show novelty FX takes">MORE&#9662;</button>
                <button class="type-btn fxk-btn novelty" data-fx="glitch_cut" onclick="setFxKind('glitch_cut')" title="Digital glitch hides a hard cut">GLITCH</button>
                <button class="type-btn fxk-btn novelty" data-fx="whip_pan_left" onclick="setFxKind('whip_pan_left')" title="Camera whip with motion blur">WHIP&#8592;</button>
                <button class="type-btn fxk-btn novelty" data-fx="whip_pan_right" onclick="setFxKind('whip_pan_right')" title="Camera whip with motion blur">WHIP&#8594;</button>
                <button class="type-btn fxk-btn novelty" data-fx="punch_zoom" onclick="setFxKind('punch_zoom')" title="Zoom kick with shake">PUNCH</button>
                <button class="type-btn fxk-btn novelty" data-fx="pixelate_take" onclick="setFxKind('pixelate_take')" title="Dissolve into coarse blocks and back">PIXEL</button>
                <button class="type-btn fxk-btn novelty" data-fx="zoom_blur" onclick="setFxKind('zoom_blur')" title="Radial streak blur through the cut">ZOOM</button>
                <button class="type-btn fxk-btn novelty" data-fx="spin" onclick="setFxKind('spin')" title="Frame twists through the cut">SPIN</button>
                <button class="type-btn fxk-btn novelty" data-fx="tv_roll" onclick="setFxKind('tv_roll')" title="TV sync-loss vertical roll">ROLL</button>
                <button class="type-btn fxk-btn novelty" data-fx="negative_flash" onclick="setFxKind('negative_flash')" title="Frame inverts through the crossfade">NEG</button>
                <button class="type-btn fxk-btn novelty" data-fx="ripple" onclick="setFxKind('ripple')" title="Water ring ripples both pictures through a crossfade">RIPPLE</button>
            </div>
            <div class="duration-row">
                <label>Duration:</label>
                <button class="duration-preset" onclick="setDuration(0.5)">0.5s</button>
                <button class="duration-preset active" onclick="setDuration(1.0)">1.0s</button>
                <button class="duration-preset" onclick="setDuration(2.0)">2.0s</button>
                <input type="number" class="duration-input" id="durationInput" value="1.0" min="0.1" max="10" step="0.1" onchange="onDurationInput()">
            </div>
        </div>
    </div>

    <div class="minimize-indicator" onclick="toggleMinimize()" title="Show controls (M)">Controls hidden &middot; press M</div>

    <!-- Status bar -->
    <div class="status-bar">
        <span class="on-air">ON AIR</span>
        <div class="conn-indicators">
            <span class="conn-dot" id="whepDot" title="WHEP multiview">Video</span>
            <span class="conn-dot" id="wsDot" title="WebSocket control">WS</span>
        </div>
        <span class="status-text" id="statusText">Connecting...</span>
        <span class="shortcut-hint">v2.32-fx-panel-width | 1-9,0 = PVW | Space = AUTO | X = CUT | F = FTB | M = Hide</span>
    </div>

    <!-- Server-injected configuration (safe JSON encoding) -->
    <script id="vm-config" type="application/json">{{VM_CONFIG_JSON}}</script>

    <script src="/static/webrtc.js"></script>
    <script src="/static/whep.js"></script>
    <script>
        // ---- Configuration (parsed from safe JSON block) ----
        const _cfg = JSON.parse(document.getElementById('vm-config').textContent);
        const FLOW_ID = _cfg.flow_id;
        const BLOCK_ID = _cfg.block_id;
        const NUM_INPUTS = _cfg.num_inputs;
        let MULTIVIEW_ENDPOINT = _cfg.multiview_endpoint;
        const INPUT_LABELS = _cfg.input_labels;
        const NUM_DSK_INPUTS = _cfg.num_dsk_inputs || 0;
        const NUM_PIPS = _cfg.num_pips || 0;
        // PGM canvas size in pixels. Zone rects are stored normalized (0..1) so
        // they project cleanly into the multiview tile, big-PVW rect, and the
        // PGM/PVW outputs alike. The pixel input fields display values in PGM
        // coordinates because that's the broadcast canvas operators think in.
        const PGM_W = (_cfg.pgm_w && _cfg.pgm_w > 0) ? _cfg.pgm_w : 1920;
        const PGM_H = (_cfg.pgm_h && _cfg.pgm_h > 0) ? _cfg.pgm_h : 1080;
        // Negotiated per-input resolutions ({width, height} or null). Inputs
        // are NOT normalized to the PGM resolution — each source can have any
        // resolution/aspect. Refreshed when the layout editor opens.
        let INPUT_RESOLUTIONS = Array.isArray(_cfg.input_resolutions)
            ? _cfg.input_resolutions
            : [];

        // ---- State ----
        // PGM/PVW source: each bus shows either an input (number) or a PiP (currentPvwPip/currentPgmPip).
        // currentPgm/currentPvw is the input index, or null when the bus is showing a PiP.
        let currentPgm = (_cfg.initial_pgm != null) ? _cfg.initial_pgm : null;
        let currentPvw = (_cfg.initial_pvw != null) ? _cfg.initial_pvw : null;
        let dskEnabled = _cfg.dsk_states || [true, true, true, true];
        // PiPs: { bg, zones: [{rect, capacity, sources}], transforms } per
        // configured PiP. A zone with rect=null fills the whole PiP region;
        // sources in a zone auto-tile within its rect. capacity=null means
        // unlimited. transforms maps input index → normalized SourceCrop
        // ({left, top, right, bottom} edge fractions) — the "zoom"/punch-in.
        let pipConfigs = (_cfg.pips || []).map(p => ({
            bg: (p && p.bg != null) ? p.bg : null,
            zones: (p && Array.isArray(p.zones))
                ? p.zones.map(z => ({
                    rect: z && z.rect ? { ...z.rect } : null,
                    capacity: (z && z.capacity != null) ? z.capacity : null,
                    sources: (z && Array.isArray(z.sources)) ? z.sources.slice() : [],
                    border: (z && z.border) ? { ...z.border } : null
                }))
                : [],
            transforms: (p && p.transforms && typeof p.transforms === 'object')
                ? JSON.parse(JSON.stringify(p.transforms))
                : {}
        }));
        // Active zone target per PiP — input-chip clicks push into this zone.
        // Defaults to zone 0; user clicks a zone in the canvas to change focus.
        let activeZoneIdx = pipConfigs.map(() => 0);
        // Which PiP (if any) currently has its layout editor open. null = none.
        // Only one editor open at a time keeps the panel height bounded.
        let editingPipIdx = null;

        function toggleEditPip(pipIdx) {
            editingPipIdx = (editingPipIdx === pipIdx) ? null : pipIdx;
            // Crop target is editor-scoped — reset when the editor opens/closes.
            activeCropTarget = null;
            document.body.classList.toggle('editing-layout', editingPipIdx != null);
            buildPipConfigPanel();
            // Sources negotiate caps after page load — refresh resolutions so
            // the crop editor works with the real source aspect.
            if (editingPipIdx != null) refreshInputResolutions();
        }

        // Re-fetch negotiated input resolutions from the live state endpoint.
        // Rebuilds the open editor when they arrive.
        async function refreshInputResolutions() {
            try {
                const resp = await fetch(API_BASE + '/state');
                if (!resp.ok) return;
                const st = await resp.json();
                if (Array.isArray(st.input_resolutions)) {
                    INPUT_RESOLUTIONS = st.input_resolutions;
                    if (editingPipIdx != null) buildPipConfigPanel();
                }
            } catch {}
        }
        // Which PiP is currently shown on each bus (null = bus is showing an input, not a PiP).
        let currentPvwPip = (_cfg.pvw_pip != null) ? _cfg.pvw_pip : null;
        let currentPgmPip = (_cfg.pgm_pip != null) ? _cfg.pgm_pip : null;
        // Transition selection: base type + direction (push/slide only),
        // wipe shape (wipe base) or master FX kind (fx base).
        let transitionBase = 'fade';
        let transitionDir = 'left';
        let wipeShape = 'wipe_left';
        let fxKind = 'flash_dissolve';
        let transitionDurationMs = 1000;
        function currentTransitionType() {
            if (transitionBase === 'push' || transitionBase === 'slide')
                return transitionBase + '_' + transitionDir;
            if (transitionBase === 'wipe') return wipeShape;
            if (transitionBase === 'fx') return fxKind;
            return transitionBase;
        }
        // Shader FX engine availability (GPU backend with Shader FX enabled).
        // Resolved from the /state endpoint; gates the WIPE/FX/LOOKS UI.
        let FX_AVAILABLE = false;
        let inputEffects = [];
        let masterEffect = { type: 'none' };
        let transitioning = false;
        let ftbActive = _cfg.ftb_active || false;
        let overlayAlpha = _cfg.overlay_alpha != null ? _cfg.overlay_alpha : 1.0;
        let controlsMinimized = localStorage.getItem('vm-controls-minimized') === 'true';
        // Snap & grid toggles for the zone layout editor. Snap defaults ON
        // (preserves the original drag behavior); grid defaults OFF so the
        // editor stays visually clean unless the operator wants the guides.
        let snapEnabled = localStorage.getItem('vm-zone-snap') !== 'false';
        let gridVisible = localStorage.getItem('vm-zone-grid') === 'true';
        // Crop editor state: which input is being crop-edited in the open
        // layout editor (null = none) and whether the crop frame keeps the
        // destination box aspect (default ON so the crop fills the box).
        let activeCropTarget = null;
        let cropAspectLock = localStorage.getItem('vm-crop-aspect-lock') !== 'false';
        function toggleCropAspectLock() {
            cropAspectLock = !cropAspectLock;
            localStorage.setItem('vm-crop-aspect-lock', cropAspectLock);
            buildPipConfigPanel();
        }
        function toggleSnap() {
            snapEnabled = !snapEnabled;
            localStorage.setItem('vm-zone-snap', snapEnabled);
            buildPipConfigPanel();
        }
        function toggleGrid() {
            gridVisible = !gridVisible;
            localStorage.setItem('vm-zone-grid', gridVisible);
            buildPipConfigPanel();
        }

        function toggleMinimize() {
            controlsMinimized = !controlsMinimized;
            document.body.classList.toggle('minimized', controlsMinimized);
            localStorage.setItem('vm-controls-minimized', controlsMinimized);
        }

        // ---- API helpers ----
        const API_BASE = '/api/flows/' + FLOW_ID + '/blocks/' + BLOCK_ID;

        async function apiCall(method, path, body) {
            const resp = await fetch(API_BASE + path, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.details || err.message || resp.statusText);
            }
            return resp.json();
        }
        const apiPost = (path, body) => apiCall('POST', path, body);
        const apiPut = (path, body) => apiCall('PUT', path, body);

        // ---- PVW/PGM selection ----
        function selectPreview(input) {
            if (currentPgm === input && currentPgmPip == null) return;
            if (currentPvw === input && currentPvwPip == null) return;
            apiPut('/preview', { source: { input } })
                .then(r => {
                    currentPvw = (r.preview_input != null) ? r.preview_input : null;
                    currentPgm = (r.program_input != null) ? r.program_input : null;
                    currentPvwPip = (r.preview_pip != null) ? r.preview_pip : null;
                    currentPgmPip = (r.program_pip != null) ? r.program_pip : null;
                    updateButtons();
                    setStatus(currentPvw != null
                        ? 'PVW: Input ' + (currentPvw + 1)
                        : 'PVW: (no input)');
                })
                .catch(e => setStatus('Preview error: ' + e.message));
        }

        // ---- Transitions ----
        function doTake(type, durationMs) {
            if (transitioning) return;
            // FTB is auto-cancelled server-side when a transition is triggered
            transitioning = true;
            if (durationMs > 0) {
                document.getElementById('autoBtn').classList.add('active');
            }

            // Capture state before sending — swap immediately for responsive UI.
            // Includes PiP swap so the colored borders / PiP buttons reflect the new state.
            const fromPgm = currentPgm;
            const fromPvw = currentPvw;
            const fromPip = currentPgmPip;
            const toPip = currentPvwPip;
            currentPgm = fromPvw;
            currentPvw = fromPgm;
            currentPgmPip = toPip;
            currentPvwPip = fromPip;
            updateButtons();

            apiPost('/transition', {
                from_input: fromPgm ?? 0,
                to_input: fromPvw ?? 0,
                transition_type: type,
                duration_ms: durationMs
            }).then(r => {
                // Bus state is reconciled via the VisionMixerStateChanged WS event
                // broadcast right after the take.
                const actual = r.actual_transition_type;
                const note = (actual && actual !== type.toLowerCase())
                    ? ' (' + r.message + ' — downgraded to ' + actual + ')'
                    : '';
                setStatus(r.message + note);
                setTimeout(() => {
                    transitioning = false;
                    document.getElementById('autoBtn').classList.remove('active');
                }, durationMs);
            }).catch(e => {
                // Revert swap on error
                currentPgm = fromPgm;
                currentPvw = fromPvw;
                currentPgmPip = fromPip;
                currentPvwPip = toPip;
                updateButtons();
                transitioning = false;
                document.getElementById('autoBtn').classList.remove('active');
                setStatus('Transition error: ' + e.message);
            });
        }

        function doCut() {
            doTake('cut', 0);
        }

        function doAuto() {
            doTake(currentTransitionType(), transitionDurationMs);
        }

        // ---- FTB (Fade to Black) ----
        function doFtb() {
            apiPost('/ftb', { duration_ms: 500 })
                .then(r => {
                    ftbActive = r.active;
                    updateFtbButton();
                    setStatus(r.message);
                })
                .catch(e => setStatus('FTB error: ' + e.message));
        }

        function updateFtbButton() {
            const btn = document.getElementById('ftbBtn');
            btn.classList.toggle('ftb-active', ftbActive);
            btn.textContent = ftbActive ? 'FTB ON' : 'FTB';
        }

        // ---- DSK toggle ----
        function toggleDsk(index) {
            dskEnabled[index] = !dskEnabled[index];
            apiPost('/dsk', { dsk: index + 1, enabled: dskEnabled[index] })
                .then(r => {
                    updateDskButtons();
                    setStatus(r.message);
                })
                .catch(e => {
                    dskEnabled[index] = !dskEnabled[index]; // revert
                    setStatus('DSK error: ' + e.message);
                });
        }

        function updateDskButtons() {
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById('dsk' + i + 'Btn');
                if (btn) {
                    btn.classList.toggle('on', dskEnabled[i]);
                    btn.classList.toggle('off', !dskEnabled[i]);
                    btn.textContent = 'DSK ' + (i + 1) + (dskEnabled[i] ? ' ON' : ' OFF');
                }
            }
        }

        function initDskUi() {
            if (NUM_DSK_INPUTS > 0) {
                document.getElementById('dskRow').style.display = 'flex';
                for (let i = 1; i < NUM_DSK_INPUTS; i++) {
                    const btn = document.getElementById('dsk' + i + 'Btn');
                    if (btn) btn.style.display = '';
                }
                updateDskButtons();
            }
        }

        // ---- Overlay alpha ----
        let overlayAlphaTimeout = null;
        let overlayAlphaDragging = false;
        let overlayAlphaDragTimer = null;
        function onOverlayAlphaInput(val) {
            val = parseFloat(val);
            overlayAlpha = val;
            overlayAlphaDragging = true;
            document.getElementById('overlayAlphaValue').textContent = val.toFixed(2);
            // Clear drag flag shortly after last input (user released slider)
            if (overlayAlphaDragTimer) clearTimeout(overlayAlphaDragTimer);
            overlayAlphaDragTimer = setTimeout(() => { overlayAlphaDragging = false; }, 500);
            // Throttle: send at most every 50ms, drop intermediate values
            if (!overlayAlphaTimeout) {
                overlayAlphaTimeout = setTimeout(() => {
                    overlayAlphaTimeout = null;
                    apiPut('/overlay-alpha', { alpha: overlayAlpha })
                        .then(r => setStatus(r.message))
                        .catch(e => setStatus('Overlay alpha error: ' + e.message));
                }, 50);
            }
        }

        function updateOverlayAlphaUi() {
            document.getElementById('overlayAlphaSlider').value = overlayAlpha;
            document.getElementById('overlayAlphaValue').textContent = overlayAlpha.toFixed(2);
        }

        // ---- Shader FX looks (per-source + master effects) ----
        // Catalog mirrors strom_types::effects::VideoEffect. Param edits are
        // throttled; the backend only swaps uniforms when the kind is
        // unchanged, so sliders are cheap. `std: true` marks the production
        // staples; the rest render under a "Stylized" optgroup.
        const FX_CATALOG = [
            { type: 'none', label: 'None', params: [], std: true },
            { type: 'chroma_key', label: 'Chroma Key', std: true, params: [
                { k: 'key_color', label: 'Key', t: 'color', d: '#00B140' },
                { k: 'similarity', label: 'Similarity', t: 'range', min: 0, max: 1, step: 0.01, d: 0.35 },
                { k: 'smoothness', label: 'Soft', t: 'range', min: 0, max: 1, step: 0.01, d: 0.1 },
                { k: 'spill', label: 'Spill', t: 'range', min: 0, max: 1, step: 0.01, d: 0.5 },
            ]},
            { type: 'pixelate', label: 'Pixelate', std: true, params: [
                { k: 'block_size', label: 'Block', t: 'range', min: 2, max: 200, step: 1, d: 24 },
            ]},
            { type: 'blur', label: 'Blur', std: true, params: [
                { k: 'radius', label: 'Radius', t: 'range', min: 0, max: 20, step: 0.5, d: 6 },
            ]},
            { type: 'duotone', label: 'Duotone', params: [
                { k: 'low', label: 'Low', t: 'color', d: '#000000' },
                { k: 'high', label: 'High', t: 'color', d: '#FFFFFF' },
                { k: 'mix', label: 'Mix', t: 'range', min: 0, max: 1, step: 0.01, d: 1 },
            ]},
            { type: 'vignette', label: 'Vignette', std: true, params: [
                { k: 'amount', label: 'Amount', t: 'range', min: 0, max: 1, step: 0.01, d: 0.5 },
                { k: 'softness', label: 'Soft', t: 'range', min: 0.01, max: 1, step: 0.01, d: 0.5 },
            ]},
            { type: 'vhs', label: 'VHS', params: [
                { k: 'intensity', label: 'Intensity', t: 'range', min: 0, max: 1, step: 0.01, d: 0.5 },
            ]},
            { type: 'old_film', label: 'Old Film', params: [
                { k: 'intensity', label: 'Intensity', t: 'range', min: 0, max: 1, step: 0.01, d: 0.5 },
            ]},
            { type: 'edge_glow', label: 'Edge Glow', params: [
                { k: 'color', label: 'Color', t: 'color', d: '#00FFD0' },
                { k: 'intensity', label: 'Intensity', t: 'range', min: 0, max: 1, step: 0.01, d: 0.5 },
            ]},
            { type: 'crt', label: 'CRT', params: [
                { k: 'intensity', label: 'Intensity', t: 'range', min: 0, max: 1, step: 0.01, d: 0.5 },
            ]},
            { type: 'halftone', label: 'Halftone', params: [
                { k: 'dot_size', label: 'Dot', t: 'range', min: 3, max: 40, step: 1, d: 8 },
            ]},
            { type: 'thermal', label: 'Thermal', params: [
                { k: 'intensity', label: 'Intensity', t: 'range', min: 0, max: 1, step: 0.01, d: 1 },
            ]},
            { type: 'night_vision', label: 'Night Vision', params: [
                { k: 'intensity', label: 'Intensity', t: 'range', min: 0, max: 1, step: 0.01, d: 1 },
            ]},
            { type: 'posterize', label: 'Posterize', params: [
                { k: 'levels', label: 'Levels', t: 'range', min: 2, max: 16, step: 1, d: 5 },
            ]},
            { type: 'underwater', label: 'Underwater', params: [
                { k: 'intensity', label: 'Intensity', t: 'range', min: 0, max: 1, step: 0.01, d: 0.5 },
            ]},
        ];
        let fxPanelOpen = false;
        const fxPostTimers = {};

        function fxTargetKey(target) {
            return target === 'master' ? 'master' : 'input' + target.input;
        }

        function postEffect(target, effect) {
            const key = fxTargetKey(target);
            if (fxPostTimers[key]) clearTimeout(fxPostTimers[key]);
            fxPostTimers[key] = setTimeout(() => {
                delete fxPostTimers[key];
                apiPost('/effect', { target: target, effect: effect })
                    .then(r => setStatus(r.message))
                    .catch(e => setStatus('Effect error: ' + e.message));
            }, 80);
        }

        function effectFor(target) {
            return target === 'master'
                ? masterEffect
                : (inputEffects[target.input] || { type: 'none' });
        }

        function setEffectLocal(target, effect) {
            if (target === 'master') masterEffect = effect;
            else inputEffects[target.input] = effect;
        }

        function defaultEffect(type) {
            const def = FX_CATALOG.find(c => c.type === type);
            const e = { type: type };
            (def ? def.params : []).forEach(pr => { e[pr.k] = pr.d; });
            return e;
        }

        function onFxTypeChange(target, type) {
            const e = defaultEffect(type);
            setEffectLocal(target, e);
            postEffect(target, e);
            buildFxPanel();
        }

        function onFxParamInput(target, key, value, isNumber) {
            const e = Object.assign({}, effectFor(target));
            e[key] = isNumber ? parseFloat(value) : value;
            setEffectLocal(target, e);
            postEffect(target, e);
            const span = document.getElementById('fxval_' + fxTargetKey(target) + '_' + key);
            if (span && isNumber) span.textContent = parseFloat(value);
        }

        function fxRowHtml(target, label) {
            const e = effectFor(target);
            const key = fxTargetKey(target);
            const def = FX_CATALOG.find(c => c.type === e.type) || FX_CATALOG[0];
            const tj = JSON.stringify(target).replace(/"/g, '&quot;');
            let html = '<div class="fx-look-row">';
            html += '<span class="fx-look-label" title="' + label + '">' + label + '</span>';
            html += '<select onchange="onFxTypeChange(JSON.parse(this.dataset.t), this.value)" data-t="' + tj + '">';
            const optionHtml = c =>
                '<option value="' + c.type + '"' + (c.type === e.type ? ' selected' : '') + '>' + c.label + '</option>';
            FX_CATALOG.filter(c => c.std).forEach(c => { html += optionHtml(c); });
            html += '<optgroup label="Stylized">';
            FX_CATALOG.filter(c => !c.std).forEach(c => { html += optionHtml(c); });
            html += '</optgroup></select>';
            html += '<div class="fx-look-params">';
            def.params.forEach(pr => {
                const v = (e[pr.k] != null) ? e[pr.k] : pr.d;
                html += '<label>' + pr.label + '</label>';
                if (pr.t === 'color') {
                    html += '<input type="color" value="' + v + '" data-t="' + tj + '"'
                        + ' oninput="onFxParamInput(JSON.parse(this.dataset.t), \'' + pr.k + '\', this.value, false)">';
                } else {
                    html += '<input type="range" min="' + pr.min + '" max="' + pr.max + '" step="' + pr.step + '" value="' + v + '" data-t="' + tj + '"'
                        + ' oninput="onFxParamInput(JSON.parse(this.dataset.t), \'' + pr.k + '\', this.value, true)">';
                    html += '<span class="fx-val" id="fxval_' + key + '_' + pr.k + '">' + v + '</span>';
                }
            });
            html += '</div></div>';
            return html;
        }

        function buildFxPanel() {
            const panel = document.getElementById('fxPanel');
            if (!FX_AVAILABLE || !fxPanelOpen) { panel.style.display = 'none'; return; }
            let html = '<div class="fx-looks-title">Shader Looks'
                + ' <span class="fx-looks-hint">'
                + 'Source looks follow the source everywhere; the master look sits on PGM '
                + '(replaced by FX takes).</span></div>';
            html += fxRowHtml('master', 'PGM MASTER');
            for (let i = 0; i < NUM_INPUTS; i++) {
                html += fxRowHtml({ input: i }, INPUT_LABELS[i] || ('Input ' + (i + 1)));
            }
            panel.innerHTML = html;
            panel.style.display = '';
        }

        function toggleFxPanel() {
            fxPanelOpen = !fxPanelOpen;
            buildFxPanel();
        }

        // Resolve FX engine availability + current effects from /state.
        async function fetchFxState() {
            try {
                const resp = await fetch(API_BASE + '/state');
                if (!resp.ok) return;
                const st = await resp.json();
                FX_AVAILABLE = !!st.fx_available;
                if (Array.isArray(st.input_effects) && st.input_effects.length) {
                    inputEffects = st.input_effects;
                }
                if (st.master_effect) masterEffect = st.master_effect;
                updateFxAvailabilityUi();
                buildFxPanel();
            } catch {}
        }

        // ---- Transition type & duration ----
        function setTransitionType(base) {
            transitionBase = base;
            document.querySelectorAll('.type-btn[data-type]').forEach(b => {
                b.classList.toggle('active', b.dataset.type === base);
            });
            // Sub-pickers: direction (push/slide), wipe shape, master FX kind.
            document.getElementById('dirRow')
                .classList.toggle('hidden', base !== 'push' && base !== 'slide');
            document.getElementById('wipeRow').classList.toggle('hidden', base !== 'wipe');
            document.getElementById('fxRow').classList.toggle('hidden', base !== 'fx');
        }

        function setWipeShape(shape) {
            wipeShape = shape;
            document.querySelectorAll('.wipe-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.wipe === shape);
            });
        }

        function setFxKind(kind) {
            fxKind = kind;
            document.querySelectorAll('.fxk-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.fx === kind);
            });
        }

        // Standard/More tiers in the wipe and FX pickers. Expansion persists
        // browser-wide (same pattern as the other vm-* UI prefs) so operators
        // who use the novelty shapes keep them open across reloads.
        const MORE_BTN = { wipeRow: 'wipeMoreBtn', fxRow: 'fxMoreBtn' };
        function applyMoreState(gridId, expanded) {
            document.getElementById(gridId).classList.toggle('expanded', expanded);
            const btn = document.getElementById(MORE_BTN[gridId]);
            btn.innerHTML = expanded ? 'LESS&#9652;' : 'MORE&#9662;';
            // A collapsed grid hides the active button of a novelty selection;
            // fall back to the tier default so the picker never lies.
            if (!expanded) {
                const active = document.querySelector('#' + gridId + ' .novelty.active');
                if (active) {
                    if (gridId === 'wipeRow') setWipeShape('wipe_left');
                    else setFxKind('flash_dissolve');
                }
            }
        }
        function toggleMore(gridId) {
            const expanded = !document.getElementById(gridId).classList.contains('expanded');
            localStorage.setItem('vm-more-' + gridId, expanded);
            applyMoreState(gridId, expanded);
        }
        for (const gridId of Object.keys(MORE_BTN)) {
            if (localStorage.getItem('vm-more-' + gridId) === 'true') applyMoreState(gridId, true);
        }

        function updateFxAvailabilityUi() {
            document.querySelectorAll('.fx-only').forEach(b => {
                b.style.display = FX_AVAILABLE ? '' : 'none';
            });
            if (!FX_AVAILABLE && (transitionBase === 'wipe' || transitionBase === 'fx')) {
                setTransitionType('fade');
            }
        }

        function setTransitionDir(dir) {
            transitionDir = dir;
            document.querySelectorAll('.dir-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.dir === dir);
            });
        }

        function setDuration(seconds) {
            transitionDurationMs = Math.round(seconds * 1000);
            document.getElementById('durationInput').value = seconds;
            document.querySelectorAll('.duration-preset').forEach(b => {
                b.classList.toggle('active', parseFloat(b.textContent) === seconds);
            });
        }

        function onDurationInput() {
            const val = parseFloat(document.getElementById('durationInput').value);
            if (!isNaN(val) && val >= 0.1 && val <= 10) {
                transitionDurationMs = Math.round(val * 1000);
                document.querySelectorAll('.duration-preset').forEach(b => {
                    b.classList.toggle('active', parseFloat(b.textContent) === val);
                });
            }
        }

        // ---- UI update ----
        // Inputs that participate in a PiP composition (bg + every zone source).
        // Mirrors `collect_pip_inputs` in overlay.rs so the bus buttons and the
        // multiview status rings agree on what "visible via this PiP" means.
        // Mirror Rust `Zone::effective_sources`: cap to `capacity`, keeping
        // the newest entries, so the UI and the backend agree even if
        // sources outgrow capacity.
        function effectiveZoneSources(zone) {
            return (zone.capacity != null && zone.capacity < zone.sources.length)
                ? zone.sources.slice(zone.sources.length - zone.capacity)
                : zone.sources;
        }

        function collectPipInputs(pipCfg) {
            const set = new Set();
            if (!pipCfg) return set;
            if (pipCfg.bg != null) set.add(pipCfg.bg);
            for (const zone of pipCfg.zones) {
                for (const src of effectiveZoneSources(zone)) set.add(src);
            }
            return set;
        }

        function updateButtons() {
            // Inputs reachable through the PiP currently on each bus. Used to
            // shade the input buttons with a dimmer tally — dark red on PGM,
            // dark green on PVW — matching the multiview thumbnail rings.
            const pgmViaPip = currentPgmPip != null
                ? collectPipInputs(pipConfigs[currentPgmPip])
                : new Set();
            const pvwViaPip = currentPvwPip != null
                ? collectPipInputs(pipConfigs[currentPvwPip])
                : new Set();

            document.querySelectorAll('#pgmBus .src-btn').forEach((btn, i) => {
                btn.classList.toggle('pgm-active', currentPgm === i && currentPgmPip == null);
                btn.classList.toggle('pgm-via-pip', pgmViaPip.has(i));
            });
            document.querySelectorAll('#pvwBus .src-btn').forEach((btn, i) => {
                btn.classList.toggle('pvw-active', currentPvwPip == null && currentPvw === i);
                btn.classList.toggle('pvw-via-pip', pvwViaPip.has(i));
            });
            document.querySelectorAll('#pgmBus .pip-btn').forEach((btn, i) => {
                btn.classList.toggle('pgm-active', currentPgmPip === i);
            });
            document.querySelectorAll('#pvwBus .pip-btn').forEach((btn, i) => {
                btn.classList.toggle('pvw-active', currentPvwPip === i);
            });
            // Refresh PiP-row PGM/PVW tinting in-place (cheaper than rebuilding
            // the whole panel and doesn't disrupt an open layout editor).
            document.querySelectorAll('.pip-config-row[data-pip]').forEach((row) => {
                const p = parseInt(row.dataset.pip, 10);
                row.classList.toggle('on-pgm', currentPgmPip === p);
                row.classList.toggle('on-pvw', currentPvwPip === p);
            });
        }

        function setStatus(msg) {
            document.getElementById('statusText').textContent = msg;
        }

        // ---- Build bus buttons ----
        function buildBuses() {
            const pgmBus = document.getElementById('pgmBus');
            const pvwBus = document.getElementById('pvwBus');
            pgmBus.innerHTML = '';
            pvwBus.innerHTML = '';

            for (let i = 0; i < NUM_INPUTS; i++) {
                const label = INPUT_LABELS[i] || ('Input ' + (i + 1));
                const btnText = String(i + 1);
                const keyHint = i < 9 ? (i + 1) : (i === 9 ? '0' : '');

                // PGM indicator (display only — PGM changes via Take/Cut/Auto,
                // never via direct click). A <div> with the indicator modifier
                // strips the button affordance: no pointer cursor, no hover
                // state, no tab focus, no keyboard activation.
                const pgmBtn = document.createElement('div');
                pgmBtn.className = 'src-btn indicator' + (currentPgm === i ? ' pgm-active' : '');
                pgmBtn.textContent = btnText;
                pgmBtn.title = label;
                pgmBus.appendChild(pgmBtn);

                // PVW button (single select). Multi-source layouts are built via PiPs.
                const pvwBtn = document.createElement('button');
                pvwBtn.className = 'src-btn' + (currentPvw === i ? ' pvw-active' : '');
                pvwBtn.textContent = btnText;
                pvwBtn.title = label + (keyHint ? ' (' + keyHint + ')' : '');
                pvwBtn.onclick = () => selectPreview(i);
                pvwBus.appendChild(pvwBtn);
            }

            // PiP buttons after input buttons on both buses.
            // Slot number continues after the input range so keyboard shortcuts
            // line up: with 8 inputs, PiP1 is slot 9, PiP2 is slot 10 (key '0').
            for (let p = 0; p < NUM_PIPS; p++) {
                const slotNum = NUM_INPUTS + p + 1;
                const labelText = slotNum + ' - PiP' + (p + 1);
                const keyHint = slotNum <= 10 ? (slotNum === 10 ? '0' : String(slotNum)) : '';

                // PGM PiP indicator (display only — see PGM input indicator above).
                const pgmPipBtn = document.createElement('div');
                pgmPipBtn.className = 'pip-btn indicator' + (currentPgmPip === p ? ' pgm-active' : '');
                pgmPipBtn.textContent = labelText;
                pgmPipBtn.title = 'PiP ' + (p + 1);
                pgmBus.appendChild(pgmPipBtn);

                const pvwPipBtn = document.createElement('button');
                pvwPipBtn.className = 'pip-btn' + (currentPvwPip === p ? ' pvw-active' : '');
                pvwPipBtn.textContent = labelText;
