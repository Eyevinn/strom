                pvwPipBtn.title = 'Take PiP ' + (p + 1) + ' to PVW' + (keyHint ? ' (' + keyHint + ')' : '');
                pvwPipBtn.onclick = () => selectPreviewPip(p);
                pvwBus.appendChild(pvwPipBtn);
            }
        }

        // ---- PiP composition controls ----
        function selectPreviewPip(pipIdx) {
            apiPut('/preview', { source: { pip: pipIdx } })
                .then(r => {
                    currentPvw = (r.preview_input != null) ? r.preview_input : null;
                    currentPgm = (r.program_input != null) ? r.program_input : null;
                    currentPvwPip = (r.preview_pip != null) ? r.preview_pip : null;
                    currentPgmPip = (r.program_pip != null) ? r.program_pip : null;
                    updateButtons();
                    setStatus('PVW: PiP ' + (pipIdx + 1));
                })
                .catch(e => setStatus('Preview error: ' + e.message));
        }

        // Replace any non-finite number (NaN/Infinity) in rects and crops.
        // JSON.stringify turns NaN into null, which the backend rejects with
        // 422 — and since the poison stays in pipConfigs, every later update
        // for the PiP would fail too, freezing the editor until reload.
        function sanitizePipConfig(cfg) {
            const fin = (v, fb) => (Number.isFinite(v) ? v : fb);
            cfg.zones.forEach(z => {
                if (z.rect) {
                    z.rect.x = fin(z.rect.x, 0);
                    z.rect.y = fin(z.rect.y, 0);
                    z.rect.w = fin(z.rect.w, 1);
                    z.rect.h = fin(z.rect.h, 1);
                }
                if (z.border) z.border.width = fin(z.border.width, 0);
            });
            Object.keys(cfg.transforms || {}).forEach(k => {
                const c = cfg.transforms[k];
                if (!c) { delete cfg.transforms[k]; return; }
                c.left = fin(c.left, 0);
                c.top = fin(c.top, 0);
                c.right = fin(c.right, 0);
                c.bottom = fin(c.bottom, 0);
            });
        }

        function postPipConfig(pipIdx) {
            const cfg = pipConfigs[pipIdx];
            sanitizePipConfig(cfg);
            // Keep aspect-locked crops in sync with their destination boxes —
            // a zone resize/move changes the box aspect, and a stale crop
            // aspect would letterbox or distort the fill.
            refitLockedCrops(cfg);
            return apiPut('/pip/' + pipIdx, {
                bg: cfg.bg,
                zones: cfg.zones,
                transforms: cfg.transforms
            }).then(r => {
                pipConfigs[pipIdx] = {
                    bg: r.bg,
                    zones: (r.zones || []).map(z => ({
                        rect: z.rect ? { ...z.rect } : null,
                        capacity: z.capacity != null ? z.capacity : null,
                        sources: Array.isArray(z.sources) ? z.sources.slice() : [],
                        border: z.border ? { ...z.border } : null
                    })),
                    transforms: (r.transforms && typeof r.transforms === 'object')
                        ? JSON.parse(JSON.stringify(r.transforms))
                        : {}
                };
                // Keep activeZoneIdx within bounds after server-side cleanup.
                const nz = pipConfigs[pipIdx].zones.length;
                if (nz === 0) {
                    activeZoneIdx[pipIdx] = 0;
                } else if (activeZoneIdx[pipIdx] >= nz) {
                    activeZoneIdx[pipIdx] = nz - 1;
                }
                buildPipConfigPanel();
                // The via-pip tally on the input buttons depends on this PiP's
                // bg + zone sources, so refresh the buses too.
                updateButtons();
                setStatus(r.message);
            }).catch(e => setStatus('PiP config error: ' + e.message));
        }

        function setPipBg(pipIdx, bg) {
            const cfg = pipConfigs[pipIdx];
            cfg.bg = (bg === '' || bg === 'none') ? null : parseInt(bg, 10);
            // Bg can't simultaneously be a zone source; strip from every zone.
            if (cfg.bg != null) {
                cfg.zones.forEach(z => {
                    z.sources = z.sources.filter(s => s !== cfg.bg);
                });
            }
            postPipConfig(pipIdx);
        }

        // Select a zone as the active push target and point Crop/Zoom at its
        // first source — selecting a box usually means "work on this box".
        // (Picking another crop target in the dropdown stays sticky until the
        // next zone switch.)
        function selectZone(pipIdx, zoneIdx) {
            activeZoneIdx[pipIdx] = zoneIdx;
            const z = pipConfigs[pipIdx] && pipConfigs[pipIdx].zones[zoneIdx];
            const srcs = z ? effectiveZoneSources(z) : [];
            activeCropTarget = srcs.length > 0 ? srcs[0] : null;
        }

        // Toggle an input on the ACTIVE zone (the chips act as that zone's
        // checkboxes):
        //  - In the active zone → remove it.
        //  - In another zone → MOVE it to the active zone.
        //  - Not in any zone → push into the active zone (FIFO evicts oldest
        //    at capacity).
        // An input can only appear in one place at a time (single compositor pad).
        function toggleSourceOnActiveZone(pipIdx, input) {
            const cfg = pipConfigs[pipIdx];
            if (cfg.bg === input) return; // bg already occupies this input's pad
            const ziCur = Math.min(activeZoneIdx[pipIdx], Math.max(0, cfg.zones.length - 1));
            const inActiveZone = !!(cfg.zones[ziCur] && cfg.zones[ziCur].sources.includes(input));
            // Strip from every zone first (single pad — one place at a time).
            cfg.zones.forEach(z => {
                z.sources = z.sources.filter(s => s !== input);
            });
            if (inActiveZone) {
                // Unchecked: removed from the active zone.
                postPipConfig(pipIdx);
                return;
            }
            // Checked: push into the active zone (moving it if it sat in
            // another zone), evicting oldest if full.
            if (cfg.zones.length === 0) {
                cfg.zones.push({ rect: null, capacity: null, sources: [] });
                activeZoneIdx[pipIdx] = 0;
            }
            const zi = Math.min(activeZoneIdx[pipIdx], cfg.zones.length - 1);
            const zone = cfg.zones[zi];
            zone.sources.push(input);
            if (zone.capacity != null && zone.sources.length > zone.capacity) {
                zone.sources.splice(0, zone.sources.length - zone.capacity);
            }
            postPipConfig(pipIdx);
        }

        function removeSourceFromZone(pipIdx, zoneIdx, input) {
            const zone = pipConfigs[pipIdx].zones[zoneIdx];
            if (!zone) return;
            zone.sources = zone.sources.filter(s => s !== input);
            postPipConfig(pipIdx);
        }

        function addZone(pipIdx) {
            const cfg = pipConfigs[pipIdx];
            // Default new zone: right-half rect, unlimited capacity.
            cfg.zones.push({
                rect: { x: 0.55, y: 0.10, w: 0.42, h: 0.42 },
                capacity: null,
                sources: [],
                border: null
            });
            selectZone(pipIdx, cfg.zones.length - 1);
            postPipConfig(pipIdx);
        }

        function removeZone(pipIdx, zoneIdx) {
            pipConfigs[pipIdx].zones.splice(zoneIdx, 1);
            if (activeZoneIdx[pipIdx] >= pipConfigs[pipIdx].zones.length) {
                activeZoneIdx[pipIdx] = Math.max(0, pipConfigs[pipIdx].zones.length - 1);
            }
            postPipConfig(pipIdx);
        }

        // Set or clear the active zone's border. Width 0 clears it; the
        // border is the BOX's styling (it survives source swaps in the zone)
        // and is drawn live on the PGM output around the actual source boxes.
        function setZoneBorder(pipIdx, zoneIdx, color, width) {
            const zone = pipConfigs[pipIdx].zones[zoneIdx];
            if (!zone) return;
            const w = parseFloat(width);
            // The native color picker is 6-digit only; an API-set #RRGGBBAA
            // would lose its alpha on any re-commit (e.g. a width edit).
            // Keep the stored value while its RGB part is unchanged.
            const prev = zone.border && zone.border.color;
            if (prev && /^#[0-9a-fA-F]{8}$/.test(prev)
                && prev.slice(0, 7).toLowerCase() === String(color).toLowerCase()) {
                color = prev;
            }
            zone.border = (Number.isFinite(w) && w > 0)
                ? { color: color, width: w }
                : null;
            postPipConfig(pipIdx);
        }

        function setZoneCapacity(pipIdx, zoneIdx, value) {
            const zone = pipConfigs[pipIdx].zones[zoneIdx];
            if (!zone) return;
            const parsed = parseInt(value, 10);
            zone.capacity = (Number.isFinite(parsed) && parsed > 0) ? parsed : null;
            // Apply cap immediately to existing sources (drop oldest).
            if (zone.capacity != null && zone.sources.length > zone.capacity) {
                zone.sources.splice(0, zone.sources.length - zone.capacity);
            }
            postPipConfig(pipIdx);
        }

        // ---- Layout presets ----
        // Named snapshots of a full PiP composition: zones (rect/capacity/
        // border + sources by input index), bg, and all non-default crop
        // transforms. Crops are included even for sources currently outside
        // the PiP — strom retains those and re-applies them when the source
        // returns (swap-zone workflow), so a preset carries them too.
        // Stored browser-wide in localStorage so a preset saved on one
        // PiP/flow can be loaded on any other. Loading is best-effort:
        // sources, bg and crops whose input index does not exist on this
        // mixer are silently skipped; everything else applies.
        const PIP_PRESETS_KEY = 'vm-pip-layout-presets';
        let selectedPipPreset = '';

        function loadPipPresets() {
            try {
                const obj = JSON.parse(localStorage.getItem(PIP_PRESETS_KEY) || '{}');
                return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
            } catch (e) {
                return {};
            }
        }

        function storePipPresets(presets) {
            localStorage.setItem(PIP_PRESETS_KEY, JSON.stringify(presets));
        }

        function savePipLayoutPreset(pipIdx) {
            const cfg = pipConfigs[pipIdx];
            if (!cfg || cfg.zones.length === 0) {
                setStatus('No zones to save as a layout preset');
                return;
            }
            const name = (window.prompt('Layout preset name:', selectedPipPreset) || '').trim();
            if (!name) return;
            const presets = loadPipPresets();
            // Keep every non-default crop — including ones for sources not
            // currently in the PiP (strom retains those the same way).
            const transforms = {};
            Object.keys(cfg.transforms || {}).forEach(k => {
                const c = cfg.transforms[k];
                if (c && !cropIsZero(c)) transforms[k] = { ...c };
            });
            presets[name] = {
                bg: cfg.bg != null ? cfg.bg : null,
                zones: cfg.zones.map(z => ({
                    rect: z.rect ? { ...z.rect } : null,
                    capacity: z.capacity != null ? z.capacity : null,
                    sources: z.sources.slice(),
                    border: z.border ? { ...z.border } : null
                })),
                transforms: transforms
            };
            storePipPresets(presets);
            selectedPipPreset = name;
            buildPipConfigPanel();
            setStatus('Layout preset "' + name + '" saved');
        }

        function applyPipLayoutPreset(pipIdx, name) {
            const preset = loadPipPresets()[name];
            if (!preset || !Array.isArray(preset.zones)) {
                setStatus('Layout preset not found: ' + name);
                return;
            }
            const cfg = pipConfigs[pipIdx];
            // Best-effort: silently drop any input index that does not
            // exist on this mixer (preset may come from a bigger one), the
            // bg double-booked as a zone source, and cross-zone duplicates
            // — the backend rejects all three for the whole request.
            const validInput = i => Number.isInteger(i) && i >= 0 && i < NUM_INPUTS;
            cfg.bg = validInput(preset.bg) ? preset.bg : null;
            const seen = new Set();
            cfg.zones = preset.zones.map(z => ({
                rect: z.rect ? { ...z.rect } : null,
                capacity: z.capacity != null ? z.capacity : null,
                sources: (Array.isArray(z.sources) ? z.sources : [])
                    .filter(s => validInput(s) && s !== cfg.bg && !seen.has(s) && seen.add(s)),
                border: z.border ? { ...z.border } : null
            }));
            // Restore the full crop map — also entries for sources not in
            // the PiP right now; they re-apply when the source is pushed in.
            cfg.transforms = {};
            Object.keys(preset.transforms || {}).forEach(k => {
                const c = preset.transforms[k];
                if (c && validInput(parseInt(k, 10))) cfg.transforms[k] = { ...c };
            });
            selectZone(pipIdx, 0);
            postPipConfig(pipIdx);
        }

        function deletePipLayoutPreset(name) {
            if (!name) return;
            if (!window.confirm('Delete layout preset "' + name + '"?')) return;
            const presets = loadPipPresets();
            delete presets[name];
            storePipPresets(presets);
            if (selectedPipPreset === name) selectedPipPreset = '';
            buildPipConfigPanel();
            setStatus('Layout preset "' + name + '" deleted');
        }

        // Update one component of an explicit (non-auto) zone rect from a pixel
        // value entered into the X/Y/W/H toolbar inputs. Pixel values are in PGM
        // canvas coordinates (PGM_W × PGM_H); we divide by the same dimension
        // the backend uses on the way back (NormRect::to_pixels), so a round-trip
        // through px → norm → px lands on the same integer pixel.
        //
        // Position fields (x, y) preserve the current size; size fields (w, h)
        // preserve the current position. Out-of-range entries are clamped to
        // keep the rect inside [0,1].
        function setZoneRectPx(pipIdx, zoneIdx, field, pixelValue) {
            const zone = pipConfigs[pipIdx].zones[zoneIdx];
            if (!zone || !zone.rect) return;
            const parsed = parseFloat(pixelValue);
            if (!Number.isFinite(parsed)) return;
            const dim = (field === 'x' || field === 'w') ? PGM_W : PGM_H;
            // Snap the input value to a nearby anchor when snap is on. The
            // Detect variant also returns which anchor was hit so we can
            // flash the matching grid line during the network roundtrip
            // (postPipConfig rebuilds the panel on response and wipes the
            // highlight naturally).
            const res = snapEdgeDetect(parsed / dim);
            const norm = res.value;
            const next = { ...zone.rect };
            if (field === 'x') {
                next.x = Math.max(0, Math.min(1 - next.w, norm));
            } else if (field === 'y') {
                next.y = Math.max(0, Math.min(1 - next.h, norm));
            } else if (field === 'w') {
                next.w = Math.max(1 / PGM_W, Math.min(1 - next.x, norm));
            } else if (field === 'h') {
                next.h = Math.max(1 / PGM_H, Math.min(1 - next.y, norm));
            }
            zone.rect = next;
            if (res.anchor != null) {
                const canvas = document.querySelector('.pip-canvas[data-pip="' + pipIdx + '"]');
                const axis = (field === 'x' || field === 'w') ? 'x' : 'y';
                showSnapHighlight(canvas, axis, res.anchor);
            }
            postPipConfig(pipIdx);
        }

        // ---- Crop ("zoom"/punch-in) editor ----
        // The backend stores a normalized SourceCrop (edge fractions). The
        // editor works on the visible *window* instead: {x, y, w, h} in
        // source-normalized coordinates — what remains after cropping. The
        // window scales to fill the destination box, so window = punch-in.
        //
        // PGM aspect is only a *fallback* — every source can have its own
        // resolution/aspect, so all window math goes through srcAspectFor().
        const PGM_ASPECT = PGM_W / PGM_H;

        // Real aspect of an input's frames (negotiated caps), falling back to
        // the PGM aspect until caps are known.
        function srcAspectFor(input) {
            const r = INPUT_RESOLUTIONS[input];
            return (r && r.width > 0 && r.height > 0) ? (r.width / r.height) : PGM_ASPECT;
        }

        function getCrop(cfg, input) {
            const c = (cfg.transforms && cfg.transforms[input]) || {};
            return {
                left: c.left || 0, top: c.top || 0,
                right: c.right || 0, bottom: c.bottom || 0
            };
        }
        function cropIsZero(c) {
            return (c.left || 0) < 1e-4 && (c.top || 0) < 1e-4
                && (c.right || 0) < 1e-4 && (c.bottom || 0) < 1e-4;
        }
        function cropToWindow(c) {
            return {
                x: c.left, y: c.top,
                w: Math.max(0.05, 1 - c.left - c.right),
                h: Math.max(0.05, 1 - c.top - c.bottom)
            };
        }
        function windowToCrop(w) {
            const cl = v => Math.max(0, Math.min(1, v));
            return {
                left: cl(w.x), top: cl(w.y),
                right: cl(1 - w.x - w.w), bottom: cl(1 - w.y - w.h)
            };
        }
        function clampCropWindow(win) {
            const w = Math.max(0.05, Math.min(1, win.w));
            const h = Math.max(0.05, Math.min(1, win.h));
            return {
                x: Math.max(0, Math.min(1 - w, win.x)),
                y: Math.max(0, Math.min(1 - h, win.y)),
                w, h
            };
        }

        // Destination box aspect (real pixels) for an input inside the PiP.
        // A zone holding a single source fills its rect when cropped (mirrors
        // the backend resolve_zone_pads rule); multi-source zones auto-tile
        // into PGM-aspect cells, and the bg fills the PGM-aspect region.
        // Drives the aspect lock so the cropped window fills its box exactly
        // — nothing outside the box is visible.
        function cropBoxAspect(cfg, input) {
            for (const zone of cfg.zones) {
                const srcs = effectiveZoneSources(zone);
                if (!srcs.includes(input)) continue;
                if (srcs.length === 1) {
                    const r = zone.rect || { x: 0, y: 0, w: 1, h: 1 };
                    const wpx = r.w * PGM_W, hpx = r.h * PGM_H;
                    if (wpx > 0 && hpx > 0) return wpx / hpx;
                }
                return PGM_ASPECT;
            }
            return PGM_ASPECT; // bg (fills the region) or unplaced
        }

        // Window w/h ratio (in normalized source coords) that renders as the
        // real-pixel aspect `boxAspect` for a source with aspect `srcAspect`,
        // and the largest window with that ratio.
        function cropWindowRatio(boxAspect, srcAspect) { return boxAspect / srcAspect; }
        function maxCropWindow(ratio) {
            return ratio >= 1 ? { w: 1, h: 1 / ratio } : { w: ratio, h: 1 };
        }
        // Re-fit a window to a target ratio, keeping its center.
        function fitWindowToRatio(win, ratio) {
            let w = Math.min(win.w, win.h * ratio);
            let h = w / ratio;
            const cx = win.x + win.w / 2, cy = win.y + win.h / 2;
            return clampCropWindow({ x: cx - w / 2, y: cy - h / 2, w, h });
        }

        function commitCropWindow(pipIdx, input, win) {
            const cfg = pipConfigs[pipIdx];
            const crop = windowToCrop(clampCropWindow(win));
            if (cropIsZero(crop)) delete cfg.transforms[input];
            else cfg.transforms[input] = crop;
            postPipConfig(pipIdx);
        }

        // Re-fit every aspect-locked crop to its current destination box.
        // Single-source zones fill their rect when cropped, so the crop window
        // must track the rect's aspect as the operator reshapes the zone.
        // No-op when the lock is off or for windows that already fit.
        function refitLockedCrops(cfg) {
            if (!cropAspectLock || !cfg.transforms) return;
            for (const zone of cfg.zones) {
                const srcs = effectiveZoneSources(zone);
                if (srcs.length !== 1) continue;
                const input = srcs[0];
                const c = cfg.transforms[input];
                if (!c || cropIsZero(c)) continue;
                const ratio = cropWindowRatio(cropBoxAspect(cfg, input), srcAspectFor(input));
                const fitted = fitWindowToRatio(cropToWindow(getCrop(cfg, input)), ratio);
                cfg.transforms[input] = windowToCrop(fitted);
            }
        }
        function resetCrop(pipIdx, input) {
            delete pipConfigs[pipIdx].transforms[input];
            postPipConfig(pipIdx);
        }

        // Update one component of the crop window from a pixel value entered
        // in SOURCE coordinates. Position fields preserve size; size fields
        // preserve position (and the box aspect when the lock is on). Snap
        // applies like the zone px inputs, flashing the matching grid line on
        // the crop canvas during the roundtrip.
        function setCropWindowPx(pipIdx, input, field, pixelValue) {
            const cfg = pipConfigs[pipIdx];
            const parsed = parseFloat(pixelValue);
            if (!Number.isFinite(parsed)) return;
            const res = INPUT_RESOLUTIONS[input];
            const srcW = (res && res.width > 0) ? res.width : PGM_W;
            const srcH = (res && res.height > 0) ? res.height : PGM_H;
            const dim = (field === 'x' || field === 'w') ? srcW : srcH;
            const snapped = snapEdgeDetect(parsed / dim);
            const norm = snapped.value;
            const ratio = cropWindowRatio(cropBoxAspect(cfg, input), srcAspectFor(input));
            const next = { ...cropToWindow(getCrop(cfg, input)) };
            if (field === 'x') {
                next.x = norm;
            } else if (field === 'y') {
                next.y = norm;
            } else if (field === 'w') {
                next.w = norm;
                if (cropAspectLock) next.h = next.w / ratio;
            } else if (field === 'h') {
                next.h = norm;
                if (cropAspectLock) next.w = next.h * ratio;
            }
            if (snapped.anchor != null) {
                const canvas = document.querySelector('.pip-crop-canvas');
                const axis = (field === 'x' || field === 'w') ? 'x' : 'y';
                showSnapHighlight(canvas, axis, snapped.anchor);
            }
            commitCropWindow(pipIdx, input, next);
        }

        function buildCropSection(p, cfg) {
            const wrap = document.createElement('div');
            wrap.className = 'pip-crop-wrap';

            // Candidate targets: bg + every zone source. The backend RETAINS
            // transforms for sources that leave the PiP (they re-apply on
            // return — swap-zone workflow), but only present sources are
            // listed here: a retained crop is edited or Reset by bringing
            // its source back first.
            const targets = [];
            if (cfg.bg != null) targets.push(cfg.bg);
            cfg.zones.forEach(z => effectiveZoneSources(z).forEach(s => {
                if (!targets.includes(s)) targets.push(s);
            }));

            // Default target: the active zone's single source — the common
            // punch-in case ("zoom into the person in this box").
            if (activeCropTarget == null || !targets.includes(activeCropTarget)) {
                activeCropTarget = null;
                const az = cfg.zones[Math.min(activeZoneIdx[p], Math.max(0, cfg.zones.length - 1))];
                if (az) {
                    const srcs = effectiveZoneSources(az);
                    if (srcs.length === 1) activeCropTarget = srcs[0];
                }
            }

            const head = document.createElement('div');
            head.className = 'pip-editor-head';
            const title = document.createElement('span');
            title.className = 'pip-editor-title';
            title.textContent = 'Crop / Zoom';
            head.appendChild(title);
            const sel = document.createElement('select');
            sel.className = 'pip-crop-select';
            const none = document.createElement('option');
            none.value = '';
            none.textContent = '— select source —';
            sel.appendChild(none);
            targets.forEach(i => {
                const o = document.createElement('option');
                o.value = String(i);
                const cropped = !cropIsZero(getCrop(cfg, i));
                const res = INPUT_RESOLUTIONS[i];
                o.textContent = (INPUT_LABELS[i] || ('Input ' + (i + 1)))
                    + (cfg.bg === i ? ' (BG)' : '')
                    + (res ? ' · ' + res.width + '×' + res.height : '')
                    + (cropped ? ' ✂' : '');
                if (activeCropTarget === i) o.selected = true;
                sel.appendChild(o);
            });
            sel.onchange = () => {
                activeCropTarget = sel.value === '' ? null : parseInt(sel.value, 10);
                buildPipConfigPanel();
            };
            head.appendChild(sel);
            wrap.appendChild(head);

            const srcCanvas = document.createElement('div');
            srcCanvas.className = 'pip-crop-canvas';

            if (activeCropTarget == null) {
                const ph = document.createElement('div');
                ph.className = 'pip-crop-placeholder';
                ph.textContent = targets.length > 0
                    ? 'Select a source to crop/zoom'
                    : 'Add a source to the PiP first';
                srcCanvas.appendChild(ph);
                wrap.appendChild(srcCanvas);
                return wrap;
            }

            const input = activeCropTarget;
            const srcAspect = srcAspectFor(input);
            const boxAspect = cropBoxAspect(cfg, input);
            const ratio = cropWindowRatio(boxAspect, srcAspect);
            let win = cropToWindow(getCrop(cfg, input));

            // The source canvas mirrors the source frame — render it in the
            // source's real aspect so the framing reads true.
            srcCanvas.style.height =
                Math.max(72, Math.min(320, Math.round(320 / srcAspect))) + 'px';

            // Same snap-anchor grid as the zone canvas (quarters + thirds of
            // the source frame — framing a face on a third reads well).
            if (gridVisible) srcCanvas.appendChild(buildGridOverlay());

            const frame = document.createElement('div');
            frame.className = 'pip-crop-frame';
            const applyFrameStyle = (w) => {
                frame.style.left = (w.x * 100) + '%';
                frame.style.top = (w.y * 100) + '%';
                frame.style.width = (w.w * 100) + '%';
                frame.style.height = (w.h * 100) + '%';
            };
            applyFrameStyle(win);
            ['nw', 'ne', 'sw', 'se'].forEach(corner => {
                const h = document.createElement('div');
                h.className = 'zone-handle ' + corner;
                h.dataset.corner = corner;
                frame.appendChild(h);
            });
            srcCanvas.appendChild(frame);
            wrap.appendChild(srcCanvas);

            // Zoom slider: 1× = the largest window for the current aspect.
            // `input` events update the frame live; `change` commits via the
            // API (mirrors the drag-then-single-POST pattern).
            const zoomRow = document.createElement('div');
            zoomRow.className = 'pip-crop-zoom-row';
            zoomRow.append('Zoom');
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.min = '1';
            slider.max = '5';
            slider.step = '0.01';
            const zoomVal = document.createElement('span');
            zoomVal.className = 'pip-crop-zoom-val';
            const currentRatio = () => cropAspectLock ? ratio : (win.w / win.h);
            // Never report below 1×: an uncropped (full-frame) window shows as
            // 1.00× even though the largest box-aspect window would be smaller.
            const currentZoom = () => Math.max(1, maxCropWindow(currentRatio()).w / win.w);
            const syncZoomUi = () => {
                slider.value = String(Math.min(5, currentZoom()));
                zoomVal.textContent = currentZoom().toFixed(2) + '×';
            };
            const applyZoom = (z) => {
                const r = currentRatio();
                const mw = maxCropWindow(r);
                const cx = win.x + win.w / 2, cy = win.y + win.h / 2;
                const w = mw.w / z, h = mw.h / z;
                win = clampCropWindow({ x: cx - w / 2, y: cy - h / 2, w, h });
                applyFrameStyle(win);
                zoomVal.textContent = currentZoom().toFixed(2) + '×';
            };
            slider.oninput = () => applyZoom(parseFloat(slider.value));
            slider.onchange = () => commitCropWindow(p, input, win);
            syncZoomUi();
            zoomRow.appendChild(slider);
            zoomRow.appendChild(zoomVal);
            wrap.appendChild(zoomRow);

            // Pixel-precise crop window editor, in SOURCE pixels (each input
            // has its own resolution). X/Y = window top-left, W/H = window
            // size. Same snap + round-trip behavior as the zone px inputs.
            const res = INPUT_RESOLUTIONS[input];
            const srcW = (res && res.width > 0) ? res.width : PGM_W;
            const srcH = (res && res.height > 0) ? res.height : PGM_H;
            const winPx = {
                x: Math.round(win.x * srcW),
                y: Math.round(win.y * srcH),
                w: Math.round(win.w * srcW),
                h: Math.round(win.h * srcH),
            };
            const mkCropPxInput = (field, max) => {
                const inp = document.createElement('input');
                inp.className = 'pip-zone-px-input';
                inp.type = 'number';
                inp.min = (field === 'w' || field === 'h') ? '1' : '0';
                inp.max = String(max);
                inp.step = '1';
                inp.value = String(winPx[field]);
                inp.title = field.toUpperCase() + ' of the crop window in source pixels ('
                    + srcW + '×' + srcH + ')';
                inp.onchange = () => setCropWindowPx(p, input, field, inp.value);
                return inp;
            };
            const mkPxLabel = (text) => {
                const l = document.createElement('span');
                l.className = 'pip-zone-px-label';
                l.textContent = text;
                return l;
            };
            const cropCtrl = document.createElement('div');
            cropCtrl.className = 'pip-editor-ctrl';
            cropCtrl.appendChild(mkPxLabel('X'));
            cropCtrl.appendChild(mkCropPxInput('x', srcW));
            cropCtrl.appendChild(mkPxLabel('Y'));
            cropCtrl.appendChild(mkCropPxInput('y', srcH));
            cropCtrl.appendChild(mkPxLabel('W'));
            cropCtrl.appendChild(mkCropPxInput('w', srcW));
            cropCtrl.appendChild(mkPxLabel('H'));
            cropCtrl.appendChild(mkCropPxInput('h', srcH));
            wrap.appendChild(cropCtrl);

            const actions = document.createElement('div');
            actions.className = 'pip-crop-actions';
            const lockLabel = document.createElement('label');
            lockLabel.className = 'pip-zone-toggle';
            const lockCb = document.createElement('input');
            lockCb.type = 'checkbox';
            lockCb.checked = cropAspectLock;
            lockCb.onchange = () => {
                toggleCropAspectLock();
                // Turning the lock on re-fits the current window so the crop
                // fills the destination box without letterboxing.
                if (cropAspectLock && !cropIsZero(getCrop(cfg, input))) {
                    commitCropWindow(p, input, fitWindowToRatio(win, ratio));
                }
            };
            lockLabel.appendChild(lockCb);
            lockLabel.append(' Lock box aspect');
            lockLabel.title = 'Keep the crop window at the destination box aspect so it fills the box exactly';
            actions.appendChild(lockLabel);
            const resetBtn = document.createElement('button');
            resetBtn.className = 'pip-crop-reset-btn';
            resetBtn.textContent = 'Reset';
            resetBtn.title = 'Remove crop/zoom for this source';
            resetBtn.disabled = cropIsZero(getCrop(cfg, input));
            resetBtn.onclick = () => resetCrop(p, input);
            actions.appendChild(resetBtn);
            wrap.appendChild(actions);

            attachCropDrag(frame, srcCanvas, p, input, ratio, {
                get: () => win,
                set: (w) => { win = w; applyFrameStyle(win); syncZoomUi(); }
            });

            return wrap;
        }

        // Drag-and-resize for the crop window. Move = pan; corner handles =
        // zoom (aspect-locked to the destination box when the lock is on).
        // Sends a single POST on mouseup, like attachZoneDrag.
        function attachCropDrag(frameEl, canvasEl, pipIdx, input, ratio, winRef) {
            frameEl.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();
                const canvasRect = canvasEl.getBoundingClientRect();
                // A panel rebuild may have detached this canvas (0×0 rect) —
                // dividing by it would poison the window with NaN. Bail.
                if (!canvasEl.isConnected || canvasRect.width <= 0 || canvasRect.height <= 0) {
                    return;
                }
                const startX = e.clientX;
                const startY = e.clientY;
                const handle = e.target.closest('.zone-handle');
                const corner = handle ? handle.dataset.corner : null;
                let initial = { ...winRef.get() };
                // First interaction with the lock on: snap the window to the
                // box aspect so what you frame is exactly what fills the box.
                if (cropAspectLock) {
                    const fitted = fitWindowToRatio(initial, ratio);
                    if (Math.abs(fitted.w - initial.w) + Math.abs(fitted.h - initial.h) > 0.0001) {
                        initial = fitted;
                        winRef.set(fitted);
                    }
                }
                let dirty = false;

                const onMove = (ev) => {
                    const dx = (ev.clientX - startX) / canvasRect.width;
                    const dy = (ev.clientY - startY) / canvasRect.height;
                    let next = { ...initial };
                    // Snap anchors mirror the zone editor: quarters + thirds
                    // of the source frame. Track which anchor each axis hit
                    // so the matching grid line lights up.
                    let snapX = null;
                    let snapY = null;
                    if (!corner) {
                        const sx = snapMoveAxisDetect(initial.x + dx, initial.w);
                        const sy = snapMoveAxisDetect(initial.y + dy, initial.h);
                        next.x = sx.value;
                        next.y = sy.value;
                        snapX = sx.anchor;
                        snapY = sy.anchor;
                    } else {
                        const right = initial.x + initial.w;
                        const bottom = initial.y + initial.h;
                        if (corner === 'nw') {
                            const sx = snapEdgeDetect(initial.x + dx);
                            const sy = snapEdgeDetect(initial.y + dy);
                            next.x = sx.value;
                            next.y = sy.value;
                            next.w = right - next.x;
                            next.h = bottom - next.y;
                            snapX = sx.anchor;
                            snapY = sy.anchor;
                        } else if (corner === 'ne') {
                            const sy = snapEdgeDetect(initial.y + dy);
                            const sr = snapEdgeDetect(right + dx);
                            next.y = sy.value;
                            next.w = sr.value - initial.x;
                            next.h = bottom - next.y;
                            snapX = sr.anchor;
                            snapY = sy.anchor;
                        } else if (corner === 'sw') {
                            const sx = snapEdgeDetect(initial.x + dx);
                            const sb = snapEdgeDetect(bottom + dy);
                            next.x = sx.value;
                            next.w = right - next.x;
                            next.h = sb.value - initial.y;
                            snapX = sx.anchor;
                            snapY = sb.anchor;
                        } else if (corner === 'se') {
                            const sr = snapEdgeDetect(right + dx);
                            const sb = snapEdgeDetect(bottom + dy);
                            next.w = sr.value - initial.x;
                            next.h = sb.value - initial.y;
                            snapX = sr.anchor;
                            snapY = sb.anchor;
                        }
                        next.w = Math.max(0.05, next.w);
                        next.h = Math.max(0.05, next.h);
                        if (cropAspectLock) {
                            // Constrain to the box aspect, anchoring the corner
                            // opposite to the one being dragged. Height derives
                            // from width, so only the horizontal snap is real.
                            next.h = next.w / ratio;
                            if (next.h > 1) { next.h = 1; next.w = next.h * ratio; }
                            if (corner === 'nw' || corner === 'ne') {
                                next.y = bottom - next.h;
                            }
                            if (corner === 'nw' || corner === 'sw') {
                                next.x = right - next.w;
                            }
                            snapY = null;
                        }
                    }
                    next = clampCropWindow(next);
                    if (Math.abs(next.x - initial.x) + Math.abs(next.y - initial.y)
                        + Math.abs(next.w - initial.w) + Math.abs(next.h - initial.h) > 0.0001) {
                        dirty = true;
                    }
                    winRef.set(next);
                    clearSnapHighlights(canvasEl);
                    showSnapHighlight(canvasEl, 'x', snapX);
                    showSnapHighlight(canvasEl, 'y', snapY);
                };
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    clearSnapHighlights(canvasEl);
                    if (dirty) commitCropWindow(pipIdx, input, winRef.get());
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        function buildPipConfigPanel() {
            const panel = document.getElementById('pipConfigPanel');
            if (NUM_PIPS === 0) {
                panel.style.display = 'none';
                return;
            }
            panel.style.display = 'flex';
            panel.classList.toggle('editing', editingPipIdx != null);
            panel.innerHTML = '';

            // Presets are browser-global — parse localStorage once per
            // rebuild, not once per PiP.
            const presets = loadPipPresets();
            const presetNames = Object.keys(presets).sort((a, b) => a.localeCompare(b));

            for (let p = 0; p < NUM_PIPS; p++) {
                const cfg = pipConfigs[p] || { bg: null, zones: [], transforms: {} };
                const block = document.createElement('div');
                block.className = 'pip-config-block';

                const row = document.createElement('div');
                row.className = 'pip-config-row';
                row.dataset.pip = String(p);
                // Tint the row red/green when this PiP is currently on PGM/PVW.
                if (currentPgmPip === p) row.classList.add('on-pgm');
                else if (currentPvwPip === p) row.classList.add('on-pvw');

                const label = document.createElement('span');
                label.className = 'pip-config-label';
                label.textContent = 'PiP ' + (p + 1);
                row.appendChild(label);

                // Push chips — checkboxes for the ACTIVE zone: checked = in
                // the selected zone; a source sitting in another zone shows
                // dimmed (it's taken) and clicking it moves it here.
                const zi0 = Math.min(activeZoneIdx[p], Math.max(0, cfg.zones.length - 1));
                const activeZoneSources = new Set(cfg.zones[zi0] ? cfg.zones[zi0].sources : []);
                // input → 1-based zone number for sources in OTHER zones.
                const zoneOf = new Map();
                cfg.zones.forEach((z, k) => {
                    if (k !== zi0) z.sources.forEach(s => zoneOf.set(s, k + 1));
                });
                for (let i = 0; i < NUM_INPUTS; i++) {
                    const chip = document.createElement('span');
                    chip.className = 'pip-overlay-chip';
                    if (cfg.bg === i) {
                        chip.classList.add('disabled');
                        chip.title = 'Used as background';
                    } else {
                        if (activeZoneSources.has(i)) {
                            chip.title = 'Remove Input ' + (i + 1) + ' from zone Z' + (zi0 + 1);
                        } else if (zoneOf.has(i)) {
                            chip.title = 'Move Input ' + (i + 1) + ' from zone Z'
                                + zoneOf.get(i) + ' to zone Z' + (zi0 + 1);
                        } else {
                            chip.title = 'Push Input ' + (i + 1) + ' to zone Z' + (zi0 + 1);
                        }
                        chip.onclick = () => toggleSourceOnActiveZone(p, i);
                    }
                    if (activeZoneSources.has(i)) chip.classList.add('active');
                    else if (zoneOf.has(i)) chip.classList.add('elsewhere');
                    chip.textContent = String(i + 1);
                    row.appendChild(chip);
                }

                // Zone selector buttons (one per zone) — pick the active push target.
                // Hidden inside the editor (the canvas already conveys focus).
                if (editingPipIdx !== p) {
                    cfg.zones.forEach((z, zi) => {
                        const sel = document.createElement('button');
                        sel.className = 'pip-zone-selector' + (activeZoneIdx[p] === zi ? ' active' : '');
                        sel.title = 'Activate zone Z' + (zi + 1)
                            + (z.capacity != null ? ' (cap ' + z.capacity + ')' : '');
                        const lbl = document.createElement('span');
                        lbl.textContent = 'Z' + (zi + 1);
                        const cnt = document.createElement('span');
                        cnt.className = 'zone-count';
                        cnt.textContent = z.sources.length + (z.capacity != null ? '/' + z.capacity : '');
                        sel.appendChild(lbl);
                        sel.appendChild(cnt);
                        sel.onclick = () => {
                            selectZone(p, zi);
                            buildPipConfigPanel();
                        };
                        row.appendChild(sel);
                    });
                }

                const editBtn = document.createElement('button');
                editBtn.className = 'pip-edit-btn' + (editingPipIdx === p ? ' active' : '');
                editBtn.textContent = editingPipIdx === p ? 'Close' : 'Edit';
                editBtn.onclick = () => toggleEditPip(p);
                row.appendChild(editBtn);

                block.appendChild(row);

                if (editingPipIdx !== p) {
                    panel.appendChild(block);
                    continue;
                }

                // ---- Layout editor (only when this PiP is being edited) ----
                // Two equal columns — Zones and Crop/Zoom — each with a
                // header row holding its tools, the canvas, and compact
                // control rows beneath. One shared one-line legend at the
                // bottom replaces the old per-column hint paragraphs.
                const editor = document.createElement('div');
                editor.className = 'pip-editor';
                const editorRow = document.createElement('div');
                editorRow.className = 'pip-editor-row';

                const zoneCol = document.createElement('div');
                zoneCol.className = 'pip-editor-col';

                // Zones header: title, BG selector, add-zone, snap/grid.
                const zoneHead = document.createElement('div');
                zoneHead.className = 'pip-editor-head';
                const zoneTitle = document.createElement('span');
                zoneTitle.className = 'pip-editor-title';
                zoneTitle.textContent = 'Zones';
                zoneHead.appendChild(zoneTitle);
                const bgRow = document.createElement('label');
                bgRow.className = 'pip-zone-cap-row';
                bgRow.append('BG');
                bgRow.title = 'Background input (fills the PiP behind the zones)';
                const bgSel = document.createElement('select');
                bgSel.className = 'pip-bg-select';
                const noneOpt = document.createElement('option');
                noneOpt.value = '';
                noneOpt.textContent = 'None';
                bgSel.appendChild(noneOpt);
                for (let i = 0; i < NUM_INPUTS; i++) {
                    const o = document.createElement('option');
                    o.value = String(i);
                    o.textContent = INPUT_LABELS[i] || ('Input ' + (i + 1));
                    if (cfg.bg === i) o.selected = true;
                    bgSel.appendChild(o);
                }
                bgSel.onchange = () => setPipBg(p, bgSel.value);
                bgRow.appendChild(bgSel);
                zoneHead.appendChild(bgRow);
                const addBtn = document.createElement('button');
                addBtn.className = 'pip-zone-add-btn';
                addBtn.textContent = '+ Zone';
                addBtn.onclick = () => addZone(p);
                zoneHead.appendChild(addBtn);
                // Snap + grid toggles — shared by the zone canvas and the
                // crop canvas. State persists across reloads via localStorage.
                const snapLabel = document.createElement('label');
                snapLabel.className = 'pip-zone-toggle';
                const snapCb = document.createElement('input');
                snapCb.type = 'checkbox';
                snapCb.checked = snapEnabled;
                snapCb.onchange = () => toggleSnap();
                snapLabel.appendChild(snapCb);
                snapLabel.append(' Snap');
                snapLabel.title = 'Snap drag and pixel input to quarters and rule-of-thirds';
                zoneHead.appendChild(snapLabel);
                const gridLabel = document.createElement('label');
                gridLabel.className = 'pip-zone-toggle';
                const gridCb = document.createElement('input');
                gridCb.type = 'checkbox';
                gridCb.checked = gridVisible;
                gridCb.onchange = () => toggleGrid();
                gridLabel.appendChild(gridCb);
                gridLabel.append(' Grid');
                gridLabel.title = 'Show quarter (white) and rule-of-thirds (gold) guide lines';
                zoneHead.appendChild(gridLabel);
                zoneCol.appendChild(zoneHead);

                const canvas = document.createElement('div');
                canvas.className = 'pip-canvas';
                canvas.dataset.pip = String(p);

                const bgDiv = document.createElement('div');
                bgDiv.className = 'pip-canvas-bg';
                bgDiv.textContent = cfg.bg != null
                    ? ('BG: ' + (INPUT_LABELS[cfg.bg] || ('Input ' + (cfg.bg + 1))))
                    : '(no background)';
                canvas.appendChild(bgDiv);

                // Optional grid overlay: vertical + horizontal lines at every
                // snap anchor. Thirds get a brighter (gold) line so the rule-
                // of-thirds intersections read at a glance; quarters stay
                // subtle. Sits above the BG fill and below the zones.
                if (gridVisible) canvas.appendChild(buildGridOverlay());

                cfg.zones.forEach((zone, zi) => {
                    const isAuto = zone.rect == null;
                    const r = zone.rect || { x: 0, y: 0, w: 1, h: 1 };
                    const z = document.createElement('div');
                    z.className = 'pip-canvas-zone' + (isAuto ? ' auto' : '');
                    if (zi === activeZoneIdx[p]) z.classList.add('active');
                    z.style.left = (r.x * 100) + '%';
                    z.style.top = (r.y * 100) + '%';
                    z.style.width = (r.w * 100) + '%';
                    z.style.height = (r.h * 100) + '%';
                    z.style.zIndex = String(10 + zi);

                    // Header: zone label + capacity.
                    const header = document.createElement('div');
                    header.className = 'zone-header';
                    const hLabel = document.createElement('span');
                    hLabel.textContent = 'Z' + (zi + 1);
                    const hCap = document.createElement('span');
                    hCap.className = 'zone-cap';
                    hCap.textContent = zone.capacity != null ? ('cap ' + zone.capacity) : 'cap ∞';
                    header.appendChild(hLabel);
                    header.appendChild(hCap);
                    z.appendChild(header);

                    // Source chips inside zone — click = remove from zone.
                    const sourcesRow = document.createElement('div');
                    sourcesRow.className = 'zone-sources';
                    zone.sources.forEach(input => {
                        const sc = document.createElement('span');
                        sc.className = 'zone-source-chip';
                        sc.textContent = INPUT_LABELS[input] || ('In ' + (input + 1));
                        sc.title = 'Remove from zone';
                        sc.onclick = (ev) => {
                            ev.stopPropagation();
                            removeSourceFromZone(p, zi, input);
                        };
                        sourcesRow.appendChild(sc);
                    });
                    z.appendChild(sourcesRow);

                    ['nw', 'ne', 'sw', 'se'].forEach(corner => {
                        const h = document.createElement('div');
                        h.className = 'zone-handle ' + corner;
                        h.dataset.corner = corner;
                        z.appendChild(h);
                    });

                    const rm = document.createElement('button');
                    rm.className = 'zone-remove';
                    rm.textContent = '×';
                    rm.title = 'Remove zone';
                    rm.onclick = (e) => {
                        e.stopPropagation();
                        removeZone(p, zi);
                    };
                    z.appendChild(rm);

                    // Click anywhere on zone (except chips/handles/remove) = activate.
                    z.addEventListener('mousedown', (ev) => {
                        if (ev.target.closest('.zone-source-chip, .zone-remove')) return;
                        if (activeZoneIdx[p] !== zi) {
                            selectZone(p, zi);
                            buildPipConfigPanel();
                        }
                    });
                    // Right-click → toggle auto/manual rect.
                    z.oncontextmenu = (ev) => {
                        ev.preventDefault();
                        zone.rect = isAuto
                            ? { x: 0.55, y: 0.10, w: 0.42, h: 0.42 }
                            : null;
                        postPipConfig(p);
                    };

                    attachZoneDrag(z, canvas, p, zi);
                    canvas.appendChild(z);
                });

                zoneCol.appendChild(canvas);

                // Active-zone control row: pixel-precise rect (PGM canvas
                // coordinates, same round-trip formula as the backend's
                // NormRect::to_pixels) + capacity. Disabled for auto zones —
                // right-click the zone to promote it to a manual rect first.
                if (cfg.zones.length > 0) {
                    const zi = Math.min(activeZoneIdx[p], cfg.zones.length - 1);
                    const zone = cfg.zones[zi];
                    const zoneCtrl = document.createElement('div');
                    zoneCtrl.className = 'pip-editor-ctrl';
                    const zLbl = document.createElement('span');
                    zLbl.className = 'pip-editor-ctrl-label';
                    zLbl.textContent = 'Z' + (zi + 1);
                    zLbl.title = 'Active zone — click a zone in the canvas to switch';
                    zoneCtrl.appendChild(zLbl);

                    const isAuto = zone.rect == null;
                    const pxRect = isAuto
                        ? { x: 0, y: 0, w: PGM_W, h: PGM_H }
                        : {
                            x: Math.round(zone.rect.x * PGM_W),
                            y: Math.round(zone.rect.y * PGM_H),
                            w: Math.round(zone.rect.w * PGM_W),
                            h: Math.round(zone.rect.h * PGM_H),
                        };
                    const mkPxInput = (field, max) => {
                        const inp = document.createElement('input');
                        inp.className = 'pip-zone-px-input';
                        inp.type = 'number';
                        inp.min = (field === 'w' || field === 'h') ? '1' : '0';
                        inp.max = String(max);
                        inp.step = '1';
                        inp.value = String(pxRect[field]);
                        inp.disabled = isAuto;
                        inp.title = isAuto
                            ? 'Auto-tile mode — right-click the zone to set a manual rect'
                            : (field.toUpperCase() + ' in PGM pixels (' + PGM_W + '×' + PGM_H + ')');
                        inp.onchange = () => setZoneRectPx(p, zi, field, inp.value);
                        return inp;
                    };
                    const mkLbl = (text) => {
                        const l = document.createElement('span');
                        l.className = 'pip-zone-px-label';
                        l.textContent = text;
                        return l;
                    };
                    zoneCtrl.appendChild(mkLbl('X'));
                    zoneCtrl.appendChild(mkPxInput('x', PGM_W));
                    zoneCtrl.appendChild(mkLbl('Y'));
                    zoneCtrl.appendChild(mkPxInput('y', PGM_H));
                    zoneCtrl.appendChild(mkLbl('W'));
                    zoneCtrl.appendChild(mkPxInput('w', PGM_W));
                    zoneCtrl.appendChild(mkLbl('H'));
                    zoneCtrl.appendChild(mkPxInput('h', PGM_H));

                    zoneCtrl.append('cap');
                    const capInput = document.createElement('input');
                    capInput.className = 'pip-zone-cap-input';
                    capInput.type = 'number';
                    capInput.min = '1';
                    capInput.placeholder = '∞';
                    capInput.title = 'Max sources in the zone (oldest evicts when full)';
                    capInput.value = zone.capacity != null ? String(zone.capacity) : '';
                    capInput.onchange = () => setZoneCapacity(p, zi, capInput.value);
                    zoneCtrl.appendChild(capInput);

                    // Border: the box's styling — survives source swaps in the
                    // zone, drawn live on PGM around the actual source boxes.
                    // Width 0 (or blank) = no border.
                    zoneCtrl.append('border');
                    const borderColor = document.createElement('input');
                    borderColor.type = 'color';
                    borderColor.className = 'pip-zone-border-color';
                    borderColor.value = (zone.border && /^#[0-9a-fA-F]{6}/.test(zone.border.color))
                        ? zone.border.color.slice(0, 7)
                        : '#cc0000';
                    borderColor.title = 'Border color (drawn on PGM around each source box in the zone)';
                    const borderWidth = document.createElement('input');
                    borderWidth.className = 'pip-zone-cap-input';
                    borderWidth.type = 'number';
                    borderWidth.min = '0';
                    borderWidth.max = '64';
                    borderWidth.step = '1';
                    borderWidth.placeholder = '0';
                    borderWidth.title = 'Border width in PGM pixels (0 = no border)';
                    borderWidth.value = zone.border ? String(zone.border.width) : '';
                    const commitBorder = () =>
                        setZoneBorder(p, zi, borderColor.value, borderWidth.value);
                    borderColor.onchange = commitBorder;
                    borderWidth.onchange = commitBorder;
                    zoneCtrl.appendChild(borderColor);
                    zoneCtrl.appendChild(borderWidth);
                    zoneCol.appendChild(zoneCtrl);
                }

                // Layout preset row: save/load/delete named zone layouts
                // (geometry only) stored browser-wide in localStorage.
                const presetCtrl = document.createElement('div');
                presetCtrl.className = 'pip-editor-ctrl';
                const presetLbl = document.createElement('span');
                presetLbl.className = 'pip-editor-ctrl-label';
                presetLbl.textContent = 'Layout';
                presetLbl.title = 'Layout presets — full PiP composition: zones with sources, background, and crop/zoom settings';
                presetCtrl.appendChild(presetLbl);
                const presetSel = document.createElement('select');
                presetSel.className = 'pip-bg-select';
                const presetPh = document.createElement('option');
                presetPh.value = '';
                presetPh.textContent = presetNames.length ? '— preset —' : '(no presets)';
                presetSel.appendChild(presetPh);
                presetNames.forEach(n => {
                    const o = document.createElement('option');
                    o.value = n;
                    o.textContent = n;
                    if (selectedPipPreset === n) o.selected = true;
                    presetSel.appendChild(o);
                });
                presetSel.onchange = () => {
                    selectedPipPreset = presetSel.value;
                    buildPipConfigPanel();
                };
                presetCtrl.appendChild(presetSel);
                const mkPresetBtn = (text, title, handler, disabled) => {
                    const b = document.createElement('button');
                    b.className = 'pip-zone-add-btn';
                    b.textContent = text;
                    b.title = title;
                    b.disabled = !!disabled;
                    b.onclick = handler;
                    return b;
                };
                presetCtrl.appendChild(mkPresetBtn('Save',
                    'Save this PiP\'s full composition — zones, sources, background, and all crop/zoom settings (also for sources not currently in the PiP)',
                    () => savePipLayoutPreset(p),
                    cfg.zones.length === 0));
                presetCtrl.appendChild(mkPresetBtn('Load',
                    'Replace this PiP\'s composition with the preset (best effort — sources that do not exist on this mixer are skipped)',
                    () => applyPipLayoutPreset(p, selectedPipPreset),
                    !selectedPipPreset));
                presetCtrl.appendChild(mkPresetBtn('Delete',
                    'Delete the selected preset from this browser',
                    () => deletePipLayoutPreset(selectedPipPreset),
                    !selectedPipPreset));
                zoneCol.appendChild(presetCtrl);

                editorRow.appendChild(zoneCol);
                editorRow.appendChild(buildCropSection(p, cfg));
                editor.appendChild(editorRow);

                const footer = document.createElement('div');
                footer.className = 'pip-editor-footer';
                footer.textContent = 'Drag to move · corners resize · right-click zone toggles auto/manual rect · chips push/remove sources · zone px = PGM canvas, crop px = source';
                editor.appendChild(footer);

                block.appendChild(editor);
                panel.appendChild(block);
            }
        }

        // Snap anchors for layout rects: edges, quarters, and rule-of-thirds.
        // Thirds (1/3, 2/3) are broadcast composition guides — placing a PiP
        // overlay on a third often reads better than dead-center. Quarters
        // are kept for symmetric splits (left/right half, exact center).
        const SNAP_QUARTERS = [0.25, 0.5, 0.75];
        const SNAP_THIRDS = [1 / 3, 2 / 3];
        const SNAP_ANCHORS = [0, ...SNAP_QUARTERS, ...SNAP_THIRDS, 1].sort((a, b) => a - b);
        const SNAP_TOL = 0.022; // ~10px on a 480-px canvas; tight enough to not fight free dragging

        // Build the snap-anchor grid overlay (vertical + horizontal lines at
        // every anchor; thirds gold, quarters subtle). Shared between the
        // zone canvas and the crop canvas — `showSnapHighlight` finds the
        // lines via data-anchor inside whichever canvas hosts them.
        function buildGridOverlay() {
            const grid = document.createElement('div');
            grid.className = 'pip-canvas-grid';
            SNAP_ANCHORS.forEach(a => {
                if (a === 0 || a === 1) return; // edges are the canvas border
                const isThird = SNAP_THIRDS.some(t => Math.abs(t - a) < 1e-6);
                const cls = 'pip-grid-line ' + (isThird ? 'third' : 'quarter');
                const vl = document.createElement('div');
                vl.className = cls + ' v';
                vl.style.left = (a * 100) + '%';
                vl.dataset.anchor = String(a);
                grid.appendChild(vl);
                const hl = document.createElement('div');
                hl.className = cls + ' h';
                hl.style.top = (a * 100) + '%';
                hl.dataset.anchor = String(a);
                grid.appendChild(hl);
            });
            return grid;
        }

        // Snap a single coordinate to a nearby anchor. Returns the snapped
        // value plus the matched anchor (null when no snap happens or when
        // snapping is disabled). Caller passes `anchor` to showSnapHighlight
        // so the user sees which guide line locked the value in.
        function snapEdgeDetect(v) {
            if (!snapEnabled) return { value: v, anchor: null };
            for (const a of SNAP_ANCHORS) {
                if (Math.abs(v - a) < SNAP_TOL) return { value: a, anchor: a };
            }
            return { value: v, anchor: null };
        }

        // Snap a moving rect along one axis to whichever of {left edge, right
        // edge, center} is closest to a snap anchor. Returns the snapped
        // position plus the matched anchor so the caller can light it up.
        function snapMoveAxisDetect(pos, size) {
            if (!snapEnabled) return { value: pos, anchor: null };
            let bestDelta = SNAP_TOL;
            let bestPos = pos;
            let bestAnchor = null;
            for (const a of SNAP_ANCHORS) {
                const d1 = Math.abs(a - pos);
                if (d1 < bestDelta) { bestDelta = d1; bestPos = a; bestAnchor = a; }
                const d2 = Math.abs(a - (pos + size));
                if (d2 < bestDelta) { bestDelta = d2; bestPos = a - size; bestAnchor = a; }
                const d3 = Math.abs(a - (pos + size / 2));
                if (d3 < bestDelta) { bestDelta = d3; bestPos = a - size / 2; bestAnchor = a; }
            }
            return { value: bestPos, anchor: bestAnchor };
        }

        // Highlight the grid line for a given (axis, anchor). axis is 'x' for
        // a vertical line, 'y' for a horizontal one. Looks up the DOM element
        // by data-anchor; silently no-ops when grid lines aren't rendered
        // (gridVisible off) — the snap still happens, just without the cue.
        function showSnapHighlight(canvas, axis, anchor) {
            if (!canvas || anchor == null) return;
            const cls = axis === 'x' ? '.pip-grid-line.v' : '.pip-grid-line.h';
            const lines = canvas.querySelectorAll(cls);
            for (const el of lines) {
                if (Math.abs(parseFloat(el.dataset.anchor) - anchor) < 1e-6) {
                    el.classList.add('active-snap');
                    return;
                }
            }
        }

        function clearSnapHighlights(canvas) {
            if (!canvas) return;
            canvas.querySelectorAll('.pip-grid-line.active-snap')
                .forEach(el => el.classList.remove('active-snap'));
        }

        // Drag-and-resize handler for a zone. Promotes auto zones to explicit
        // on first drag. Sends a single POST on mouseup.
        function attachZoneDrag(zoneEl, canvas, pipIdx, zoneIdx) {
            zoneEl.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                if (e.target.closest('.zone-source-chip, .zone-remove, .zone-cap-input')) return;
                const handle = e.target.closest('.zone-handle');
                e.preventDefault();
                e.stopPropagation();
                const canvasRect = canvas.getBoundingClientRect();
                // The zone-activation listener on this element may have just
                // rebuilt the panel (same mousedown event) — this element and
                // its canvas are then detached and the rect is 0×0. Dividing
                // by it would poison the rect with NaN, so bail; the user
                // drags again on the freshly-built zone.
                if (!canvas.isConnected || canvasRect.width <= 0 || canvasRect.height <= 0) {
                    return;
                }
                const startX = e.clientX;
                const startY = e.clientY;
                const cfg = pipConfigs[pipIdx];
                const zone = cfg.zones[zoneIdx];
                if (!zone) return;
                // Promote auto zone to a manual rect at its current rendered
                // position so the user doesn't see a jump.
                const initial = zone.rect ? { ...zone.rect } : { x: 0, y: 0, w: 1, h: 1 };
                const corner = handle ? handle.dataset.corner : null;
                let dirty = false;

                const onMove = (ev) => {
                    const dx = (ev.clientX - startX) / canvasRect.width;
                    const dy = (ev.clientY - startY) / canvasRect.height;
                    let next = { ...initial };
                    // Track which anchor (if any) each axis snapped to so we
                    // can light up the matching grid line. Move snaps once
                    // per axis; resize snaps the dragged edges (which may be
                    // left or right, top or bottom depending on the corner).
                    let snapX = null;
                    let snapY = null;
                    if (!corner) {
                        // Move: snap to whichever of {left, right, center} is closest
                        // to an anchor — gives a satisfying detent at canvas-center.
                        const sx = snapMoveAxisDetect(initial.x + dx, initial.w);
                        const sy = snapMoveAxisDetect(initial.y + dy, initial.h);
                        next.x = sx.value;
                        next.y = sy.value;
                        snapX = sx.anchor;
                        snapY = sy.anchor;
                    } else {
                        // Resize: only the dragged corner snaps. The anchor each
                        // dragged edge lands on is what we light up.
                        const right = initial.x + initial.w;
                        const bottom = initial.y + initial.h;
                        if (corner === 'nw') {
                            const sx = snapEdgeDetect(initial.x + dx);
                            const sy = snapEdgeDetect(initial.y + dy);
                            next.x = sx.value;
                            next.y = sy.value;
                            next.w = right - next.x;
                            next.h = bottom - next.y;
                            snapX = sx.anchor;
                            snapY = sy.anchor;
                        } else if (corner === 'ne') {
                            const sy = snapEdgeDetect(initial.y + dy);
                            const sr = snapEdgeDetect(right + dx);
                            next.y = sy.value;
                            next.w = sr.value - initial.x;
                            next.h = bottom - next.y;
                            snapX = sr.anchor;
                            snapY = sy.anchor;
                        } else if (corner === 'sw') {
                            const sx = snapEdgeDetect(initial.x + dx);
                            const sb = snapEdgeDetect(bottom + dy);
                            next.x = sx.value;
                            next.w = right - next.x;
                            next.h = sb.value - initial.y;
                            snapX = sx.anchor;
                            snapY = sb.anchor;
                        } else if (corner === 'se') {
                            const sr = snapEdgeDetect(right + dx);
                            const sb = snapEdgeDetect(bottom + dy);
                            next.w = sr.value - initial.x;
                            next.h = sb.value - initial.y;
                            snapX = sr.anchor;
                            snapY = sb.anchor;
                        }
                    }
                    next.w = Math.max(0.05, Math.min(1, next.w));
                    next.h = Math.max(0.05, Math.min(1, next.h));
                    next.x = Math.max(0, Math.min(1 - next.w, next.x));
                    next.y = Math.max(0, Math.min(1 - next.h, next.y));
                    if (Math.abs(next.x - initial.x) + Math.abs(next.y - initial.y)
                        + Math.abs(next.w - initial.w) + Math.abs(next.h - initial.h) > 0.0001) {
                        dirty = true;
                    }
                    zone.rect = next;
                    zoneEl.classList.remove('auto');
                    zoneEl.style.left = (next.x * 100) + '%';
                    zoneEl.style.top = (next.y * 100) + '%';
                    zoneEl.style.width = (next.w * 100) + '%';
                    zoneEl.style.height = (next.h * 100) + '%';
                    // Update snap-line highlights. Clears any stale highlight
                    // first so a line doesn't stay lit after the snap is lost.
                    clearSnapHighlights(canvas);
                    showSnapHighlight(canvas, 'x', snapX);
                    showSnapHighlight(canvas, 'y', snapY);
                };
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    clearSnapHighlights(canvas);
                    if (dirty) postPipConfig(pipIdx);
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        // ---- Keyboard shortcuts ----
        document.addEventListener('keydown', (e) => {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
            if (e.target.isContentEditable) return;
            // Let the browser keep its own modifier-key shortcuts (Ctrl+0 reset
            // zoom, Ctrl+F find, Ctrl+R reload, Cmd+...). Shift is fine — we
            // already accept "X" and "x" for the same action.
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            // 1-9, 0 = select PVW. Slots continue past NUM_INPUTS into PiPs,
            // so with 8 inputs key '9' picks PiP1 and key '0' picks PiP2.
            if ((e.key >= '1' && e.key <= '9') || e.key === '0') {
                const slot = e.key === '0' ? 9 : (parseInt(e.key) - 1);
                if (slot < NUM_INPUTS) {
                    selectPreview(slot);
                } else if (slot < NUM_INPUTS + NUM_PIPS) {
                    selectPreviewPip(slot - NUM_INPUTS);
                }
                e.preventDefault();
                return;
            }

            // Space = AUTO
            if (e.key === ' ' || e.key === 'Enter') {
                doAuto();
                e.preventDefault();
                return;
            }

            // X = CUT
            if (e.key === 'x' || e.key === 'X') {
                doCut();
                e.preventDefault();
                return;
            }

            // F = FTB
            if (e.key === 'f' || e.key === 'F') {
                doFtb();
                e.preventDefault();
                return;
            }

            // M = toggle minimize controls
            if (e.key === 'm' || e.key === 'M') {
                toggleMinimize();
                e.preventDefault();
                return;
            }
        });

        document.addEventListener('keyup', (e) => {
        });

        // ---- Connection status helpers ----
        function setDot(id, state) {
            const el = document.getElementById(id);
            el.className = 'conn-dot ' + state; // 'ok', 'err', 'warn', or ''
        }

        // ---- WHEP multiview connection ----
        let whepConnection = null;
        let videoStallTimer = null;
        let lastVideoTime = 0;

        function startVideoStallDetection() {
            if (videoStallTimer) clearInterval(videoStallTimer);
            videoStallTimer = setInterval(() => {
                const video = document.getElementById('multiviewVideo');
                if (!video.srcObject) return;
                if (video.readyState >= 2 && video.currentTime === lastVideoTime && !video.paused) {
                    setDot('whepDot', 'warn');
                } else if (video.readyState >= 2) {
                    setDot('whepDot', 'ok');
                }
                lastVideoTime = video.currentTime;
            }, 2000);
        }

        async function connectMultiview() {
            // Fetch multiview endpoint from API (may change between restarts)
            try {
                const resp = await fetch(API_BASE + '/multiview-endpoint');
                if (resp.ok) {
                    const data = await resp.json();
                    MULTIVIEW_ENDPOINT = data.endpoint || '';
                }
            } catch (e) {
                // Fall back to config value
            }

            if (!MULTIVIEW_ENDPOINT) {
                setStatus('No multiview endpoint configured');
                setDot('whepDot', 'err');
                return;
            }

            const endpoint = location.protocol + '//' + location.host + MULTIVIEW_ENDPOINT;
            setDot('whepDot', 'warn');

            if (whepConnection) {
                whepConnection.callbacks = {};
                whepConnection.close();
                whepConnection = null;
            }

            whepConnection = new WhepConnection(endpoint, {
                onVideoTrack: (stream) => {
                    const video = document.getElementById('multiviewVideo');
                    video.srcObject = stream;
                    video.play().catch(() => {});
                    startVideoStallDetection();
                },
                onAudioTrack: () => {},
                onConnected: () => {
                    setDot('whepDot', 'ok');
                    setStatus('Connected');
                },
                onMediaStatus: () => {},
                onError: (msg) => {
                    setDot('whepDot', 'err');
                    setStatus('Video error: ' + msg);
                    setTimeout(connectMultiview, 5000);
                },
                onDisconnected: () => {
                    setDot('whepDot', 'err');
                    setStatus('Video disconnected - reconnecting...');
                    setTimeout(connectMultiview, 3000);
                },
                onIceState: () => {},
                onLog: () => {}
            });
            whepConnection.connect();
        }

        // ---- WebSocket for state sync ----
        let ws = null;

        // Fetch current server state to resync after WS reconnect
        async function resyncState() {
            try {
                // Fetch the page HTML and parse the embedded config JSON
                const resp = await fetch(location.pathname);
                if (!resp.ok) return;
                const html = await resp.text();
                const match = html.match(/<script id="vm-config" type="application\/json">([\s\S]*?)<\/script>/);
                if (!match) return;
                const cfg = JSON.parse(match[1]);
                currentPgm = (cfg.initial_pgm != null) ? cfg.initial_pgm : null;
