                currentPvw = (cfg.initial_pvw != null) ? cfg.initial_pvw : null;
                ftbActive = cfg.ftb_active || false;
                dskEnabled = cfg.dsk_states || [true, true, true, true];
                overlayAlpha = cfg.overlay_alpha != null ? cfg.overlay_alpha : 1.0;
                updateButtons();
                updateFtbButton();
                updateDskButtons();
                updateOverlayAlphaUi();
                fetchFxState();
                setStatus('Reconnected - state synced');
            } catch (e) {
                setStatus('Resync failed: ' + e.message);
            }
        }

        function connectWebSocket() {
            const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(wsProto + '//' + location.host + '/api/ws');

            ws.onopen = () => {
                setDot('wsDot', 'ok');
                resyncState();
            };

            ws.onmessage = (e) => {
                try {
                    const event = JSON.parse(e.data);
                    if (event.type === 'VisionMixerStateChanged' && event.data) {
                        const d = event.data;
                        if (d.flow_id === FLOW_ID && d.block_id === BLOCK_ID) {
                            currentPvw = (d.preview_input != null) ? d.preview_input : null;
                            currentPgm = (d.program_input != null) ? d.program_input : null;
                            currentPvwPip = (d.preview_pip != null) ? d.preview_pip : null;
                            currentPgmPip = (d.program_pip != null) ? d.program_pip : null;
                            updateButtons();
                        }
                    }
                    if (event.type === 'VisionMixerDskChanged' && event.data) {
                        const d = event.data;
                        if (d.flow_id === FLOW_ID && d.block_id === BLOCK_ID) {
                            dskEnabled[d.dsk - 1] = d.enabled;
                            updateDskButtons();
                        }
                    }
                    if (event.type === 'VisionMixerFtbChanged' && event.data) {
                        const d = event.data;
                        if (d.flow_id === FLOW_ID && d.block_id === BLOCK_ID) {
                            ftbActive = d.active;
                            updateFtbButton();
                        }
                    }
                    if (event.type === 'VisionMixerEffectChanged' && event.data) {
                        const d = event.data;
                        if (d.flow_id === FLOW_ID && d.block_id === BLOCK_ID) {
                            if (d.target === 'master') masterEffect = d.effect;
                            else if (d.target && d.target.input != null) inputEffects[d.target.input] = d.effect;
                            // Don't rebuild under the operator's pointer mid-drag.
                            if (!document.getElementById('fxPanel').contains(document.activeElement)) {
                                buildFxPanel();
                            }
                        }
                    }
                    if (event.type === 'VisionMixerOverlayAlphaChanged' && event.data) {
                        const d = event.data;
                        if (d.flow_id === FLOW_ID && d.block_id === BLOCK_ID && !overlayAlphaDragging) {
                            overlayAlpha = d.alpha;
                            updateOverlayAlphaUi();
                        }
                    }
                } catch {}
            };

            ws.onclose = () => {
                setDot('wsDot', 'err');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = () => setDot('wsDot', 'err');
        }

        // ---- Init ----
        window.onload = () => {
            document.title = 'Vision Mixer | Strom | ' + location.host;
            buildBuses();
            updateButtons();
            initDskUi();
            buildPipConfigPanel();
            updateFtbButton();
            updateFxAvailabilityUi();
            fetchFxState();
            connectMultiview();
            connectWebSocket();
            if (controlsMinimized) document.body.classList.add('minimized');
        };
    </script>
</body>
</html>
